          <div class="gauge"><div class="g-l">P<sub>loss</sub> = i²R</div><div class="g-v" style="font-size:16px;color:#ff6b81"><span id="g_pl">0</span></div><div class="mini">W</div></div>
          <div class="gauge"><div class="g-l">P<sub>conv</sub> = e·i</div><div class="g-v" style="font-size:16px;color:#ffcc66"><span id="g_pc">0</span></div><div class="mini">W</div></div>
          <div class="gauge"><div class="g-l">P<sub>mech</sub> = F<sub>app</sub>·v</div><div class="g-v" style="font-size:16px;color:#5b8cff"><span id="g_pm">0</span></div><div class="mini">W</div></div>
        </div>
        <p class="mini" style="margin:6px 0 0">Energy balance: P<sub>batt</sub> = P<sub>loss</sub> + P<sub>conv</sub>, and P<sub>conv</sub> = −P<sub>mech</sub> (steady). Motor: battery → bar → load. Generator: F<sub>app</sub> → bar → battery (P<sub>batt</sub> negative = charging).</p>
      </div>
    </div>
    <canvas id="aCan" width="900" height="220" style="width:100%;margin-top:12px"></canvas>
    <canvas id="aPlot" width="900" height="180" style="width:100%;margin-top:8px"></canvas>
    <p class="note">Watch it: at start e<sub>ind</sub>=0 so current (and force) spike, the bar accelerates, e<sub>ind</sub> rises, current falls, and it settles at v=V<sub>B</sub>/Bl. Push F<sub>app</sub> left → motor slows; pull right → generator speeds up and current reverses (battery charges).</p>
  </div>

  <h3>Steady-state solver <span class="badge">Example 1‑10</span></h3>
  <div class="card">
    <div class="grid2">
      <label class="ctl"><span class="lab">V<sub>B</sub> (V)</span><input type="number" id="L_V" value="120" step="any"></label>
      <label class="ctl"><span class="lab">R (Ω)</span><input type="number" id="L_R" value="0.3" step="any"></label>
      <label class="ctl"><span class="lab">B (T)</span><input type="number" id="L_B" value="0.1" step="any"></label>
      <label class="ctl"><span class="lab">l (m)</span><input type="number" id="L_l" value="10" step="any"></label>
    </div>
    <label class="ctl"><span class="lab">Applied force (N): + right (gen) / − left (motor)</span><input type="range" id="L_F" min="-50" max="50" value="0" step="1"></label>
    <div class="out" id="L_out"></div>
  </div>`;

  /* animation */
  const aCan=$('#aCan'),ax=aCan.getContext('2d'),aPlot=$('#aPlot'),px=aPlot.getContext('2d');
  let st={v:0,x:120,t:0,running:false,hist:[]};
  const P=()=>({V:+$('#a_V').value,R:+$('#a_R').value,B:+$('#a_B').value,l:+$('#a_l').value,m:+$('#a_m').value,F:+$('#a_F').value});
  const lbl=()=>{const p=P();$('#a_V_v').textContent=p.V+' V';$('#a_R_v').textContent=p.R+' Ω';$('#a_B_v').textContent=p.B+' T';$('#a_l_v').textContent=p.l+' m';$('#a_m_v').textContent=p.m+' kg';$('#a_F_v').textContent=p.F+' N';};
  ['a_V','a_R','a_B','a_l','a_m','a_F'].forEach(id=>$('#'+id).oninput=lbl);lbl();
  function reset(){st.v=0;st.x=120;st.t=0;st.hist=[];draw();}
  function step(dt){
    const p=P(),Bl=p.B*p.l;
    // substeps for stability
    const sub=20,h=dt/sub;
    for(let s=0;s<sub;s++){
      const eind=st.v*Bl, i=(p.V-eind)/p.R, Find=i*Bl, Fnet=Find+p.F, a=Fnet/p.m;
      st.v+=a*h; st.x+=st.v*h*6; st.t+=h;
    }
    const eind=st.v*Bl,i=(p.V-eind)/p.R;
    st.hist.push({t:st.t,v:st.v,i:i});if(st.hist.length>600)st.hist.shift();
    // wrap position
    if(st.x>820)st.x=120; if(st.x<120)st.x=120;
    $('#g_v').textContent=fmt(st.v,1);$('#g_i').textContent=fmt(i,1);$('#g_e').textContent=fmt(eind,1);
    $('#g_pb').textContent=fmt(p.V*i,0);$('#g_pl').textContent=fmt(i*i*p.R,0);$('#g_pc').textContent=fmt(eind*i,0);$('#g_pm').textContent=fmt(p.F*st.v,0);
    let mode,box='okbox';
    if(Math.abs(p.F)<0.5&&Math.abs(i)<0.5)mode='No-load steady state (v ≈ V_B/Bl)';
    else if(p.F>0){mode='GENERATOR — pulled right, current reversed, battery charging';box='okbox';}
    else if(p.F<0){mode='MOTOR — driving load to the right';box='okbox';}
    else mode='Accelerating…';
    const mb=$('#a_mode');mb.className=box;mb.textContent=mode;
  }
  function draw(){
    ax.clearRect(0,0,900,220);
    // rails
    ax.strokeStyle='#3a4570';ax.lineWidth=4;ax.beginPath();ax.moveTo(60,60);ax.lineTo(860,60);ax.moveTo(60,180);ax.lineTo(860,180);ax.stroke();
    // field ×
    ax.fillStyle='#232a49';ax.font='13px system-ui';for(let a=0;a<16;a++)for(let b=0;b<2;b++)ax.fillText('×',110+a*46,100+b*44);
    // battery+R at left
    ax.strokeStyle='#5b8cff';ax.lineWidth=2;ax.beginPath();ax.moveTo(60,60);ax.lineTo(30,60);ax.lineTo(30,180);ax.lineTo(60,180);ax.stroke();
    ax.fillStyle='#5b8cff';ax.fillText('V_B',6,124);
    // bar
    const bx=st.x;ax.strokeStyle='#38d39f';ax.lineWidth=6;ax.beginPath();ax.moveTo(bx,54);ax.lineTo(bx,186);ax.stroke();
    ax.fillStyle='#38d39f';ax.fillText('bar',bx-8,44);
    // velocity arrow
    const p=P();if(Math.abs(st.v)>0.1){const dir=st.v>0?1:-1,L=Math.min(70,10+Math.abs(st.v));ax.strokeStyle='#ffcc66';ax.lineWidth=3;ax.beginPath();ax.moveTo(bx,120);ax.lineTo(bx+dir*L,120);ax.stroke();ax.beginPath();ax.moveTo(bx+dir*L,120);ax.lineTo(bx+dir*L-dir*8,114);ax.moveTo(bx+dir*L,120);ax.lineTo(bx+dir*L-dir*8,126);ax.stroke();ax.fillStyle='#ffcc66';ax.fillText('v',bx+dir*L,112);}
    // applied force arrow
    if(Math.abs(p.F)>0.5){const dir=p.F>0?1:-1,L=Math.min(60,15+Math.abs(p.F));ax.strokeStyle='#ff6b81';ax.lineWidth=3;ax.beginPath();ax.moveTo(bx,160);ax.lineTo(bx+dir*L,160);ax.stroke();ax.beginPath();ax.moveTo(bx+dir*L,160);ax.lineTo(bx+dir*L-dir*8,154);ax.moveTo(bx+dir*L,160);ax.lineTo(bx+dir*L-dir*8,166);ax.stroke();ax.fillStyle='#ff6b81';ax.fillText('F_app',bx+dir*L-10,176);}
    ax.fillStyle='#9aa3c4';ax.fillText('B into page',380,210);
    // current arrows around the loop + induced force on the bar
    const Bl=p.B*p.l,ii=(p.V-st.v*Bl)/p.R,Find=ii*Bl;
    if(Math.abs(ii)>0.5){const d=ii>0?1:-1,ca=`rgba(56,211,159,${(0.35+0.65*Math.min(1,Math.abs(ii)/60)).toFixed(2)})`;
      const tri=(x,y,ddx,ddy)=>{ax.fillStyle=ca;ax.beginPath();ax.moveTo(x+8*ddx,y+8*ddy);ax.lineTo(x-5*ddx+5*ddy,y-5*ddy-5*ddx);ax.lineTo(x-5*ddx-5*ddy,y-5*ddy+5*ddx);ax.closePath();ax.fill();};
      [100,240,380,520,660].forEach(x=>{if(x<bx-30){tri(x,60,d,0);tri(x,180,-d,0);}});
      tri(bx,120,0,d);ax.fillStyle=ca;ax.fillText('i',bx-16,124);}
    if(Math.abs(Find)>0.5){const d=Find>0?1:-1,L=Math.min(80,8+Math.abs(Find)*0.6);ax.strokeStyle='#38d39f';ax.lineWidth=3;ax.beginPath();ax.moveTo(bx,86);ax.lineTo(bx+d*L,86);ax.stroke();ax.beginPath();ax.moveTo(bx+d*L,86);ax.lineTo(bx+d*L-d*8,80);ax.moveTo(bx+d*L,86);ax.lineTo(bx+d*L-d*8,92);ax.stroke();ax.fillStyle='#38d39f';ax.fillText('F_ind = ilB',bx+d*L+(d>0?4:-70),82);}
    // plots
    drawPlot();
  }
  function drawPlot(){
    const W=900,H=180,pl=40,mid=H/2;px.clearRect(0,0,W,H);
    px.strokeStyle='#232a49';px.beginPath();px.moveTo(pl,mid);px.lineTo(W-10,mid);px.stroke();
    if(st.hist.length<2)return;
    const t0=st.hist[0].t,t1=st.hist[st.hist.length-1].t,span=Math.max(t1-t0,0.1);
    const vmax=Math.max(...st.hist.map(h=>Math.abs(h.v)),1),imax=Math.max(...st.hist.map(h=>Math.abs(h.i)),1);
    const xX=t=>pl+(t-t0)/span*(W-pl-10);
    px.strokeStyle='#ffcc66';px.lineWidth=2;px.beginPath();st.hist.forEach((h,k)=>{const x=xX(h.t),y=mid-h.v/vmax*(mid-14);k===0?px.moveTo(x,y):px.lineTo(x,y);});px.stroke();
    px.strokeStyle='#38d39f';px.beginPath();st.hist.forEach((h,k)=>{const x=xX(h.t),y=mid-h.i/imax*(mid-14);k===0?px.moveTo(x,y):px.lineTo(x,y);});px.stroke();
    px.fillStyle='#ffcc66';px.font='12px system-ui';px.fillText('v(t)',pl+4,16);px.fillStyle='#38d39f';px.fillText('i(t)',pl+44,16);
  }
  let raf=null,last=0;
  function loop(ts){
    if(!st.running)return;
    if(!$('#sec-linear').classList.contains('on')){st.running=false;$('#a_run').textContent='▶ Start';return;}
    const dt=Math.min((ts-last)/1000||0.016,0.05);last=ts;
    step(dt);draw();raf=requestAnimationFrame(loop);
  }
  $('#a_run').onclick=()=>{st.running=!st.running;$('#a_run').textContent=st.running?'⏸ Pause':'▶ Start';if(st.running){last=performance.now();raf=requestAnimationFrame(loop);}};
  $('#a_reset').onclick=()=>{st.running=false;$('#a_run').textContent='▶ Start';reset();};
  $('#a_short').onclick=()=>{const p=P();const isc=p.V/p.R;const mb=$('#a_mode');mb.className='badbox';mb.innerHTML=`Starting surge (v=0 ⇒ e<sub>ind</sub>=0): i = V<sub>B</sub>/R = ${p.V}/${p.R} = <b>${fmt(isc)} A</b> — often &gt;10× rated. A series starting resistor limits it.`;};
  reset();

  /* steady-state solver */
  const calc=()=>{const V=+$('#L_V').value,R=+$('#L_R').value,B=+$('#L_B').value,l=+$('#L_l').value,F=+$('#L_F').value,Bl=B*l,istart=V/R;
    let i,eind,v,mode,Pconv,Pbatt;
    if(F===0){i=0;eind=V;v=V/Bl;mode='No-load steady state';Pconv=0;Pbatt=0;}
    else{i=Math.abs(F)/Bl;if(F>0){eind=V+i*R;mode='GENERATOR (charging battery)';}else{eind=V-i*R;mode='MOTOR (driving load)';}v=eind/Bl;Pconv=eind*i;Pbatt=V*i;}
    $('#L_out').innerHTML=`Bl=${fmt(Bl)} · Max starting current (v=0): i=V/R=<span class="k">${fmt(istart)} A</span>\nMode: <span class="k">${mode}</span>\ni=<span class="k">${fmt(i)} A</span>  e<sub>ind</sub>=<span class="k">${fmt(eind)} V</span>  v=<span class="k">${fmt(v)} m/s</span>`+(F!==0?`\nP conv (bar)=e·i=<span class="k">${fmt(Pconv)} W</span> · P battery=V·i=<span class="k">${fmt(Pbatt)} W</span>`:'');};
  ['L_V','L_R','L_B','L_l','L_F'].forEach(id=>$('#'+id).oninput=calc);calc();
});

/* ============================================================ 1.9 AC power */
section('power','AC Power','1.9 · Real, Reactive & Apparent Power',(el)=>{
  el.innerHTML=`
  <h2 class="title">Real, Reactive & Apparent Power</h2>
  <p class="subttl">§1.9 · Power in single-phase AC circuits & the power triangle</p>
  <div class="grid3">
    <div class="eq" style="text-align:center">P = VI cos θ<span class="tag">1‑60 W</span></div>
    <div class="eq" style="text-align:center">Q = VI sin θ<span class="tag">1‑61 var</span></div>
    <div class="eq" style="text-align:center">S = VI<span class="tag">1‑62 VA</span></div>
  </div>
  <div class="eq"><span class="vec">S</span> = P + jQ = <span class="vec">V I</span>* &nbsp;&nbsp; PF = cos θ <span class="tag">(1‑69),(1‑70),(1‑71)</span></div>
  <details class="deriv"><summary>Derive the instantaneous-power decomposition (1‑59)</summary>
    <div class="step">① v(t)=√2 V cos ωt, i(t)=√2 I cos(ωt−θ).<span class="why">θ = impedance angle; current lags by θ for inductive loads.</span></div>
    <div class="step">② p(t)=v·i = 2VI cos ωt·cos(ωt−θ).<span class="why">Instantaneous power is the product.</span></div>
    <div class="step">③ Product-to-sum: cosA cosB = ½[cos(A−B)+cos(A+B)] → p = VI[cos θ + cos(2ωt−θ)].<span class="why">A−B=θ, A+B=2ωt−θ.</span></div>
    <div class="step">④ Expand cos(2ωt−θ)=cos2ωt cosθ+sin2ωt sinθ:<br>p = <b>VI cosθ(1+cos2ωt)</b> + <b>VI sinθ·sin2ωt</b>.<span class="why">Eq.(1‑59).</span></div>
    <div class="step">⑤ Term 1 averages to P = VI cosθ (never negative). Term 2 averages to 0 — it just sloshes energy back and forth: amplitude Q = VI sinθ.<span class="why">Eqs.(1‑60),(1‑61).</span></div>
  </details>
  <p class="note">Inductive: θ&gt;0, current <b>lags</b>, Q&gt;0. Capacitive: θ&lt;0, current <b>leads</b>, Q&lt;0.</p>

  <h3>Interactive power solver <span class="badge">Example 1‑11</span></h3>
  <div class="card">
    <div class="grid2">
      <label class="ctl"><span class="lab">V rms (V)</span><input type="number" id="P_V" value="120" step="any"></label>
      <label class="ctl"><span class="lab">|Z| (Ω)</span><input type="number" id="P_Z" value="20" step="any"></label>
    </div>
    <label class="ctl"><span class="lab">Impedance angle θ (°) <span class="val" id="P_th_v"></span></span><input type="range" id="P_th" min="-90" max="90" value="-30" step="1"></label>
    <div class="flex" style="margin:2px 0 8px"><span class="note">Load type:</span>
      <button class="btn ghost" data-th="0">R (θ=0)</button><button class="btn ghost" data-th="45">R–L (+45°)</button><button class="btn ghost" data-th="-45">R–C (−45°)</button><button class="btn ghost" data-th="90">pure L (+90°)</button><button class="btn ghost" data-th="-90">pure C (−90°)</button><button class="btn ghost" data-th="-30">Ex 1‑11 (−30°)</button>
    </div>
    <div class="grid3" style="align-items:start">
      <div class="out" id="P_out" style="margin-top:0"></div>
      <div><canvas id="PTri" width="380" height="240" style="width:100%"></canvas><p class="mini" style="margin:2px 0 0;text-align:center">power triangle S = P + jQ</p></div>
      <div><canvas id="PPh" width="380" height="240" style="width:100%"></canvas><p class="mini" style="margin:2px 0 0;text-align:center">V–I phasors (I lags for θ&gt;0)</p></div>
    </div>
    <p class="note">Defaults = Ex 1‑11 (Z=20∠−30°): I=6 A, PF=0.866 leading, P=623.5 W, Q=−360 var, S=720 VA.</p>
  </div>
  <h3>Instantaneous voltage, current &amp; power</h3>
  <p class="note">Top: v(t) and i(t) shifted by θ. Bottom: their product p(t). The green area is energy delivered to the load, the red area is energy handed <em>back</em> to the source — that back-and-forth is the reactive power Q; the average (dashed) is the real power P.</p>
  <div class="card"><canvas id="PWave" width="820" height="340" style="width:100%"></canvas></div>`;
  const PTri=$('#PTri'),ptx=PTri.getContext('2d'),PWave=$('#PWave'),pwx=PWave.getContext('2d'),phx=$('#PPh').getContext('2d');let pph=0;
  const pArr=(c,x0,y0,x1,y1,col,w=2.5)=>{c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(x0,y0);c.lineTo(x1,y1);c.stroke();const a=Math.atan2(y1-y0,x1-x0);c.fillStyle=col;c.beginPath();c.moveTo(x1,y1);c.lineTo(x1-9*Math.cos(a-0.45),y1-9*Math.sin(a-0.45));c.lineTo(x1-9*Math.cos(a+0.45),y1-9*Math.sin(a+0.45));c.closePath();c.fill();};
  const pState=()=>{const V=+$('#P_V').value,Z=+$('#P_Z').value,th=+$('#P_th').value,I=Z>0?V/Z:0,rad=th*Math.PI/180;return {V,Z,th,I,rad,P:V*I*Math.cos(rad),Q:V*I*Math.sin(rad),S:V*I};};
  const upd=()=>{const s=pState(),{V,Z,th,I,rad,P,Q,S}=s,PF=Math.cos(rad),lead=th<0?'leading':(th>0?'lagging':'unity');$('#P_th_v').textContent=th+'°';
    $('#P_out').innerHTML=`I=V/|Z|=<span class="k">${fmt(I)} A</span>\nPF=cos θ=<span class="k">${fmt(PF,3)} ${lead}</span>\nP=<span class="k">${fmt(P,1)} W</span>\nQ=<span class="k">${fmt(Q,1)} var</span>\nS=<span class="k">${fmt(S,1)} VA</span>\nS=${fmt(P,1)} ${Q>=0?'+':'−'} j${fmt(Math.abs(Q),1)} VA`;
    ptx.clearRect(0,0,380,240);const ox=40,oy=Q>=0?200:40,sc=Math.min(300/Math.max(S,1e-9),150/Math.max(Math.abs(Q),1)),Px=P*sc;
    ptx.strokeStyle='#5b8cff';ptx.lineWidth=2.5;ptx.beginPath();ptx.moveTo(ox,oy);ptx.lineTo(ox+Px,oy);ptx.stroke();
    ptx.strokeStyle='#ff6b81';ptx.beginPath();ptx.moveTo(ox+Px,oy);ptx.lineTo(ox+Px,oy-Q*sc);ptx.stroke();
    pArr(ptx,ox,oy,ox+Px,oy-Q*sc,'#38d39f',2.5);
    if(Math.abs(th)>0.5){ptx.strokeStyle='#ffcc66';ptx.lineWidth=1.5;ptx.beginPath();ptx.arc(ox,oy,36,0,-rad,Q>0);ptx.stroke();ptx.fillStyle='#ffcc66';ptx.font='12px system-ui';ptx.fillText('θ',ox+42,oy-(Q>=0?10:-16));}
    ptx.fillStyle='#5b8cff';ptx.font='12px system-ui';ptx.fillText('P='+fmt(P,0)+' W',ox+Px/2-24,oy+(Q>=0?16:-6));
    ptx.fillStyle='#ff6b81';ptx.fillText('Q='+fmt(Q,0)+' var',ox+Px+6,oy-Q*sc/2+4);
    ptx.fillStyle='#38d39f';ptx.fillText('S='+fmt(S,0)+' VA',ox+Px/2-40,oy-Q*sc/2-(Q>=0?8:-16));
    drawPPh(s);drawPWave(s);};
  function drawPPh(s){const c=phx,W=380,H=240,cx=150,cy=122,R=92;c.clearRect(0,0,W,H);
    c.strokeStyle='#232a49';c.lineWidth=1;c.beginPath();c.arc(cx,cy,R,0,7);c.stroke();c.beginPath();c.moveTo(cx-R-8,cy);c.lineTo(cx+R+8,cy);c.moveTo(cx,cy-R-8);c.lineTo(cx,cy+R+8);c.stroke();
    const aV=pph,aI=pph-s.rad,rI=R*0.68;
    pArr(c,cx,cy,cx+R*Math.cos(aV),cy-R*Math.sin(aV),'#5b8cff');c.fillStyle='#5b8cff';c.font='12px system-ui';c.fillText('V',cx+(R+11)*Math.cos(aV)-4,cy-(R+11)*Math.sin(aV)+4);
    pArr(c,cx,cy,cx+rI*Math.cos(aI),cy-rI*Math.sin(aI),'#38d39f');c.fillStyle='#38d39f';c.fillText('I',cx+(rI+13)*Math.cos(aI)-4,cy-(rI+13)*Math.sin(aI)+4);
    if(Math.abs(s.th)>0.5){c.strokeStyle='#ffcc66';c.lineWidth=1.5;c.beginPath();c.arc(cx,cy,34,-aV,-aI,s.th<0);c.stroke();const am=(aV+aI)/2;c.fillStyle='#ffcc66';c.fillText('θ',cx+44*Math.cos(am)-4,cy-44*Math.sin(am)+4);}
    c.fillStyle='#9aa3c4';c.font='11px system-ui';c.fillText(s.th>0?'I lags V by θ — inductive':s.th<0?'I leads V by |θ| — capacitive':'I in phase with V — resistive',8,14);
    c.fillText('projection on the horizontal axis = instantaneous v, i',8,H-8);
  }
  function drawPWave(s){const c=pwx,W=820,H=340,pl=44,pr=12,Tw=W-pl-pr,span=4*Math.PI,{V,I,rad,P,S}=s;c.clearRect(0,0,W,H);
    const y1=78,A1=50,y2=245,A2=72,X=k=>pl+k,tOf=k=>k/Tw*span;
    c.strokeStyle='#232a49';c.lineWidth=1;c.beginPath();c.moveTo(pl,y1);c.lineTo(W-pr,y1);c.moveTo(pl,y2);c.lineTo(W-pr,y2);c.stroke();
    c.strokeStyle='#2a2f4a';c.setLineDash([2,4]);c.beginPath();c.moveTo(pl,150);c.lineTo(W-pr,150);c.stroke();c.setLineDash([]);
    const vf=t=>Math.cos(t),iF=t=>Math.cos(t-rad),pf=t=>V*I*Math.cos(rad)*(1+Math.cos(2*t))+V*I*Math.sin(rad)*Math.sin(2*t),sc=A2/Math.max(S*1.95,1e-9);
    for(let k=0;k<=Tw;k++){const p=pf(tOf(k)),y=y2-p*sc;c.fillStyle=p>=0?'rgba(56,211,159,.28)':'rgba(255,107,129,.35)';c.fillRect(X(k),Math.min(y,y2),1,Math.abs(y-y2));}
    const line=(f,col,yc,amp,w=2)=>{c.strokeStyle=col;c.lineWidth=w;c.beginPath();for(let k=0;k<=Tw;k++){const y=yc-f(tOf(k))*amp;k?c.lineTo(X(k),y):c.moveTo(X(k),y);}c.stroke();};
    line(vf,'#5b8cff',y1,A1);line(iF,'#38d39f',y1,A1*0.8);
    line(t=>V*I*Math.cos(rad)*(1+Math.cos(2*t)),'rgba(91,140,255,.55)',y2,sc,1.2);line(t=>V*I*Math.sin(rad)*Math.sin(2*t),'rgba(255,107,129,.55)',y2,sc,1.2);line(pf,'#ffcc66',y2,sc,2.4);
    c.strokeStyle='#ffcc66';c.setLineDash([6,4]);c.lineWidth=1.5;c.beginPath();c.moveTo(pl,y2-P*sc);c.lineTo(W-pr,y2-P*sc);c.stroke();c.setLineDash([]);
    const tc=((pph%span)+span)%span,xc=pl+tc/span*Tw;c.strokeStyle='rgba(255,255,255,.35)';c.setLineDash([3,3]);c.beginPath();c.moveTo(xc,22);c.lineTo(xc,H-18);c.stroke();c.setLineDash([]);
    [[vf(tc)*A1,y1,'#5b8cff'],[iF(tc)*A1*0.8,y1,'#38d39f'],[pf(tc)*sc,y2,'#ffcc66']].forEach(([d,yc,col])=>{c.fillStyle=col;c.beginPath();c.arc(xc,yc-d,4,0,7);c.fill();});
    c.font='12px system-ui';c.fillStyle='#5b8cff';c.fillText('v(t)',pl+6,18);c.fillStyle='#38d39f';c.fillText(`i(t) — ${s.th>0?'lags':s.th<0?'leads':'in phase'} ${Math.abs(s.th)}°`,pl+46,18);
    c.fillStyle='#ffcc66';c.fillText(`p(t) = v·i     average = P = ${fmt(P,0)} W (dashed)`,pl+6,170);
    c.fillStyle='rgba(56,211,159,.9)';c.fillText('green: energy to load',pl+330,170);c.fillStyle='rgba(255,107,129,.9)';c.fillText('red: energy returned to source (reactive)',pl+480,170);
    c.fillStyle='#9aa3c4';c.font='11px system-ui';c.fillText('thin blue/red = the two terms of Eq.(1‑59)',pl+6,H-6);
  }
  function pLoop(){if($('#sec-power').classList.contains('on')){pph+=0.02;const s=pState();drawPPh(s);drawPWave(s);}requestAnimationFrame(pLoop);}
  ['P_V','P_Z','P_th'].forEach(id=>$('#'+id).oninput=upd);
  $$('button[data-th]',el).forEach(b=>b.onclick=()=>{$('#P_th').value=b.dataset.th;upd();});
  upd();pLoop();
});

/* ============================================================ 1.4 MAGNETIC (big) */
section('mag','The Magnetic Field ★','1.4 · Magnetic Circuits (core)',(el)=>{
  el.innerHTML=`
  <h2 class="title">The Magnetic Field & Magnetic Circuits</h2>
  <p class="subttl">§1.4 · The heart of the chapter — Ampère's law, the electric↔magnetic analogy, reluctance networks, nonlinear cores & losses</p>

  <div class="tabs" id="mtabs">
    <div class="t on" data-p="theory">Theory & Equivalence</div>
    <div class="t" data-p="rect">Rectangular Core Lab</div>
    <div class="t" data-p="circ">Circular / Toroid Lab</div>
    <div class="t" data-p="solver">Reluctance-Network Solver</div>
    <div class="t" data-p="par">Parallel 3-leg Core</div>
    <div class="t" data-p="nonlin">Nonlinear B‑H</div>
    <div class="t" data-p="ex">Worked Examples</div>
    <div class="t" data-p="probs">End-Chapter Problems</div>
    <div class="t" data-p="loss">Losses & Hysteresis</div>
  </div>

  <div id="p_theory" class="mpanel">
    <h3>Production of a field — Ampère's law</h3>
    <div class="eq">∮ <span class="vec">H</span>·d<span class="vec">l</span> = I<sub>net</sub> &nbsp;→&nbsp; H ℓ<sub>c</sub> = Ni <span class="tag">(1‑18),(1‑19)</span></div>
    <div class="grid3">
      <div class="eq" style="text-align:center">H = <span class="frac"><span class="n">Ni</span><span class="d">ℓ<sub>c</sub></span></span><span class="tag">1‑20</span></div>
      <div class="eq" style="text-align:center">B = μH<span class="tag">1‑21</span></div>
      <div class="eq" style="text-align:center">φ = BA<span class="tag">1‑26</span></div>
    </div>

    <h3>⚙️ Electric circuit ↔ Magnetic circuit equivalence</h3>
    <p class="note">The magnetic circuit is solved exactly like a resistive DC circuit — this analogy is the single most useful design tool in the chapter.</p>
    <svg viewBox="0 0 640 230" style="width:100%">
      <!-- electric -->
      <text x="20" y="18" fill="#9aa3c4" font-size="13">Electric circuit</text>
      <path d="M60 74 V60 H130 M190 60 H260 V180 H60 V104" fill="none" stroke="#5b8cff" stroke-width="2"/>
      <line x1="46" y1="84" x2="74" y2="84" stroke="#5b8cff" stroke-width="2.5"/><line x1="52" y1="94" x2="68" y2="94" stroke="#5b8cff" stroke-width="4"/>
      <text x="38" y="92" fill="#5b8cff" font-size="13" text-anchor="end">V</text>
      <text x="80" y="80" fill="#5b8cff" font-size="11">+</text><text x="80" y="104" fill="#5b8cff" font-size="11">−</text>
      <path d="M130 60 l6 -8 l8 16 l8 -16 l8 16 l8 -16 l8 16 l6 -8" fill="none" stroke="#ff6b81" stroke-width="2"/>
      <text x="160" y="40" fill="#ff6b81" font-size="13" text-anchor="middle">R</text>
      <line x1="260" y1="95" x2="260" y2="128" stroke="#38d39f" stroke-width="2.5"/><polygon points="260,138 254,126 266,126" fill="#38d39f"/>
      <text x="268" y="120" fill="#38d39f" font-size="13">I</text>
      <text x="60" y="208" fill="#9aa3c4" font-size="12">V = I·R      I = V/R      R = ℓ/(σA)</text>
      <!-- magnetic -->
      <text x="340" y="18" fill="#9aa3c4" font-size="13">Magnetic circuit</text>
      <path d="M360 40 H560 V190 H360 Z M395 75 H525 V155 H395 Z" fill="#232a49" stroke="#3a4680" fill-rule="evenodd"/>
      <ellipse cx="377.5" cy="94" rx="22" ry="4.5" fill="none" stroke="#38d39f" stroke-width="1.8"/><ellipse cx="377.5" cy="106" rx="22" ry="4.5" fill="none" stroke="#38d39f" stroke-width="1.8"/>
      <ellipse cx="377.5" cy="118" rx="22" ry="4.5" fill="none" stroke="#38d39f" stroke-width="1.8"/><ellipse cx="377.5" cy="130" rx="22" ry="4.5" fill="none" stroke="#38d39f" stroke-width="1.8"/>
      <text x="350" y="116" fill="#38d39f" font-size="13" text-anchor="end">ℱ=Ni</text>
      <rect x="377.5" y="57.5" width="165" height="115" fill="none" stroke="#ffcc66" stroke-dasharray="5 4"/>
      <polygon points="468,57.5 458,52 458,63" fill="#ffcc66"/><polygon points="542.5,123 537,113 548,113" fill="#ffcc66"/>
      <polygon points="452,172.5 462,167 462,178" fill="#ffcc66"/><polygon points="377.5,107 372,117 383,117" fill="#ffcc66"/>
      <text x="464" y="52" fill="#ffcc66" font-size="13">φ</text>
      <text x="600" y="110" fill="#ff6b81" font-size="12" text-anchor="middle">ℛ = ℓc/μA</text>
      <text x="600" y="125" fill="#9aa3c4" font-size="10" text-anchor="middle">(the core itself)</text>
      <text x="360" y="208" fill="#9aa3c4" font-size="12">ℱ = φ·ℛ      φ = ℱ/ℛ      ℛ = ℓ/(μA)</text>
    </svg>
    <table>
      <tr><th>Electric</th><th>Magnetic</th><th>Note</th></tr>
      <tr><td>EMF, V (volts)</td><td>mmf, ℱ = Ni (A·turns)</td><td>the "drive"</td></tr>
      <tr><td>Current, I (A)</td><td>Flux, φ (Wb)</td><td>the "flow"</td></tr>
      <tr><td>Resistance, R = ℓ/σA</td><td>Reluctance, ℛ = ℓ/μA</td><td>opposition (1‑32)</td></tr>
      <tr><td>Conductivity σ</td><td>Permeability μ</td><td>material property</td></tr>
      <tr><td>Conductance G = 1/R</td><td>Permeance 𝒫 = 1/ℛ</td><td>(1‑29)</td></tr>
      <tr><td>Ohm: V = IR</td><td>ℱ = φℛ</td><td>(1‑28)</td></tr>
      <tr><td>Series R add</td><td>Series ℛ add (1‑33)</td><td>same node rule</td></tr>
      <tr><td>1/R<sub>eq</sub>=Σ1/R</td><td>1/ℛ<sub>eq</sub>=Σ1/ℛ (1‑34)</td><td>parallel</td></tr>
      <tr><td>KVL ΣV=0</td><td>Σℱ = Σφℛ (Ampère loop)</td><td>—</td></tr>
      <tr><td>KCL Σi=0</td><td>Σφ=0 at a node</td><td>flux continuity</td></tr>
    </table>

    <details class="deriv" open><summary>Derive reluctance ℛ = ℓ/(μA) from Ampère's law (the key chain)</summary>
      <div class="step">① Ampère's law around the core: H·ℓ<sub>c</sub> = Ni.<span class="why">All N turns link the path; I<sub>net</sub> = Ni — Eq.(1‑19).</span></div>
      <div class="step">② Solve for field intensity: H = Ni/ℓ<sub>c</sub>.<span class="why">Eq.(1‑20).</span></div>
      <div class="step">③ Flux density from the material law: B = μH = μNi/ℓ<sub>c</sub>.<span class="why">B = μH, with μ = μ<sub>r</sub>μ<sub>0</sub> — Eq.(1‑21).</span></div>
      <div class="step">④ Total flux through area A: φ = BA = (μA/ℓ<sub>c</sub>)·Ni.<span class="why">φ = BA — Eq.(1‑26).</span></div>
      <div class="step">⑤ Rewrite as φ = Ni ÷ (ℓ<sub>c</sub>/μA) = ℱ/ℛ.<span class="why">Group the geometry into one factor.</span></div>
      <div class="step">⑥ Compare with ℱ = φℛ ⇒ <b>ℛ = ℓ<sub>c</sub>/(μA) = ℓ<sub>c</sub>/(μ<sub>r</sub>μ<sub>0</sub>A)</b>.<span class="why">Eq.(1‑32). Long/thin/low-μ paths have high reluctance — exactly like resistance.</span></div>
    </details>
    <div class="grid2" style="align-items:center;margin-top:10px">
      <div class="warnbox">Why answers are only ~5% accurate: (1) <b>leakage</b> flux escapes the core and closes through air; (2) path length/area are guesses, especially at corners; (3) μ is nonlinear (saturation); (4) air-gap <b>fringing</b> — the flux bulges outward at the gap, so the effective gap area is larger than the core face (we add ~5%).</div>
      <svg viewBox="0 0 320 190" style="width:100%">
        <path d="M30 20 H290 V170 H30 Z M65 55 H255 V135 H65 Z" fill="#232a49" stroke="#3a4680" fill-rule="evenodd"/>
        <rect x="254" y="88" width="37" height="14" fill="#0b0e1c"/>
        <ellipse cx="47.5" cy="76" rx="22" ry="4.5" fill="none" stroke="#38d39f" stroke-width="1.8"/><ellipse cx="47.5" cy="88" rx="22" ry="4.5" fill="none" stroke="#38d39f" stroke-width="1.8"/>
        <ellipse cx="47.5" cy="100" rx="22" ry="4.5" fill="none" stroke="#38d39f" stroke-width="1.8"/><ellipse cx="47.5" cy="112" rx="22" ry="4.5" fill="none" stroke="#38d39f" stroke-width="1.8"/>
        <rect x="47.5" y="37.5" width="225" height="115" fill="none" stroke="#ffcc66" stroke-dasharray="5 4"/>

    <details class="deriv"><summary>Derive the toroid flux formula</summary>
      <div class="step">① Mean circumference: ℓ = 2π r<sub>mean</sub>, where r<sub>mean</sub> = (r<sub>in</sub>+r<sub>out</sub>)/2.<span class="why">The average flux path is a circle at the mean radius.</span></div>

  const coreSVG=$('#coreSVG');
  function coreCalc(){
    const N=+$('#c_N').value,i=+$('#c_i').value,lc=+$('#c_l').value/100,A=+$('#c_A').value/1e4,
      mur=+$('#c_mu').value,g=+$('#c_g').value/100,fr=+$('#c_fr').value/100;

    const liron=Math.max(lc-g,0),Rc=liron/(mur*MU0*A),Agap=A*(1+fr),Rg=g>0?g/(MU0*Agap):0,Rt=Rc+Rg,mmf=N*i,
      phi=Rt>0?mmf/Rt:0,B=phi/A,Bgap=g>0?phi/Agap:B;
    $('#c_out').innerHTML=
`ℱ = Ni = <span class="k">${fmt(mmf)} A·t</span>
ℛ_core = ℓ/μA = <span class="k">${fmt(Rc)} A·t/Wb</span>${g>0?`\nℛ_gap  = <span class="k">${fmt(Rg)} A·t/Wb</span>`:''}
ℛ_tot  = <span class="k">${fmt(Rt)} A·t/Wb</span>
φ = ℱ/ℛ = <span class="k">${fmt(phi)} Wb</span>
B_core = φ/A = <span class="k">${fmt(B)} T</span>${g>0?`\nB_gap  = <span class="k">${fmt(Bgap)} T</span>`:''}`;
    drawCore(N,g>0,B,lc,A);
  }
  function drawCore(N,hasGap,B,lc,A){
    const w=+$('#c_A').value,t=8+Math.min(w/8,26),ox=40,oy=30,W=280,H=240,gapPx=hasGap?Math.max(6,+$('#c_g').value*300):0;
    const col=B<1.0?'#5b8cff':B<1.5?'#ffcc66':'#ff6b81',fa=Math.max(0.35,Math.min(1,B/1.2)),mx=ox+t/2,my=oy+t/2,MX=ox+W-t/2,MY=oy+H-t/2;
    let s=`<defs><linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a4570"/><stop offset="1" stop-color="#232a49"/></linearGradient></defs>`;
    s+=`<rect x="${ox}" y="${oy}" width="${W}" height="${H}" rx="6" fill="url(#steel)" stroke="${col}" stroke-width="2"/>`;
    s+=`<rect x="${ox+t}" y="${oy+t}" width="${W-2*t}" height="${H-2*t}" rx="4" fill="#0b0e1c" stroke="#2a2f4a"/>`;
    if(hasGap){const gx=ox+W-t,gy=oy+H/2-gapPx/2,gm=gy+gapPx/2,bul=10+gapPx*0.8;
      s+=`<rect x="${gx}" y="${gy}" width="${t}" height="${gapPx}" fill="#0b0e1c"/>`;
      s+=`<line x1="${gx-2}" y1="${gy}" x2="${gx+t+2}" y2="${gy}" stroke="#ffcc66"/><line x1="${gx-2}" y1="${gy+gapPx}" x2="${gx+t+2}" y2="${gy+gapPx}" stroke="#ffcc66"/>`;
      s+=`<path d="M${gx+t-3} ${gy} Q${gx+t+bul} ${gm} ${gx+t-3} ${gy+gapPx} M${gx+3} ${gy} Q${gx-bul} ${gm} ${gx+3} ${gy+gapPx}" fill="none" stroke="#ff6b81" stroke-width="1.3" opacity=".8"/>`;
      s+=`<text x="${gx-6}" y="${gy-6}" fill="#ffcc66" font-size="11" text-anchor="end">air gap ${(+$('#c_g').value).toFixed(3)} cm</text>`;
      s+=`<text x="${gx+t+4}" y="${gy+gapPx+14}" fill="#ff6b81" font-size="10">fringing</text>`;}
    const coils=Math.min(12,Math.max(4,Math.round(N/60)));
    for(let k=0;k<coils;k++){const yy=oy+34+k*((H-68)/(coils-1));s+=`<ellipse cx="${mx}" cy="${yy}" rx="${t/2+7}" ry="4.5" fill="none" stroke="#38d39f" stroke-width="1.8"/>`;}
    s+=`<text x="${ox-8}" y="${oy+20}" fill="#38d39f" font-size="11" text-anchor="end">N=${N}</text>`;

      <text x="206" y="30" fill="#38d39f" font-size="10" text-anchor="middle">φR = ${fmt(100*fR,0)}%</text>
      <text x="150" y="194" fill="#9aa3c4" font-size="10" text-anchor="middle">N = ${N}, i = ${i} A on the centre leg</text></svg>`;
    $('#pp_phys').innerHTML=s;
    // equivalent circuit
    const box=(x,y,c,lab,val)=>`<rect x="${x}" y="${y-12}" width="80" height="24" rx="4" fill="#1e2237" stroke="${c}" stroke-width="2"/><text x="${x+40}" y="${y+4}" fill="#e8ebf7" font-size="10.5" text-anchor="middle">${lab}</text><text x="${x+40}" y="${y+24}" fill="${c}" font-size="9.5" text-anchor="middle">${val}</text>`;
    $('#pp_net').innerHTML=`<div class="mini" style="margin:0 0 2px 4px">Equivalent circuit — ℛc in series with ℛL ∥ ℛR</div><svg viewBox="0 0 420 165" style="width:100%;display:block">
      <path d="M40 69 V30 H240 M240 30 H380 M240 30 V95 H380 V30 M380 30 V140 H40 V101" fill="none" stroke="#3a4680" stroke-width="2"/>
      <circle cx="40" cy="85" r="16" fill="#12162a" stroke="#ffcc66" stroke-width="2"/><text x="40" y="90" fill="#ffcc66" font-size="13" text-anchor="middle">ℱ</text>
      <text x="22" y="66" fill="#ffcc66" font-size="12">+</text><text x="22" y="110" fill="#ffcc66" font-size="12">−</text>
      <circle cx="240" cy="30" r="3" fill="#e8ebf7"/><circle cx="380" cy="30" r="3" fill="#e8ebf7"/>
      ${box(110,30,'#ffcc66','ℛc',fmt(Rc,3))}${box(270,30,'#5b8cff','ℛL',fmt(RL,3))}${box(270,95,'#38d39f','ℛR',fmt(RR,3))}
      ${ahP(70,30,1,0,'#ffcc66',1)}<text x="58" y="22" fill="#ffcc66" font-size="10">φc</text>
      ${ahP(355,30,1,0,'#5b8cff',0.3+0.7*fL)}<text x="345" y="22" fill="#5b8cff" font-size="10">φL</text>
      ${ahP(355,95,1,0,'#38d39f',0.3+0.7*fR)}<text x="345" y="87" fill="#38d39f" font-size="10">φR</text>
      <text x="8" y="158" fill="#9aa3c4" font-size="10.5">ℛtot = ${fmt(Rt,3)} A·t/Wb   ·   φc = ${fmt(phic,3)} Wb</text></svg>`;
  }
  ['pp_N','pp_i','pp_mu','pp_lc','pp_Ac','pp_lL','pp_AL','pp_gL','pp_lR','pp_AR','pp_gR','pp_fr'].forEach(id=>$('#'+id).oninput=parCalc);parCalc();

  /* ---- nonlinear B-H ---- */
  const bhCan=$('#bhCan'),bx=bhCan.getContext('2d'),murCan=$('#murCan'),mx=murCan.getContext('2d');
  function nonlin(){
    const N=+$('#n_N').value,i=+$('#n_i').value,lc=+$('#n_l').value/100,A=+$('#n_A').value/1e4,log=$('#n_log').checked;
    $('#n_N_v').textContent=N;$('#n_i_v').textContent=i+' A';$('#n_l_v').textContent=(lc*100)+' cm';$('#n_A_v').textContent=(A*1e4)+' cm²';
    const H=N*i/lc,B=Bof(H),phi=B*A,mur=H>0?B/(MU0*H):0;
    $('#n_out').innerHTML=`H = Ni/ℓ = <span class="k">${fmt(H)} A·t/m</span>\nB (from curve) = <span class="k">${fmt(B,3)} T</span>\nφ = BA = <span class="k">${fmt(phi)} Wb</span>\nμ<sub>r</sub> = B/(μ₀H) = <span class="k">${Math.round(mur)}</span>`;
    // curve
    const W=380,Hh=260,pl=44,pb=30,pt=12,pr=12,Hmax=1000,Bmax=1.6;
    bx.clearRect(0,0,W,Hh);
    const xX=h=>{if(log){const lo=Math.log10(10),hi=Math.log10(Hmax);return pl+(Math.log10(Math.max(h,10))-lo)/(hi-lo)*(W-pl-pr);}return pl+h/Hmax*(W-pl-pr);};
    const yY=b=>Hh-pb-(b/Bmax)*(Hh-pb-pt);
    bx.strokeStyle='#232a49';bx.fillStyle='#9aa3c4';bx.font='10px system-ui';
    for(let b=0;b<=Bmax;b+=0.2){const y=yY(b);bx.beginPath();bx.moveTo(pl,y);bx.lineTo(W-pr,y);bx.stroke();bx.fillText(b.toFixed(1),6,y+3);}
    (log?[10,20,50,100,200,500,1000]:[0,200,400,600,800,1000]).forEach(h=>{const x=xX(h);bx.fillText(h,x-8,Hh-pb+12);});
    bx.fillStyle='#9aa3c4';bx.fillText('B (T)',6,pt+2);bx.fillText('H',W-24,Hh-6);
    bx.strokeStyle='#5b8cff';bx.lineWidth=2;bx.beginPath();
    for(let h=1;h<=Hmax;h+=2){const x=xX(h),y=yY(Bof(h));h===1?bx.moveTo(x,y):bx.lineTo(x,y);}bx.stroke();
    const px=xX(H),py=yY(B);bx.strokeStyle='#38d39f';bx.setLineDash([4,4]);bx.beginPath();bx.moveTo(px,Hh-pb);bx.lineTo(px,py);bx.lineTo(pl,py);bx.stroke();bx.setLineDash([]);
    bx.fillStyle='#38d39f';bx.beginPath();bx.arc(px,py,4,0,7);bx.fill();bx.fillText('operating point',px-40,py-8);
    // mur curve
    const w2=380,h2=150,p2=44,pb2=24,pt2=10;mx.clearRect(0,0,w2,h2);
    const murMax=7000;const yy=m=>h2-pb2-(m/murMax)*(h2-pb2-pt2);
    mx.strokeStyle='#232a49';mx.fillStyle='#9aa3c4';mx.font='10px system-ui';
    [2000,4000,6000].forEach(m=>{const y=yy(m);mx.beginPath();mx.moveTo(p2,y);mx.lineTo(w2-pr,y);mx.stroke();mx.fillText(m,4,y+3);});
    mx.fillText('μr',6,pt2+2);mx.fillText('H',w2-20,h2-6);
    mx.strokeStyle='#ffcc66';mx.lineWidth=2;mx.beginPath();let first=true;
    for(let h=5;h<=Hmax;h+=2){const m=Bof(h)/(MU0*h);const x=xX(h),y=yy(m);first?(mx.moveTo(x,y),first=false):mx.lineTo(x,y);}mx.stroke();
    const mv=yy(mur);mx.fillStyle='#38d39f';mx.beginPath();mx.arc(xX(H),mv,4,0,7);mx.fill();
    // magnetic domains
    const dc=$('#domCan').getContext('2d'),f=Math.min(1,B/1.63);dc.clearRect(0,0,380,120);
    dc.fillStyle='#9aa3c4';dc.font='11px system-ui';dc.fillText(`magnetic domains — ${Math.round(f*100)}% aligned with H →`,8,14);
    DOM.forEach((a0,k)=>{const col=k%12,row=Math.floor(k/12),x=24+col*30,y=36+row*30,a=a0*(1-f)*(1-f);
      const g=Math.round(120+135*f);dc.strokeStyle=`rgb(${Math.round(154-100*f)},${g},${Math.round(196-40*f)})`;dc.lineWidth=2;
      dc.beginPath();dc.moveTo(x-9*Math.cos(a),y+9*Math.sin(a));dc.lineTo(x+9*Math.cos(a),y-9*Math.sin(a));dc.stroke();
      dc.fillStyle=dc.strokeStyle;dc.beginPath();dc.moveTo(x+11*Math.cos(a),y-11*Math.sin(a));dc.lineTo(x+5*Math.cos(a)+4*Math.sin(a),y-5*Math.sin(a)+4*Math.cos(a));dc.lineTo(x+5*Math.cos(a)-4*Math.sin(a),y-5*Math.sin(a)-4*Math.cos(a));dc.closePath();dc.fill();});
  }
  const DOM=Array.from({length:36},()=>(Math.random()*2-1)*Math.PI);
  ['n_N','n_i','n_l','n_A'].forEach(id=>$('#'+id).oninput=nonlin);$('#n_log').onchange=nonlin;nonlin();

  /* ---- examples ---- */
  const EX={
    1:`<h4>Example 1‑1 — two-region core</h4><p>Depth 10 cm; N=200, i=1 A, μ<sub>r</sub>=2500. Region 1: ℓ₁=45 cm, A₁=100 cm². Region 2: ℓ₂=130 cm, A₂=150 cm².</p>
    <div class="step">ℛ₁ = 0.45/(2500·μ₀·0.01) = <b>14,300</b> A·t/Wb</div>
    <div class="step">ℛ₂ = 1.30/(2500·μ₀·0.015) = <b>27,600</b> A·t/Wb</div>
    <div class="step">ℛ<sub>tot</sub> = 41,900;  ℱ = Ni = 200 A·t</div>
    <div class="step">φ = ℱ/ℛ = 200/41,900 = <b>0.0048 Wb</b></div>
    <p class="note">Reproduce it in the solver → "Load Ex 1‑1".</p>`,
    2:`<h4>Example 1‑2 — core with air gap</h4><p>ℓ<sub>c</sub>=40 cm, gap=0.05 cm, A=12 cm², μ<sub>r</sub>=4000, N=400, fringing +5%.</p>
    <div class="step">ℛ<sub>c</sub> = 0.40/(4000·μ₀·0.002) ≈ <b>66,300</b></div>
    <div class="step">A<sub>gap</sub>=1.05·12=12.6 cm²; ℛ<sub>gap</sub> ≈ <b>316,000</b> — the tiny gap dominates!</div>
    <div class="step">ℛ<sub>tot</sub> ≈ 382,300; for B=0.5 T: i = BAℛ/N ≈ <b>0.602 A</b></div>`,
    3:`<h4>Example 1‑3 — DC motor rotor/stator</h4><p>Stator ℓ=50 A=12; rotor ℓ=5 A=12; two gaps 0.05 cm A<sub>gap</sub>=14; μ<sub>r</sub>=2000, N=200, i=1 A.</p>
    <div class="step">ℛ<sub>s</sub>≈166,000; ℛ<sub>r</sub>≈16,600; each ℛ<sub>gap</sub>≈284,000</div>
    <div class="step">ℛ<sub>tot</sub>=751,000; φ=200/751,000=<b>0.000266 Wb</b></div>
    <div class="step">B<sub>gap</sub>=φ/A<sub>gap</sub>=0.000266/0.0014=<b>0.19 T</b></div>`,
    5:`<h4>Example 1‑5 — nonlinear core</h4><p>ℓ<sub>c</sub>=55 cm, A=150 cm², N=200, real steel. Find i for φ=0.012 Wb.</p>
    <div class="step">B=φ/A=0.012/0.015=<b>0.8 T</b> → from curve H≈115 A·t/m</div>
    <div class="step">ℱ=Hℓ=115·0.55=63.25 → i=ℱ/N=<b>0.316 A</b></div>
    <div class="step">μ<sub>r</sub>=B/(μ₀H)=<b>5540</b>;  ℛ=ℱ/φ=<b>5270</b> A·t/Wb</div>
    <p class="note">Open the "Nonlinear B‑H" tab — the defaults (N=200, i=0.316, ℓ=55, A=150) land exactly on B≈0.8 T.</p>`,
    tor:`<h4>Circular (toroidal) core — worked example</h4>
    <p>A ring core has mean diameter D=10 cm and a round cross-section of radius a=1.5 cm. N=400 turns carry i=0.3 A; μ<sub>r</sub>=1500.</p>
    <div class="step">① ℓ = πD = π(0.10) = <b>0.314 m</b> <span class="why">mean circumference is the flux path</span></div>
    <div class="step">② A = πa² = π(0.015)² = <b>7.07×10⁻⁴ m²</b></div>
    <div class="step">③ ℛ = ℓ/(μ<sub>r</sub>μ₀A) = 0.314/(1500·μ₀·7.07e‑4) = <b>2.36×10⁵ A·t/Wb</b></div>
    <div class="step">④ ℱ = Ni = 400·0.3 = <b>120 A·t</b></div>
    <div class="step">⑤ φ = ℱ/ℛ = 120/2.36e5 = <b>5.1×10⁻⁴ Wb</b></div>
    <div class="step">⑥ B = φ/A = 5.1e‑4/7.07e‑4 = <b>0.72 T</b> (below the knee — good design point)</div>
    <p class="note">The "Circular / Toroid Lab" tab is preset to these numbers — drag D and watch B fall as the ring grows (B = μ<sub>r</sub>μ₀Ni/πD).</p>`
  };
  const showEx=e=>{$('#exBody').innerHTML=EX[e];$$('#exTabs .t').forEach(t=>t.classList.toggle('on',t.dataset.e==e));};
  $$('#exTabs .t').forEach(t=>t.onclick=()=>showEx(t.dataset.e));showEx('1');

  /* ---- end-chapter problems ---- */
  const PROBS=[
    ['1‑5','Depth 5 cm core; find i for φ=0.005 Wb, μ<sub>r</sub>=1000; then B at the top and right legs.',
     'Single series loop. Enter each limb (ℓ, A) with μ<sub>r</sub>=1000 in the solver; i = φ·ℛ<sub>tot</sub>/N. B<sub>leg</sub>=φ/A<sub>leg</sub> (thinner legs → higher B).'],
    ['1‑6','Core μ<sub>r</sub>=1500, depth 7 cm, two air gaps (0.07 & 0.05 cm, +5% fringing), N=400 on centre leg, i=1 A. Flux in left/centre/right legs; B in each gap.',
     'PARALLEL branches: centre leg (mmf source) splits into left and right loops, each with its own gap. Solve ℛ<sub>left</sub>, ℛ<sub>right</sub> in parallel, add centre in series: ℛ = ℛ<sub>c</sub>+(ℛ<sub>L</sub>∥ℛ<sub>R</sub>). φ<sub>centre</sub>=ℱ/ℛ, then split by current-divider.'],
    ['1‑7','Two-legged core, N₁=400 (i₁=0.5 A) & N₂=300 (i₂=0.75 A), μ<sub>r</sub>=1000. Find φ.',
     'Two mmf sources. Net ℱ = N₁i₁ ± N₂i₂ (sign from winding directions in the figure). Single series loop: φ = ℱ<sub>net</sub>/ℛ<sub>tot</sub>.'],
    ['1‑8','Three-leg core, depth 5 cm, 200 turns on left leg, μ<sub>r</sub>=1500, one air gap (+4% fringing). Flux & B in each leg.',
     'Parallel middle/right legs; same method as 1‑6.'],
    ['1‑13','Three-leg core, depth 8 cm, 400 turns on centre leg; nonlinear steel (Fig 1‑10c). (a) i for B=0.5 T centre; (b) i for B=1.0 T — is it double? (c)(d) reluctances.',
     'Use the Nonlinear B‑H tab: B→H from the curve for each leg, ℱ=ΣHℓ around the loop. Because μ drops with B, doubling B needs MORE than double the current — reluctance is not constant.'],
    ['1‑14','Two-leg core + air gap, depth 5 cm, gap 0.06 cm (+5%), N=1000, nonlinear steel. i for gap B=0.5 T; B on four sides; total gap flux.',
     'Series iron + gap, but iron is nonlinear: ℱ = H<sub>iron</sub>ℓ<sub>iron</sub> + H<sub>gap</sub>ℓ<sub>gap</sub>, with H<sub>gap</sub>=B/μ₀ and H<sub>iron</sub> from the curve at that B.'],
    ['1‑15','Transformer core, ℓ=10 in, 300 turns, A=0.25 in², i=0.25 A, nonlinear steel. Find φ and B.',
     'Convert inches→metres (1 in=0.0254 m). H=Ni/ℓ → B from curve → φ=BA.'],
  ];
  $('#probBody').innerHTML=PROBS.map(p=>`<details><summary>Problem ${p[0]}</summary>
    <p>${p[1]}</p><div class="okbox"><b>Method:</b> ${p[2]}</div></details>`).join('');

  /* ---- hysteresis ---- */
  const hysCan=$('#hysCan'),hx=hysCan.getContext('2d');
  function drawHys(){
    const amp=+$('#hy').value/100;$('#hy_v').textContent=Math.round(amp*100)+'%';
    const W=380,H=300,cx=W/2,cy=H/2,sx=(W/2-20),sy=(H/2-16);
    hx.clearRect(0,0,W,H);
    hx.strokeStyle='#232a49';hx.beginPath();hx.moveTo(20,cy);hx.lineTo(W-10,cy);hx.moveTo(cx,14);hx.lineTo(cx,H-14);hx.stroke();
    hx.fillStyle='#9aa3c4';hx.font='11px system-ui';hx.fillText('φ (or B)',cx+6,20);hx.fillText('ℱ (or H)',W-70,cy-6);
    const kc=0.35*amp,sat=amp;hx.strokeStyle='#ff6b81';hx.lineWidth=2;hx.beginPath();const Np=200;
    for(let s=0;s<=1;s+=1/Np){const d=s*2*Math.PI,drive=Math.sin(d)*sat,branch=Math.cos(d)>=0?1:-1,
      b=Math.tanh((drive+branch*kc)*3)/Math.tanh(3),X=cx+drive*sx,Y=cy-b*sy;s===0?hx.moveTo(X,Y):hx.lineTo(X,Y);}
    hx.closePath();hx.stroke();
    const res=Math.tanh(kc*3)/Math.tanh(3);hx.fillStyle='#ffcc66';hx.beginPath();hx.arc(cx,cy-res*sy,3,0,7);hx.fill();hx.fillText('φ_res',cx+4,cy-res*sy-2);
    $('#hy_out').innerHTML=`Loop width ∝ coercive mmf ℱ<sub>c</sub>\nResidual flux marker in amber\nRelative loop area (∝ loss/cycle): <span class="k">${fmt(amp*amp*kc*100,2)}</span>`;
  }
  $('#hy').oninput=drawHys;drawHys();
});

/* ============================================================ Practice mode */
section('practice','Practice','★ Practice Mode (random)',(el)=>{
  el.innerHTML=`
  <h2 class="title">Practice Mode — endless randomized problems</h2>
  <p class="subttl">Pick a topic, get fresh numbers each time, type your answer, and check it against the worked solution.</p>
  <div class="card">
    <div class="flex">
      <select id="pk_type" style="max-width:320px">
        <option value="speed">1.3 · Speed conversion (r/min → rad/s)</option>
        <option value="power">1.3 · Power P = τω</option>
        <option value="torque">1.3 · Torque τ = rF sinθ</option>
        <option value="reluct">1.4 · Reluctance ℛ = ℓ/μA</option>
        <option value="flux">1.4 · Core flux φ = Ni/ℛ</option>
        <option value="toroid">1.4 · Toroid B (circular core)</option>
        <option value="force">1.6 · Force F = ilB sinθ</option>
        <option value="movev">1.7 · Moving-wire e = vBl cosα</option>

      </select>
      <button class="btn" id="pk_new">🎲 New problem</button>
      <span class="pill">Score: <b id="pk_score">0</b> / <b id="pk_tot">0</b></span>

    <div id="pk_q" class="card tight" style="margin-top:12px"></div>

  </div>`;

  let cur=null,score=0,tot=0;
  const G={
    speed:()=>{const n=rnd(300,3600,100);return{q:`A shaft spins at <b>${n} r/min</b>. Find ω in <b>rad/s</b>.`,ans:2*Math.PI*n/60,unit:'rad/s',
      sol:`ω = 2πn/60 = 2π(${n})/60 = <b>${fmt(2*Math.PI*n/60)} rad/s</b>`};},
    power:()=>{const t=rnd(10,150,5),n=rnd(600,3000,60),w=2*Math.PI*n/60;return{q:`A motor delivers <b>τ=${t} N·m</b> at <b>${n} r/min</b>. Find <b>P</b> in W.`,ans:t*w,unit:'W',
      sol:`ω=2πn/60=${fmt(w)} rad/s; P=τω=${t}×${fmt(w)}=<b>${fmt(t*w)} W</b>`};},
    torque:()=>{const F=rnd(5,40,1),r=rnd(0.1,0.6,0.05),th=rnd(20,160,5);return{q:`Force <b>${F} N</b> at radius <b>${r} m</b>, angle <b>${th}°</b> to r. Find <b>τ</b> (N·m).`,ans:r*F*Math.sin(th*Math.PI/180),unit:'N·m',
      sol:`τ=rF sinθ=${r}×${F}×sin ${th}°=<b>${fmt(r*F*Math.sin(th*Math.PI/180))} N·m</b>`};},
    reluct:()=>{const l=rnd(20,120,5),A=rnd(10,150,5),mur=rnd(1000,5000,500);const R=(l/100)/(mur*MU0*(A/1e4));
      return{q:`A core has ℓ=<b>${l} cm</b>, A=<b>${A} cm²</b>, μ<sub>r</sub>=<b>${mur}</b>. Find <b>ℛ</b> (A·t/Wb).`,ans:R,unit:'A·t/Wb',tol:0.02,
      sol:`ℛ=ℓ/(μ<sub>r</sub>μ₀A)=${l/100}/(${mur}×μ₀×${A/1e4})=<b>${fmt(R)} A·t/Wb</b>`};},
    flux:()=>{const N=rnd(100,600,50),i=rnd(0.5,3,0.5),l=rnd(30,100,5),A=rnd(20,150,5),mur=rnd(1000,4000,500);
      const R=(l/100)/(mur*MU0*(A/1e4)),phi=N*i/R;
      return{q:`N=<b>${N}</b>, i=<b>${i} A</b>, ℓ=<b>${l} cm</b>, A=<b>${A} cm²</b>, μ<sub>r</sub>=<b>${mur}</b>. Find core flux <b>φ</b> (Wb).`,ans:phi,unit:'Wb',tol:0.02,
      sol:`ℛ=ℓ/μA=${fmt(R)}; ℱ=Ni=${N*i}; φ=ℱ/ℛ=<b>${fmt(phi)} Wb</b>`};},
    toroid:()=>{const N=rnd(200,600,50),i=rnd(0.2,1,0.1),D=rnd(6,20,1),mur=rnd(1000,3000,250);const B=mur*MU0*N*i/(Math.PI*D/100);
      return{q:`A toroid: N=<b>${N}</b>, i=<b>${i} A</b>, mean diameter D=<b>${D} cm</b>, μ<sub>r</sub>=<b>${mur}</b>. Find <b>B</b> (T).`,ans:B,unit:'T',tol:0.02,
      sol:`ℓ=πD=${fmt(Math.PI*D/100)} m; B=μ<sub>r</sub>μ₀Ni/ℓ=<b>${fmt(B)} T</b>`};},
    force:()=>{const i=rnd(1,10,0.5),l=rnd(0.5,2,0.1),B=rnd(0.1,0.9,0.05),th=rnd(30,150,10);
      return{q:`Wire i=<b>${i} A</b>, l=<b>${l} m</b>, B=<b>${B} T</b>, angle <b>${th}°</b>. Find <b>F</b> (N).`,ans:i*l*B*Math.sin(th*Math.PI/180),unit:'N',
      sol:`F=ilB sinθ=${i}×${l}×${B}×sin ${th}°=<b>${fmt(i*l*B*Math.sin(th*Math.PI/180))} N</b>`};},
    movev:()=>{const v=rnd(2,20,1),B=rnd(0.2,0.9,0.05),l=rnd(0.5,2,0.1),a=rnd(0,60,5);
      return{q:`Wire v=<b>${v} m/s</b>, B=<b>${B} T</b>, l=<b>${l} m</b>, α=<b>${a}°</b>. Find induced <b>e</b> (V).`,ans:v*B*l*Math.cos(a*Math.PI/180),unit:'V',
      sol:`e=vBl cosα=${v}×${B}×${l}×cos ${a}°=<b>${fmt(v*B*l*Math.cos(a*Math.PI/180))} V</b>`};},
    linear:()=>{const V=rnd(60,240,10),B=rnd(0.05,0.4,0.05),l=rnd(1,10,0.5);
      return{q:`Linear DC machine: V<sub>B</sub>=<b>${V} V</b>, B=<b>${B} T</b>, l=<b>${l} m</b>. Find <b>no-load speed</b> (m/s).`,ans:V/(B*l),unit:'m/s',tol:0.01,
      sol:`v=V<sub>B</sub>/(Bl)=${V}/(${B}×${l})=<b>${fmt(V/(B*l))} m/s</b>`};},
    acp:()=>{const V=rnd(100,240,10),Z=rnd(10,50,2),th=rnd(-60,60,5);const I=V/Z,P=V*I*Math.cos(th*Math.PI/180);
      return{q:`AC load: V=<b>${V} V</b>, |Z|=<b>${Z} Ω</b>, θ=<b>${th}°</b>. Find <b>real power P</b> (W).`,ans:P,unit:'W',tol:0.01,
      sol:`I=V/Z=${fmt(I)} A; P=VI cosθ=${V}×${fmt(I)}×cos ${th}°=<b>${fmt(P)} W</b>`};}
  };
  function neu(){const t=$('#pk_type').value;cur=G[t]();$('#pk_q').innerHTML=cur.q;$('#pk_ans').value='';$('#pk_fb').innerHTML='';$('#pk_sol').innerHTML='';}
  function check(){
    if(!cur)return;const guess=+$('#pk_ans').value;if($('#pk_ans').value==='')return;
    const tol=cur.tol||0.02,ok=Math.abs(guess-cur.ans)<=Math.abs(cur.ans)*tol+1e-9;
    tot++;if(ok)score++;$('#pk_score').textContent=score;$('#pk_tot').textContent=tot;
    $('#pk_fb').innerHTML=ok?`<div class="okbox">✅ Correct! Answer ≈ <b>${fmt(cur.ans)} ${cur.unit}</b> (within ${Math.round(tol*100)}%).</div>`
      :`<div class="badbox">❌ Not quite. You entered ${fmt(guess)}; answer is <b>${fmt(cur.ans)} ${cur.unit}</b>.</div>`;
    $('#pk_sol').innerHTML=`<details open><summary>Worked solution</summary><div class="step">${cur.sol}</div></details>`;
  }
  $('#pk_new').onclick=neu;$('#pk_check').onclick=check;$('#pk_type').onchange=neu;
  $('#pk_ans').addEventListener('keydown',e=>{if(e.key==='Enter')check();});
  neu();
});

  const QZ=[

    ['Reluctance ℛ equals…',['μA/ℓ','ℓ/μA','ℓμ/A','A/ℓμ'],1],
    ['For a toroid, the mean path length is…',['πa²','2πr_mean','ℓ/μA','N i'],1],
    ['Faraday: induced voltage ∝ …',['flux','rate of change of flux','current','reluctance'],1],
    ['Motor action is based on…',['F=ilB','e=vBl','φ=BA','P=VIcosθ'],0],
    ['Linear DC machine no-load speed v = …',['V_B·Bl','Bl/V_B','V_B/(Bl)','V_B·R'],2],
    ['A capacitive load has an impedance angle that is…',['positive','zero','negative','undefined'],2],
    ['Hysteresis-loop area is proportional to…',['permeability','energy lost per cycle','reluctance','flux linkage'],1],
    ['Cores are laminated mainly to reduce…',['hysteresis loss','copper loss','eddy-current loss','friction'],2],
    ['In a magnetic circuit, the analog of current is…',['mmf','flux','reluctance','permeance'],1],

  ];
  $('#quiz').innerHTML=QZ.map((q,i)=>`<div class="q"><b>${i+1}. ${q[0]}</b>${q[1].map((o,j)=>`<span class="opt" data-q="${i}" data-o="${j}">${o}</span>`).join('')}</div>`).join('')+`<div class="out" id="qscore">Score: 0 / ${QZ.length}</div>`;
  let answered={},score=0;

/* ============================================================ build nav + routing */
const main=$('#main'),nav=$('#nav');
function render(id){
  const s=SECTIONS.find(x=>x.id===id);if(!s)return;
  let el=$('#sec-'+id);
  if(!el){el=document.createElement('div');el.className='sec';el.id='sec-'+id;main.appendChild(el);s.builder(el);}
  $$('.sec').forEach(x=>x.classList.remove('on'));el.classList.add('on');
  $$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));
  window.scrollTo(0,0);location.hash=id;
}
function go(id){render(id);}
let lastGrp=null;
SECTIONS.forEach(s=>{
  if(s.group!==lastGrp){const g=document.createElement('div');g.className='grp';g.textContent=s.group;nav.appendChild(g);lastGrp=s.group;}
  const b=document.createElement('button');b.textContent=s.label;b.dataset.id=s.id;b.onclick=()=>go(s.id);nav.appendChild(b);
});
render((location.hash||'#intro').slice(1)||'intro');
</script>

<script id="emf-topic-nav-script">

      text-decoration: none;
      transition: opacity 0.15s, transform 0.15s;
    }
    .emf-btn-next-top:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .emf-topic-footer-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid var(--line, #2a2f4a);
      flex-wrap: wrap;
    }
    .emf-nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--panel2, #1e2237);
      color: var(--ink, #e8ebf7);
      border: 1px solid var(--line, #2a2f4a);
      border-radius: 9px;
      padding: 11px 18px;
      cursor: pointer;
      font: 600 13.5px system-ui, sans-serif;
      text-decoration: none;
      transition: all 0.15s ease;

    .emf-nav-btn:hover {
      background: var(--acc, #5b8cff);
      color: #ffffff;
      border-color: var(--acc, #5b8cff);
      transform: translateY(-1px);
    }

      opacity: 0.35;

    @media (max-width: 640px) {

        flex-direction: column;

        width: 100%;
        justify-content: center;
      }
      .emf-topic-footer-nav {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
        margin-top: 36px;
      }
      .emf-nav-btn {
        width: 100%;
        justify-content: center;
        text-align: center;
        white-space: normal;
        word-break: break-word;
        font-size: 13px;
        padding: 10px 14px;
      }

        text-align: center;
        width: 100%;
      }
      .main {
        padding: 14px 12px 60px !important;
      }
    }
  `;
  if (!document.getElementById('emf-nav-styles')) {
    document.head.appendChild(style);
  }

  // Sidebar Back Link
  var brand = document.querySelector('.side .brand');
  if (brand && !document.querySelector('.emf-side-back')) {
    var backBox = document.createElement('div');
    backBox.className = 'emf-side-back';
    backBox.innerHTML = '<a href="' + chPageUrl + '">← Back to Overview</a>';
    brand.parentNode.insertBefore(backBox, brand.nextSibling);
  }

  var mainEl = document.getElementById('main');

  function updateNavigation(activeId) {
    if (!window.SECTIONS || !mainEl) return;
    var idx = -1;
    for (var k = 0; k < SECTIONS.length; k++) {
      if (SECTIONS[k].id === activeId) { idx = k; break; }
    }
    if (idx === -1) idx = 0;

    var curSec = SECTIONS[idx];
    var prevSec = idx > 0 ? SECTIONS[idx - 1] : null;
    var nextSec = idx < SECTIONS.length - 1 ? SECTIONS[idx + 1] : null;

    // 1. Top bar
    var topBar = document.getElementById('emf-top-bar');
    if (!topBar) {
      topBar = document.createElement('div');
      topBar.id = 'emf-top-bar';
      topBar.className = 'emf-topic-header';
      mainEl.insertBefore(topBar, mainEl.firstChild);
    }
    var topNextBtn = nextSec
      ? '<button type="button" class="emf-btn-next-top" id="emf-top-next">Next Topic →</button>'
      : '<a href="' + chPageUrl + '" class="emf-btn-next-top">Chapter Overview →</a>';

    topBar.innerHTML =

        '<a href="' + chPageUrl + '">' + chTitle + '</a><span class="sep">›</span>' +
        '<span class="curr">' + curSec.label + '</span>' +
      '</div>' +
      '<div>' + topNextBtn + '</div>';

    var btnTopNext = document.getElementById('emf-top-next');
    if (btnTopNext && nextSec) {
      btnTopNext.onclick = function() { if (typeof render === 'function') render(nextSec.id); };
    }

    // 2. Bottom bar
    var bottomBar = document.getElementById('emf-bottom-bar');
    if (!bottomBar) {
      bottomBar = document.createElement('div');
      bottomBar.id = 'emf-bottom-bar';
      bottomBar.className = 'emf-topic-footer-nav';
      mainEl.appendChild(bottomBar);
    }

    var prevHtml = prevSec
      ? '<button type="button" class="emf-nav-btn" id="emf-bot-prev">← Previous: ' + prevSec.label + '</button>'
      : '<span class="emf-nav-btn disabled">← First Topic</span>';

    var nextHtml = nextSec
      ? '<button type="button" class="emf-nav-btn" id="emf-bot-next">Next: ' + nextSec.label + ' →</button>'
      : '<a href="' + chPageUrl + '" class="emf-nav-btn">Complete Chapter Overview →</a>';

    bottomBar.innerHTML =
      '<div>' + prevHtml + '</div>' +
      '<a href="' + chPageUrl + '" class="emf-overview-link">Back to Chapter Overview</a>' +
      '<div>' + nextHtml + '</div>';

    var btnBotPrev = document.getElementById('emf-bot-prev');
    if (btnBotPrev && prevSec) {
      btnBotPrev.onclick = function() { if (typeof render === 'function') render(prevSec.id); };
    }
    var btnBotNext = document.getElementById('emf-bot-next');
    if (btnBotNext && nextSec) {
      btnBotNext.onclick = function() { if (typeof render === 'function') render(nextSec.id); };
    }
  }

  // Hook render
  var origRender = window.render;
  if (typeof origRender === 'function') {
    window.render = function(id) {
      origRender(id);
      updateNavigation(id);
    };
  }

  // Hashchange listener for direct URL changes and browser back/forward
  window.addEventListener('hashchange', function() {
    var raw = (location.hash || '').slice(1);
    if (raw && window.SECTIONS) {
      var found = SECTIONS.some(function(s) { return s.id === raw; });
      if (found && typeof render === 'function') {
        render(raw);
      }
    }
  });

  // Initial update
  var initHash = (location.hash || '').slice(1);
  if (initHash && window.SECTIONS && SECTIONS.some(function(s) { return s.id === initHash; })) {
    updateNavigation(initHash);
  } else if (window.SECTIONS && SECTIONS.length > 0) {
    updateNavigation(SECTIONS[0].id);
  }
})();
</script>
