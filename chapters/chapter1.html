<title>EMF Ch.1 — Introduction to Machinery Principles (Interactive)</title>
<style>
:root{
  --bg:#0f1220; --panel:#171a2b; --panel2:#1e2237; --ink:#e8ebf7; --muted:#9aa3c4;
  --acc:#5b8cff; --acc2:#38d39f; --warn:#ffcc66; --bad:#ff6b81; --line:#2a2f4a;
  --chip:#242a44; --good:#38d39f;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 "Segoe UI",system-ui,Arial,sans-serif}
a{color:var(--acc)}
.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{padding:18px 18px 8px}
.brand h1{font-size:16px;margin:0}
.brand p{margin:4px 0 0;color:var(--muted);font-size:12px}
.nav{padding:8px;flex:1}
.brand a{font-size:12px}
.credit{border-top:1px solid var(--line);padding:12px 18px;font-size:12px;color:var(--muted)}
.credit b{color:var(--ink);font-weight:600}
.credit a{color:var(--acc)}
.nav button{display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--ink);
  padding:9px 12px;border-radius:9px;cursor:pointer;font-size:13.5px}
.nav button:hover{background:var(--panel2)}
.nav button.active{background:linear-gradient(90deg,var(--acc),#3a6cff);color:#fff;font-weight:600}
.nav .grp{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:12px 12px 4px}
.main{padding:26px 34px 80px;max-width:1020px}
.sec{display:none;animation:fade .25s ease}
.sec.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2.title{font-size:24px;margin:0 0 4px}
.subttl{color:var(--muted);margin:0 0 18px}
h3{margin:26px 0 8px;font-size:18px;border-left:3px solid var(--acc);padding-left:10px}
h4{margin:18px 0 6px;font-size:15px;color:var(--acc2)}
p{margin:8px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:14px 0}
.card.tight{padding:12px 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:860px){.app{grid-template-columns:1fr}.side{position:static;height:auto}.grid2,.grid3{grid-template-columns:1fr}.main{padding:18px}}
.eq{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0;
  font-family:"Cambria Math","Times New Roman",Georgia,serif;font-size:18px;overflow-x:auto;text-align:center}
.eq .tag{float:right;color:var(--muted);font-size:12px;font-family:system-ui}
.frac{display:inline-block;vertical-align:middle;text-align:center;margin:0 3px}
.frac .n{display:block;border-bottom:1.5px solid currentColor;padding:0 6px}
.frac .d{display:block;padding:0 6px}
i.v{font-style:italic}
sub,sup{font-size:.72em}
.vec{font-weight:700}
label.ctl{display:block;margin:10px 0}

input[type=range]{width:100%;accent-color:var(--acc)}
input[type=number],input[type=text],select{background:var(--panel2);border:1px solid var(--line);color:var(--ink);

  padding:9px 14px;cursor:pointer;font-size:14px;font-weight:600}
.btn.ghost{background:var(--chip);color:var(--ink);font-weight:500}
.btn.warn{background:linear-gradient(90deg,#ff9f43,#ff6b81)}

.out .k{color:var(--acc2);font-weight:600}
.pill{display:inline-block;background:var(--chip);border:1px solid var(--line);border-radius:999px;
  padding:2px 10px;font-size:12px;color:var(--muted);margin:2px 4px 2px 0}

details summary{cursor:pointer;color:var(--acc);font-weight:600}
details[open] summary{margin-bottom:6px}
.deriv{background:#14182b;border:1px solid #2c3557;border-radius:10px;padding:6px 12px;margin:10px 0}
.deriv summary{color:var(--warn)}
.step{margin:9px 0;padding:8px 12px;border-left:2px solid var(--acc);background:#0e1striped}
.step{background:#12162a;border-radius:0 8px 8px 0}
.step .why{color:var(--muted);font-size:12.5px;display:block;margin-top:2px}
canvas{max-width:100%;background:#0b0e1c;border:1px solid var(--line);border-radius:10px}
svg{max-width:100%}
table{border-collapse:collapse;width:100%;margin:10px 0;font-size:13.5px}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:center}
th{background:var(--panel2);color:var(--muted)}
.note{color:var(--muted);font-size:13px}
.flex{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.quiz .q{margin:10px 0}
.quiz .opt{display:block;margin:5px 0;padding:8px 12px;background:var(--panel2);border:1px solid var(--line);
  border-radius:8px;cursor:pointer}
.quiz .opt:hover{border-color:var(--acc)}
.quiz .opt.correct{border-color:var(--good);background:#0c1a14}
.quiz .opt.wrong{border-color:var(--bad);background:#1a0c10}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tabs .t{background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}
.tabs .t.on{background:var(--acc);color:#fff;border-color:var(--acc)}
hr{border:0;border-top:1px solid var(--line);margin:22px 0}
.badge{font-size:11px;background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted)}
.warnbox{background:#221a0c;border:1px solid #6b5320;border-radius:10px;padding:10px 14px;color:#ffe6a8;font-size:13.5px}
.okbox{background:#0c1a14;border:1px solid #1f5c45;border-radius:10px;padding:10px 14px;color:#bff0dc;font-size:13.5px}
.badbox{background:#1a0c10;border:1px solid #6b2530;border-radius:10px;padding:10px 14px;color:#ffc9d2;font-size:13.5px}
.seg-row{display:grid;grid-template-columns:1.3fr .9fr .9fr .9fr auto;gap:6px;margin:6px 0;align-items:center}
.seg-row .hd{color:var(--muted);font-size:12px}
.mini{font-size:12px;color:var(--muted)}
.gauge{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:center}
.gauge .g-l{color:var(--muted);font-size:12px}
.gauge .g-v{font-size:20px;font-weight:700;color:var(--acc2);font-variant-numeric:tabular-nums}

<div class="app">
  <aside class="side">

<script>
/* high-DPI canvases: every 2-D canvas is rendered at 2× device resolution and shown at its CSS size */
(function(){const P=HTMLCanvasElement.prototype,orig=P.getContext,K=Math.min(4,Math.max(2,(window.devicePixelRatio||1)*1.5));
  P.getContext=function(type,...a){const ctx=orig.call(this,type,...a);if(type!=='2d'||!ctx||this.dataset.hd)return ctx;
    const w=this.width,h=this.height;this.dataset.hd='1';if(!this.style.width)this.style.width=w+'px';this.style.maxWidth='100%';this.style.height='auto';
    this.width=w*K;this.height=h*K;ctx.scale(K,K);return ctx;};})();
/* ============================================================ helpers */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const fmt=(x,d=4)=>{
  if(x===null||x===undefined||!isFinite(x))return '—';
  if(x!==0 && (Math.abs(x)<1e-3||Math.abs(x)>=1e5)) return x.toExponential(d-1);
  return (+x.toFixed(d)).toString();
};
const MU0=4*Math.PI*1e-7;
const rnd=(a,b,step=1)=>{const n=Math.round((a+Math.random()*(b-a))/step)*step;return +n.toFixed(6);};

/* typical-steel B-H curve (approx Fig 1-10c) */
const BHpts=[[0,0],[20,0.10],[50,0.25],[70,0.44],[100,0.72],[150,0.95],[200,1.10],
  [300,1.28],[500,1.40],[700,1.47],[1000,1.51],[2000,1.57],[5000,1.63]];
function Bof(H){
  if(H<=0)return 0;
  for(let k=1;k<BHpts.length;k++){if(H<=BHpts[k][0]){
    const[a,ba]=BHpts[k-1],[b,bb]=BHpts[k];return ba+(bb-ba)*(H-a)/(b-a);}}
  return BHpts[BHpts.length-1][1];
}

/* ============================================================ registry */
const SECTIONS=[];
function section(id,group,label,builder){SECTIONS.push({id,group,label,builder});}

/* ============================================================ 1.1 / 1.2 */
section('intro','Foundations','1.1 · Intro & Units',(el)=>{
  el.innerHTML=`
  <h2 class="title">Introduction to Machinery Principles</h2>
  <p class="subttl">§1.1 Machines in daily life · units and notation (book §1.2)</p>
  <div class="card">
    <p>An <b>electrical machine</b> converts energy between mechanical and electrical form through a <b>magnetic field</b>.</p>
    <div class="flex">
      <span class="pill">Mechanical → Electrical = <b>Generator</b></span>
      <span class="pill">Electrical → Mechanical = <b>Motor</b></span>
      <span class="pill">AC voltage change = <b>Transformer</b></span>
    </div>
  </div>
  <h3>The four magnetic principles of this chapter</h3>
  <div class="grid2">
    <div class="card tight">1️⃣ A current-carrying wire produces a magnetic field. <span class="badge">§1.2 Ampère → §1.4 magnetic circuits</span></div>
    <div class="card tight">2️⃣ A time-changing field induces a voltage in a coil. <span class="badge">§1.5 transformer</span></div>
    <div class="card tight">3️⃣ A current-carrying wire in a field feels a force. <span class="badge">§1.6 motor</span></div>
    <div class="card tight">4️⃣ A wire moving in a field has a voltage induced. <span class="badge">§1.7 generator</span></div>
  </div>
  <h3>Units & notation</h3>
  <div class="card">
    <table>
      <tr><th>Quantity</th><th>SI</th><th>English</th></tr>
      <tr><td>Force</td><td>newton (N)</td><td>pound (lb)</td></tr>
      <tr><td>Torque</td><td>N·m</td><td>lb·ft</td></tr>
      <tr><td>Power</td><td>watt (W)</td><td>hp</td></tr>
      <tr><td>Flux density B</td><td>tesla (T = Wb/m²)</td><td>—</td></tr>
      <tr><td>Field intensity H</td><td>A·turns/m</td><td>—</td></tr>
    </table>
    <p class="note"><b>Notation:</b> vectors/phasors <b>bold</b> (<span class="vec">F</span>), scalars <i>italic</i> (<i class="v">R</i>), mmf in script (ℱ).</p>
  </div>
  <div class="card">
    <h4>Convert an angle / speed</h4>
    <div class="inrow"><input type="number" id="cv" value="180" step="any"><select id="cvu"><option value="deg">degrees</option><option value="rad">radians</option><option value="rev">revolutions</option></select></div>
    <div class="out" id="cvout"></div>
  </div>`;
  const upd=()=>{const v=+$('#cv').value,u=$('#cvu').value;let deg;
    if(u==='deg')deg=v;else if(u==='rad')deg=v*180/Math.PI;else deg=v*360;
    $('#cvout').innerHTML=`<span class="k">${fmt(deg)}°</span> = <span class="k">${fmt(deg*Math.PI/180)} rad</span> = <span class="k">${fmt(deg/360)} rev</span>`;};
  $('#cv').oninput=upd;$('#cvu').onchange=upd;upd();
});

/* ============================================================ 1.3 */
/* ============================================================ Ampère's law — prelude to 1.4 */
section('ampere','Foundations','1.2 · Ampère\'s Law · Current → Field',(el)=>{
  el.innerHTML=`
  <style>@media(max-width:900px){.apgrid{grid-template-columns:1fr!important}}</style>
  <h2 class="title">Ampère's Law — How a Current Produces a Magnetic Field</h2>
  <p class="subttl">§1.2 · one wire → solenoid → toroid → the magnetic-circuit law φ = ℱ/ℛ (developed fully in §1.4)</p>

  <div class="card">
    <p>In 1820 Ørsted saw a compass needle swing beside a wire carrying current: <b>a moving charge creates a magnetic field</b>. Ampère put a number on it. Walk around <em>any</em> closed path and add up the field intensity along the way — the total equals the current threading through that path:</p>
    <div class="eq">∮ <span class="vec">H</span> · d<span class="vec">l</span> = I<sub>net</sub> <span class="tag">(1‑18)</span></div>
    <div class="grid3">
      <div class="okbox"><b>∮ … dl</b> — a closed loop, the <i>Amperian path</i>. You choose it: pick one that follows the field so H is constant along it and the integral becomes H × (path length).</div>
      <div class="okbox"><b>H</b> — magnetic field <b>intensity</b> (A/m). Only the part of H <em>along</em> the path counts.</div>
      <div class="okbox"><b>I<sub>net</sub></b> — the net current <b>piercing</b> the loop. N turns of the same wire pass through N times, so I<sub>net</sub> = N·i.</div>
    </div>
    <p class="note"><b>Right-hand rule:</b> point the thumb along the current — the curled fingers give the direction of H (and B).</p>
  </div>

  <h3>Step 1 — A single straight conductor</h3>
  <p class="note">The field lines are circles centred on the wire. Take a circle of radius r as the Amperian path: H is the same size everywhere on it and always tangential, so the integral is simply H × (2πr). The white dot walks the loop and the green bar accumulates ∮H·dl — it always finishes at exactly I.</p>
  <div class="card">
    <div class="apgrid" style="display:grid;grid-template-columns:270px 1fr;gap:16px;align-items:start">
      <div>
        <label class="ctl"><span class="lab">Current I <span class="val" id="ap_Iv"></span></span><input type="range" id="ap_I" min="-20" max="20" step="0.5" value="10"></label>
        <label class="ctl"><span class="lab">Loop radius r <span class="val" id="ap_rv"></span></span><input type="range" id="ap_r" min="0.02" max="0.20" step="0.005" value="0.05"></label>
        <div class="eq" style="font-size:16px">H·(2πr) = I  ⇒  H = <span class="frac"><span class="n">I</span><span class="d">2πr</span></span></div>
        <div class="out" id="ap_wout" style="font-size:13px"></div>
        <p class="note">Bigger loop → same enclosed I spread over a longer path → smaller H. Flip the sign of I and the field reverses.</p>
      </div>
      <canvas id="ap_wcan" width="520" height="360" style="width:100%"></canvas>
    </div>
  </div>

  <h3>H versus B — field <em>intensity</em> versus flux <em>density</em></h3>
  <div class="card">
    <div class="grid2">
      <div>
        <table>
          <tr><th></th><th>H — field intensity</th><th>B — flux density</th></tr>
          <tr><td>unit</td><td>A/m (ampere-turns per metre)</td><td>T = Wb/m²</td></tr>
          <tr><td>fixed by</td><td>current &amp; geometry only (Ampère's law)</td><td>H <em>and</em> the material: B = μH</td></tr>
          <tr><td>role</td><td>the "effort" — the cause</td><td>the "result" — the effect</td></tr>
          <tr><td>material?</td><td>independent of μ</td><td>× μ<sub>r</sub> inside iron (hundreds to thousands)</td></tr>
          <tr><td>leads to</td><td>—</td><td>flux φ = B·A (Wb)</td></tr>
        </table>
        <div class="eq">B = μH = μ<sub>r</sub> μ<sub>0</sub> H,   μ<sub>0</sub> = 4π×10⁻⁷ H/m <span class="tag">(1‑21)</span></div>
        <p class="note">Same coil, same current → same H. Slide an iron core in and B jumps by μ<sub>r</sub>. That is why machines are built around steel, not air.</p>
      </div>
      <div>
        <label class="ctl"><span class="lab">Core material <span class="val" id="ap_muv"></span></span><input type="range" id="ap_mu" min="0" max="100" step="1" value="0"></label>
        <div id="ap_hb"></div>
        <p class="note">Drag from air (μ<sub>r</sub>=1) towards steel (μ<sub>r</sub>≈2000–3000). H does not move; B does.</p>
      </div>
    </div>
  </div>

  <h3>Step 2 — Many turns: the solenoid</h3>
  <p class="note">Wind N turns over a length ℓ. Inside, the fields of all the turns add and point along the axis; outside they nearly cancel. Choose a rectangular Amperian loop: one side inside (contributes H·ℓ), one side outside (≈0), two sides perpendicular to H (0). N wires pierce it, so I<sub>net</sub> = N·I.</p>
  <div class="card">
    <div class="apgrid" style="display:grid;grid-template-columns:270px 1fr;gap:16px;align-items:start">
      <div>
        <label class="ctl"><span class="lab">Turns N <span class="val" id="ap_Nv"></span></span><input type="range" id="ap_N" min="5" max="60" step="1" value="20"></label>
        <label class="ctl"><span class="lab">Length ℓ <span class="val" id="ap_lv"></span></span><input type="range" id="ap_l" min="0.10" max="0.50" step="0.01" value="0.20"></label>
        <label class="ctl"><span class="lab">Current I <span class="val" id="ap_sIv"></span></span><input type="range" id="ap_sI" min="-10" max="10" step="0.5" value="5"></label>
        <div class="grid2">
          <label class="ctl"><span class="lab"><span>Core μ<sub>r</sub></span></span><select id="ap_smu"><option value="1" selected>Air (1)</option><option value="200">Cast iron (≈200)</option><option value="2000">Si-steel (≈2000)</option><option value="5000">Best steel (≈5000)</option></select></label>
          <label class="ctl"><span class="lab">Area A (cm²)</span><input type="number" id="ap_sA" value="4" step="any" min="0.1"></label>
        </div>
        <div class="eq" style="font-size:16px">H·ℓ = N·I  ⇒  H = <span class="frac"><span class="n">N I</span><span class="d">ℓ</span></span></div>
        <div class="out" id="ap_sout" style="font-size:13px"></div>
      </div>
      <canvas id="ap_scan" width="520" height="340" style="width:100%"></canvas>
    </div>
  </div>

  <h3>Step 3 — Close the loop: the toroid (a real core)</h3>
  <p class="note">Bend the solenoid into a ring. The field is now trapped inside the core, and the natural Amperian path is the mean circumference ℓ<sub>c</sub> = 2πr. Every one of the N turns pierces it — exactly the same law, but now the core sets the path length.</p>
  <div class="card">
    <div class="apgrid" style="display:grid;grid-template-columns:270px 1fr;gap:16px;align-items:start">
      <div>
        <label class="ctl"><span class="lab">Turns N <span class="val" id="ap_tNv"></span></span><input type="range" id="ap_tN" min="10" max="500" step="10" value="200"></label>
        <label class="ctl"><span class="lab">Current I <span class="val" id="ap_tIv"></span></span><input type="range" id="ap_tI" min="0" max="10" step="0.25" value="2"></label>
        <label class="ctl"><span class="lab">Mean radius r <span class="val" id="ap_trv"></span></span><input type="range" id="ap_tr" min="0.05" max="0.25" step="0.005" value="0.10"></label>
        <div class="grid2">
          <label class="ctl"><span class="lab"><span>Core μ<sub>r</sub></span></span><select id="ap_tmu"><option value="1">Air (1)</option><option value="200">Cast iron (≈200)</option><option value="2000" selected>Si-steel (≈2000)</option><option value="5000">Best steel (≈5000)</option></select></label>
          <label class="ctl"><span class="lab">Area A (cm²)</span><input type="number" id="ap_tA" value="4" step="any" min="0.1"></label>
        </div>
        <div class="eq" style="font-size:16px">H·ℓ<sub>c</sub> = N·I  ⇒  H = <span class="frac"><span class="n">N I</span><span class="d">ℓ<sub>c</sub></span></span></div>
        <div class="out" id="ap_tout" style="font-size:13px"></div>
      </div>
      <canvas id="ap_tcan" width="520" height="340" style="width:100%"></canvas>
    </div>
  </div>

  <h3>Step 4 — From Ampère's law to the magnetic circuit</h3>
  <div class="card">
    <p>Look at the toroid result again. The flux came out as φ = (μA/ℓ<sub>c</sub>) × N·I — a <em>drive</em> (N·I) divided by something that depends only on the core's geometry and material. That "something" behaves exactly like a resistance:</p>
    <details class="deriv" open><summary>Derivation chain — the bridge into §1.4</summary>
      <div class="step">① Ampère's law around the mean path: H·ℓ<sub>c</sub> = N·i.<span class="why">Path length ℓ<sub>c</sub>, pierced by N turns — Eq.(1‑19).</span></div>
      <div class="step">② Field intensity: H = N·i / ℓ<sub>c</sub>.<span class="why">Eq.(1‑20). Pure geometry + current — no material yet.</span></div>
      <div class="step">③ Material law: B = μH = μ·N·i / ℓ<sub>c</sub>.<span class="why">Eq.(1‑21). Iron multiplies B by μ<sub>r</sub>.</span></div>
      <div class="step">④ Flux through the cross-section: φ = B·A = (μA/ℓ<sub>c</sub>)·N·i.<span class="why">Eq.(1‑26). Uniform B over area A.</span></div>
      <div class="step">⑤ Name the parts: <b>ℱ = N·i</b> (magnetomotive force) and <b>ℛ = ℓ<sub>c</sub>/(μA)</b> (reluctance) → <b>φ = ℱ/ℛ</b>.<span class="why">Eqs.(1‑27),(1‑28),(1‑32) — Ohm's law for flux.</span></div>
      <div class="step">⑥ Any closed core works the same way: replace ℓ<sub>c</sub> by the mean path length; series parts (iron, air gap) add their reluctances.<span class="why">This is the whole method of §1.4.</span></div>
    </details>
    <div class="grid3">
      <div class="eq" style="text-align:center">ℱ = N·i<span class="tag">mmf, A·t</span></div>
      <div class="eq" style="text-align:center">ℛ = <span class="frac"><span class="n">ℓ<sub>c</sub></span><span class="d">μA</span></span><span class="tag">A·t/Wb</span></div>
      <div class="eq" style="text-align:center">φ = <span class="frac"><span class="n">ℱ</span><span class="d">ℛ</span></span><span class="tag">(1‑28)</span></div>
    </div>
    <div class="okbox">Electric circuit: <b>V = I·R</b>  ⇄  Magnetic circuit: <b>ℱ = φ·ℛ</b>. mmf plays voltage, flux plays current, reluctance plays resistance. Everything you know about series/parallel resistors carries straight across.</div>
    <p style="margin-top:12px"><button class="btn" id="ap_go">Continue to §1.4 Magnetic Circuits →</button></p>
  </div>`;

  const apOn=()=>$('#sec-ampere').classList.contains('on');
  const ahead=(c,x,y,ang,col,s=7)=>{c.fillStyle=col;c.beginPath();c.moveTo(x+s*Math.cos(ang),y+s*Math.sin(ang));c.lineTo(x+s*Math.cos(ang+2.5),y+s*Math.sin(ang+2.5));c.lineTo(x+s*Math.cos(ang-2.5),y+s*Math.sin(ang-2.5));c.closePath();c.fill();};
  const turnMark=(c,x,y,kind)=>{c.fillStyle='#12162a';c.strokeStyle='#ffcc66';c.lineWidth=1.5;c.beginPath();c.arc(x,y,5,0,7);c.fill();c.stroke();
    if(kind==='dot'){c.fillStyle='#ffcc66';c.beginPath();c.arc(x,y,2,0,7);c.fill();}
    else if(kind==='x'){c.beginPath();c.moveTo(x-3,y-3);c.lineTo(x+3,y+3);c.moveTo(x-3,y+3);c.lineTo(x+3,y-3);c.stroke();}};

  /* ---- Step 1: single wire ---- */
  const wc=$('#ap_wcan').getContext('2d');let wph=0,wth=0;
  const rpx=r=>40+(r-0.02)/0.18*104;
  function updWire(){const I=+$('#ap_I').value,r=+$('#ap_r').value,Hf=Math.abs(I)/(2*Math.PI*r),B=MU0*Hf;
    $('#ap_Iv').textContent=I+' A';$('#ap_rv').textContent=r.toFixed(3)+' m';
    $('#ap_wout').innerHTML=`∮H·dl = H·(2πr) = I\nH = I/(2πr) = ${Math.abs(I)}/(2π×${r.toFixed(3)}) = <span class="k">${fmt(Hf,2)} A/m</span>\nB = μ₀H = <span class="k">${fmt(B*1e6,2)} µT</span>  (air, μ<sub>r</sub>=1)\nDirection: <span class="k">${I>0?'counter-clockwise ⟲':I<0?'clockwise ⟳':'no field (I = 0)'}</span>`;}
  function drawWire(){
    const I=+$('#ap_I').value,r=+$('#ap_r').value,dir=I>=0?1:-1,mag=Math.abs(I);
    const W=520,H=360,cx=250,cy=160;wc.clearRect(0,0,W,H);
    [40,66,92,118,144].forEach(R=>{const al=Math.min(0.95,0.12+0.85*(mag/20)*(40/R));const col=`rgba(91,140,255,${al.toFixed(3)})`;
      wc.strokeStyle=col;wc.lineWidth=1.4;wc.beginPath();wc.arc(cx,cy,R,0,7);wc.stroke();
      if(mag>0)for(let k=0;k<6;k++){const th=wph+k*Math.PI/3,x=cx+R*Math.cos(th),y=cy-R*Math.sin(th);ahead(wc,x,y,Math.atan2(-Math.cos(th)*dir,-Math.sin(th)*dir),col,6);}});
    wc.fillStyle='#12162a';wc.strokeStyle='#ffcc66';wc.lineWidth=2;wc.beginPath();wc.arc(cx,cy,13,0,7);wc.fill();wc.stroke();
    wc.fillStyle='#ffcc66';
    if(I>0){wc.beginPath();wc.arc(cx,cy,4.5,0,7);wc.fill();}
    else if(I<0){wc.lineWidth=2.5;wc.beginPath();wc.moveTo(cx-6,cy-6);wc.lineTo(cx+6,cy+6);wc.moveTo(cx-6,cy+6);wc.lineTo(cx+6,cy-6);wc.stroke();}
    wc.font='12px system-ui';wc.fillText(I>0?'I out of page ⊙':I<0?'I into page ⊗':'I = 0',cx+18,cy-18);
    const R=rpx(r);wc.setLineDash([6,5]);wc.strokeStyle='#ffcc66';wc.lineWidth=2;wc.beginPath();wc.arc(cx,cy,R,0,7);wc.stroke();wc.setLineDash([]);
    wc.strokeStyle='rgba(255,204,102,.6)';wc.lineWidth=1;wc.beginPath();wc.moveTo(cx,cy);wc.lineTo(cx+R,cy);wc.stroke();wc.fillStyle='#ffcc66';wc.fillText('r',cx+R/2-3,cy+14);
    const th=wth,dx=cx+R*Math.cos(th),dy=cy-R*Math.sin(th),ang=Math.atan2(-Math.cos(th)*dir,-Math.sin(th)*dir);
    if(mag>0){wc.strokeStyle='#38d39f';wc.lineWidth=2.5;wc.beginPath();wc.moveTo(dx,dy);wc.lineTo(dx+22*Math.cos(ang),dy+22*Math.sin(ang));wc.stroke();ahead(wc,dx+22*Math.cos(ang),dy+22*Math.sin(ang),ang,'#38d39f',7);wc.fillStyle='#38d39f';wc.fillText('H',dx+28*Math.cos(ang)-3,dy+28*Math.sin(ang)+4);}
    wc.fillStyle='#fff';wc.beginPath();wc.arc(dx,dy,5,0,7);wc.fill();
    const f=(((th*dir)%(2*Math.PI))+2*Math.PI)%(2*Math.PI)/(2*Math.PI);
    const bx=40,by=332,bw=440,bh=12;
    wc.fillStyle='#1e2237';wc.fillRect(bx,by,bw,bh);wc.fillStyle='#38d39f';wc.fillRect(bx,by,bw*f,bh);wc.strokeStyle='#2a2f4a';wc.strokeRect(bx,by,bw,bh);
    wc.fillStyle='#e8ebf7';wc.font='12px system-ui';wc.fillText(`∮H·dl so far = H·(r·θ) = ${fmt(mag*f,2)} A     →     full loop = I = ${fmt(mag,2)} A`,bx,by-6);
    wc.fillStyle='#9aa3c4';wc.font='11px system-ui';wc.fillText('field lines circle the wire — right-hand rule · dashed = Amperian loop',12,16);
    wph+=0.004*I;if(mag>0)wth+=0.03*dir;
  }

  /* ---- H vs B mini ---- */
  function updHB(){const v=+$('#ap_mu').value,mur=Math.round(Math.pow(10,v/100*3.5));$('#ap_muv').textContent='μr = '+mur;
    const Hf=500,Ba=MU0*Hf,Bm=mur*Ba,lg=b=>(Math.log10(b)+4)/5,h1=Math.max(3,120*lg(Ba)),h2=Math.max(3,120*lg(Bm));
    $('#ap_hb').innerHTML=`<svg viewBox="0 0 300 178" style="width:100%">
      <text x="10" y="16" fill="#9aa3c4" font-size="12">same H = 500 A/m in both</text>
      <text x="292" y="16" fill="#9aa3c4" font-size="10" text-anchor="end">log scale</text>
      <line x1="40" y1="150" x2="290" y2="150" stroke="#2a2f4a"/>
      <rect x="70" y="${150-h1}" width="60" height="${h1}" fill="#5b8cff" rx="3"/>
      <rect x="190" y="${150-h2}" width="60" height="${h2}" fill="#ffcc66" rx="3"/>
      <text x="100" y="${150-h1-6}" fill="#5b8cff" font-size="12" text-anchor="middle">B = ${fmt(Ba*1e3,3)} mT</text>
      <text x="220" y="${150-h2-6}" fill="#ffcc66" font-size="12" text-anchor="middle">B = ${Bm>=1?fmt(Bm,3)+' T':fmt(Bm*1e3,3)+' mT'}</text>
      <text x="100" y="168" fill="#9aa3c4" font-size="12" text-anchor="middle">air (μr = 1)</text>
      <text x="220" y="168" fill="#9aa3c4" font-size="12" text-anchor="middle">core (μr = ${mur})</text>
    </svg>`;}

  /* ---- Step 2: solenoid ---- */
  const sc=$('#ap_scan').getContext('2d');let sph=0;
  function updSol(){const N=+$('#ap_N').value,ell=+$('#ap_l').value,I=+$('#ap_sI').value,mur=+$('#ap_smu').value,A=(+$('#ap_sA').value||0)*1e-4;
    $('#ap_Nv').textContent=N+' turns';$('#ap_lv').textContent=ell.toFixed(2)+' m';$('#ap_sIv').textContent=I+' A';
    const Hf=N*I/ell,B=mur*MU0*Hf,phi=B*A;
    $('#ap_sout').innerHTML=`I<sub>net</sub> = N·I = ${N} × ${I} = <span class="k">${fmt(N*I,1)} A·t</span>\nH = NI/ℓ = ${fmt(N*I,1)} / ${ell.toFixed(2)} = <span class="k">${fmt(Hf,1)} A/m</span>\nB = μ<sub>r</sub>μ<sub>0</sub>H = ${mur} × 4π×10⁻⁷ × ${fmt(Hf,1)} = <span class="k">${fmt(B,4)} T</span>\nφ = B·A = <span class="k">${fmt(phi,4)} Wb</span>`;}
  function drawSol(){
    const N=+$('#ap_N').value,ell=+$('#ap_l').value,I=+$('#ap_sI').value,dir=I>=0?1:-1,mag=Math.abs(I);
    const W=520,H=340;sc.clearRect(0,0,W,H);
    const L=200+(ell-0.1)/0.4*240,x0=260-L/2,x1=260+L/2,yT=110,yB=240,yA=175,Hrel=Math.min(1,(N*mag/ell)/1500);
    sc.fillStyle='rgba(56,211,159,0.06)';sc.fillRect(x0,yT,L,yB-yT);sc.strokeStyle='#2a2f4a';sc.strokeRect(x0,yT,L,yB-yT);
    const span=L-12;
    [130,152,175,198,220].forEach((y,row)=>{const col=`rgba(56,211,159,${(0.25+0.7*Hrel).toFixed(2)})`;
      sc.strokeStyle=col;sc.lineWidth=1.5;sc.beginPath();sc.moveTo(x0+6,y);sc.lineTo(x1-6,y);sc.stroke();
      if(mag>0)for(let k=0;k<5;k++){const p=(((sph+row*9+k*span/5)%span)+span)%span,x=dir>0?x0+6+p:x1-6-p;ahead(sc,x,y,dir>0?0:Math.PI,col,6);}});
    const n=Math.min(N,Math.floor(L/9)),sp=L/n;
    for(let k=0;k<n;k++){const x=x0+sp*(k+0.5);turnMark(sc,x,yT,I>0?'dot':I<0?'x':'none');turnMark(sc,x,yB,I>0?'x':I<0?'dot':'none');}
    sc.fillStyle='#9aa3c4';sc.font='11px system-ui';if(n<N)sc.fillText(`(drawing ${n} of ${N} turns)`,x0,yB+42);
    sc.strokeStyle='#9aa3c4';sc.lineWidth=1;sc.beginPath();sc.moveTo(x0,yB+22);sc.lineTo(x1,yB+22);sc.moveTo(x0,yB+17);sc.lineTo(x0,yB+27);sc.moveTo(x1,yB+17);sc.lineTo(x1,yB+27);sc.stroke();
    sc.fillStyle='#e8ebf7';sc.font='12px system-ui';sc.fillText(`ℓ = ${ell.toFixed(2)} m,  N = ${N} turns`,x0+L/2-60,yB+38);
    sc.setLineDash([6,5]);sc.strokeStyle='#ffcc66';sc.lineWidth=2;sc.strokeRect(x0-12,60,L+24,yA-60);sc.setLineDash([]);
    sc.fillStyle='#ffcc66';sc.fillText('inside: H·ℓ',x0+L/2-30,yA+16);sc.fillText('outside: H ≈ 0',x0+L/2-38,54);
    sc.save();sc.translate(x0-18,150);sc.rotate(-Math.PI/2);sc.fillText('H ⟂ dl → 0',0,0);sc.restore();
    sc.save();sc.translate(x1+28,150);sc.rotate(-Math.PI/2);sc.fillText('H ⟂ dl → 0',0,0);sc.restore();
    sc.fillStyle='#e8ebf7';sc.fillText(`loop pierced by N = ${N} wires  →  I_net = N·I = ${fmt(N*I,1)} A·t`,12,H-10);
    sc.fillStyle='#9aa3c4';sc.font='11px system-ui';sc.fillText('⊙ current out of page   ⊗ current into page   green = H inside',12,16);
    sph+=0.6+2.4*Hrel;
  }

  /* ---- Step 3: toroid ---- */
  const tc=$('#ap_tcan').getContext('2d');let tph=0;
  function updTor(){const N=+$('#ap_tN').value,I=+$('#ap_tI').value,r=+$('#ap_tr').value,A=(+$('#ap_tA').value||0)*1e-4,mur=+$('#ap_tmu').value;
    $('#ap_tNv').textContent=N+' turns';$('#ap_tIv').textContent=I+' A';$('#ap_trv').textContent=r.toFixed(3)+' m';
    const lc=2*Math.PI*r,Hf=N*I/lc,mu=mur*MU0,B=mu*Hf,phi=B*A,F=N*I,Rl=A>0?lc/(mu*A):Infinity,phi2=F/Rl;
    $('#ap_tout').innerHTML=`ℓ<sub>c</sub> = 2πr = <span class="k">${fmt(lc,4)} m</span>\nH = NI/ℓ<sub>c</sub> = ${N}×${I} / ${fmt(lc,4)} = <span class="k">${fmt(Hf,1)} A/m</span>\nB = μ<sub>r</sub>μ<sub>0</sub>H = <span class="k">${fmt(B,4)} T</span>${B>1.8?'  ⚠ real steel saturates here (see §1.4 Nonlinear B‑H)':''}\nφ = B·A = <span class="k">${fmt(phi,4)} Wb</span>\n— the same result in circuit form —\nℱ = N·i = <span class="k">${fmt(F,1)} A·t</span>     ℛ = ℓ<sub>c</sub>/(μA) = <span class="k">${fmt(Rl,4)} A·t/Wb</span>\nφ = ℱ/ℛ = <span class="k">${fmt(phi2,4)} Wb</span> ✓`;}
  function drawTor(){
    const N=+$('#ap_tN').value,I=+$('#ap_tI').value,r=+$('#ap_tr').value,dir=1,mag=Math.abs(I);
    const W=520,H=340,cx=260,cy=172;tc.clearRect(0,0,W,H);
    const Rm=75+(r-0.05)/0.2*50,t=36,Ri=Rm-t/2,Ro=Rm+t/2;
    tc.fillStyle='#232a49';tc.beginPath();tc.arc(cx,cy,Ro,0,7);tc.arc(cx,cy,Ri,0,7,true);tc.fill();
    tc.strokeStyle='#3a4680';tc.lineWidth=1.5;tc.beginPath();tc.arc(cx,cy,Ro,0,7);tc.stroke();tc.beginPath();tc.arc(cx,cy,Ri,0,7);tc.stroke();
    const n=Math.min(N,72);tc.strokeStyle='rgba(255,204,102,.75)';tc.lineWidth=2;
    for(let k=0;k<n;k++){const a=k/n*2*Math.PI;tc.beginPath();tc.moveTo(cx+(Ri-7)*Math.cos(a),cy+(Ri-7)*Math.sin(a));tc.lineTo(cx+(Ro+7)*Math.cos(a),cy+(Ro+7)*Math.sin(a));tc.stroke();}
    tc.setLineDash([6,5]);tc.strokeStyle='#ffcc66';tc.lineWidth=2;tc.beginPath();tc.arc(cx,cy,Rm,0,7);tc.stroke();tc.setLineDash([]);
    if(mag>0)for(let k=0;k<10;k++){const th=tph+k*Math.PI/5,x=cx+Rm*Math.cos(th),y=cy-Rm*Math.sin(th);ahead(tc,x,y,Math.atan2(-Math.cos(th)*dir,-Math.sin(th)*dir),'#38d39f',7);}
    tc.strokeStyle='rgba(255,204,102,.6)';tc.lineWidth=1;tc.beginPath();tc.moveTo(cx,cy);tc.lineTo(cx+Rm*Math.cos(-0.6),cy+Rm*Math.sin(-0.6));tc.stroke();
    tc.fillStyle='#ffcc66';tc.font='12px system-ui';tc.fillText('r',cx+Rm*0.55*Math.cos(-0.6)+5,cy+Rm*0.55*Math.sin(-0.6)+2);
    tc.fillStyle='#9aa3c4';tc.font='11px system-ui';tc.textAlign='center';tc.fillText('H = 0 in the hole',cx,cy+2);tc.fillText('(no current enclosed)',cx,cy+15);tc.textAlign='left';
    tc.fillStyle='#e8ebf7';tc.font='12px system-ui';tc.fillText(`N = ${N} turns (drawing ${n}),  I = ${I} A`,12,16);
    tc.fillStyle='#38d39f';tc.fillText('green = H, B circulating in the core',12,H-28);
    tc.fillStyle='#ffcc66';tc.fillText('dashed = Amperian loop = mean path, ℓc = 2πr',12,H-12);
    tph+=(0.005+0.03*Math.min(1,N*mag/1000))*dir;
  }

  function apLoop(){if(apOn()){drawWire();drawSol();drawTor();}requestAnimationFrame(apLoop);}
  ['ap_I','ap_r'].forEach(id=>$('#'+id).oninput=updWire);
  ['ap_N','ap_l','ap_sI','ap_sA'].forEach(id=>$('#'+id).oninput=updSol);$('#ap_smu').onchange=updSol;
  ['ap_tN','ap_tI','ap_tr','ap_tA'].forEach(id=>$('#'+id).oninput=updTor);$('#ap_tmu').onchange=updTor;
  $('#ap_mu').oninput=updHB;$('#ap_go').onclick=()=>go('mag');
  updWire();updHB();updSol();updTor();drawWire();drawSol();drawTor();apLoop();
});

section('rot','Foundations','1.3 · Rotation, Newton & Power',(el)=>{
  el.innerHTML=`
  <h2 class="title">Rotational Motion, Newton's Law & Power</h2>
  <p class="subttl">§1.3 · Equations 1‑1 → 1‑17 — rotational analogs of linear motion</p>
  <div class="card">
    <table>
      <tr><th>Linear</th><th>Rotational</th><th>Eq.</th></tr>
      <tr><td>v = dr/dt</td><td>ω = dθ/dt</td><td>1‑1, 1‑2</td></tr>
      <tr><td>a = dv/dt</td><td>α = dω/dt</td><td>1‑4, 1‑5</td></tr>
      <tr><td>F = ma</td><td>τ = Jα</td><td>1‑7, 1‑8</td></tr>
      <tr><td>W = ∫F dr</td><td>W = ∫τ dθ</td><td>1‑9, 1‑11</td></tr>
      <tr><td>P = Fv</td><td>P = τω</td><td>1‑14, 1‑15</td></tr>
    </table>
  </div>

  <div class="eq">ω<sub>m</sub> = 2π f<sub>m</sub> = <span class="frac"><span class="n">2π n<sub>m</sub></span><span class="d">60</span></span> <span class="tag">(1‑3)</span></div>
  <details class="deriv"><summary>Derive P = τω step by step (1‑15)</summary>
    <div class="step">① Start from the definition of power: P = dW/dt.<span class="why">Power is the rate of doing work — Eq. (1‑13).</span></div>
    <div class="step">② Rotational work for constant torque: W = τθ.<span class="why">Work = torque applied through an angle — Eq. (1‑12).</span></div>
    <div class="step">③ Substitute: P = d(τθ)/dt = τ·dθ/dt.<span class="why">τ is constant, so it factors out of the derivative.</span></div>
    <div class="step">④ But dθ/dt = ω, so <b>P = τω</b>.<span class="why">Definition of angular velocity — Eq. (1‑2). This is the shaft-power equation.</span></div>
    <div class="step">⑤ In mixed US units (τ in lb·ft, n in r/min): P(W)=τn/7.04, P(hp)=τn/5252.<span class="why">Fold in 2π/60 and 1 hp = 746 W as constants — Eqs. (1‑16),(1‑17).</span></div>
  </details>

  <style>@media(max-width:900px){.rgrid{grid-template-columns:1fr!important}}</style>
  <h3>▶ See it spin — torque, inertia, acceleration &amp; power</h3>
  <p class="note">Apply a torque to a flywheel: τ<sub>net</sub> = Jα makes ω grow, θ accumulates, and the power delivered P = τω climbs with speed. Add load (friction) torque and watch it settle when τ<sub>app</sub> = τ<sub>load</sub>.</p>
  <div class="card">
    <div class="rgrid" style="display:grid;grid-template-columns:270px 1fr;gap:16px;align-items:start">
      <div>
        <label class="ctl"><span class="lab">Applied torque τ<sub>app</sub> <span class="val" id="sp_t_v"></span></span><input type="range" id="sp_t" min="0" max="20" step="0.5" value="5"></label>
        <label class="ctl"><span class="lab">Moment of inertia J <span class="val" id="sp_J_v"></span></span><input type="range" id="sp_J" min="0.5" max="10" step="0.5" value="2"></label>
        <label class="ctl"><span class="lab">Load (friction) torque τ<sub>load</sub> <span class="val" id="sp_L_v"></span></span><input type="range" id="sp_L" min="0" max="10" step="0.5" value="0"></label>
        <div class="flex"><button class="btn" id="sp_run">▶ Start</button><button class="btn ghost" id="sp_reset">↺ Reset</button></div>
        <div class="out" id="sp_out" style="font-size:13px"></div>
      </div>
      <canvas id="rotCan" width="520" height="300" style="width:100%"></canvas>
    </div>
  </div>

  <h3>Speed conversion <span class="badge">Problem 1‑1</span></h3>
  <div class="card">
    <label class="ctl"><span class="lab">n<sub>m</sub> (r/min)</span><input type="number" id="r_n" value="3000" step="any"></label>
    <div class="out" id="r_spd"></div>
  </div>

  <h3>Torque — τ = rF sin θ <span class="badge">Problem 1‑3</span></h3>
  <details class="deriv"><summary>Derive τ = rF sin θ (1‑6)</summary>
    <div class="step">① Torque = (applied force)(perpendicular distance).<span class="why">Only the component of F perpendicular to r twists the object.</span></div>
    <div class="step">② Perpendicular distance from axis to line of action = r sin θ.<span class="why">θ is the angle between position vector r and force F.</span></div>
    <div class="step">③ Therefore <b>τ = F·(r sin θ) = rF sin θ</b>.<span class="why">Max at θ=90° (F ⟂ r); zero at θ=0° (F through axis).</span></div>
  </details>
  <div class="card">
    <div class="grid2">
      <div>
        <label class="ctl"><span class="lab">Force F (N) <span class="val" id="tF_v"></span></span><input type="range" id="tF" min="0" max="50" value="10" step="0.5"></label>
        <label class="ctl"><span class="lab">Radius r (m) <span class="val" id="tr_v"></span></span><input type="range" id="tr" min="0.05" max="1" value="0.25" step="0.01"></label>
        <label class="ctl"><span class="lab">Angle θ (°) <span class="val" id="tth_v"></span></span><input type="range" id="tth" min="0" max="180" value="150" step="1"></label>
        <div class="out" id="tout"></div>
      </div>
      <div><canvas id="tcan" width="380" height="300"></canvas></div>
    </div>
  </div>

  <h3>Newton's law & Power <span class="badge">Problem 1‑4</span></h3>
  <div class="grid2">
    <div class="eq" style="text-align:center">τ = Jα <span class="tag">(1‑8)</span></div>
    <div class="eq" style="text-align:center">P = τω <span class="tag">(1‑15)</span></div>
  </div>
  <div class="card">
    <div class="grid2">
      <label class="ctl"><span class="lab">Torque τ (N·m)</span><input type="number" id="p_t" value="60" step="any"></label>
      <label class="ctl"><span class="lab">Speed n (r/min)</span><input type="number" id="p_n" value="1800" step="any"></label>
    </div>
    <div class="out" id="p_out"></div>
  </div>

  <h3>Flywheel spin-up <span class="badge">Problem 1‑2</span></h3>
  <div class="card">
    <div class="grid3">
      <label class="ctl"><span class="lab">J (kg·m²)</span><input type="number" id="f_J" value="2" step="any"></label>
      <label class="ctl"><span class="lab">τ (N·m)</span><input type="number" id="f_t" value="5" step="any"></label>
      <label class="ctl"><span class="lab">t (s)</span><input type="number" id="f_time" value="5" step="any"></label>
    </div>
    <div class="out" id="f_out"></div>
  </div>`;

  const rspd=()=>{const n=+$('#r_n').value,w=2*Math.PI*n/60;
    $('#r_spd').innerHTML=`ω<sub>m</sub> = 2πn/60 = <span class="k">${fmt(w)} rad/s</span>  ·  f = <span class="k">${fmt(n/60)} rev/s</span>`;};
  $('#r_n').oninput=rspd;rspd();

  const tcan=$('#tcan'),tx=tcan.getContext('2d');
  const tupd=()=>{
    const F=+$('#tF').value,r=+$('#tr').value,th=+$('#tth').value;
    $('#tF_v').textContent=F+' N';$('#tr_v').textContent=r+' m';$('#tth_v').textContent=th+'°';
    const tau=r*F*Math.sin(th*Math.PI/180),alpha=tau/5;
    $('#tout').innerHTML=`τ = rF sin θ = ${r}×${F}×sin ${th}° = <span class="k">${fmt(Math.abs(tau))} N·m</span> ${tau>=0?'CCW (+)':'CW (−)'}\nWith J = 5 kg·m²:  α = τ/J = <span class="k">${fmt(Math.abs(alpha))} rad/s²</span>`;
    tx.clearRect(0,0,380,300);const cx=170,cy=150,R=r*180;
    tx.strokeStyle='#2a2f4a';tx.fillStyle='#141830';tx.beginPath();tx.arc(cx,cy,60,0,7);tx.fill();tx.stroke();
    tx.fillStyle='#5b8cff';tx.beginPath();tx.arc(cx,cy,4,0,7);tx.fill();
    const ex=cx+R,ey=cy;tx.strokeStyle='#9aa3c4';tx.beginPath();tx.moveTo(cx,cy);tx.lineTo(ex,ey);tx.stroke();
    tx.fillStyle='#9aa3c4';tx.font='12px system-ui';tx.fillText('r',cx+R/2,cy-6);
    const a=th*Math.PI/180,L=60,fx=ex+L*Math.cos(a),fy=ey-L*Math.sin(a);
    tx.strokeStyle='#38d39f';tx.lineWidth=2.5;tx.beginPath();tx.moveTo(ex,ey);tx.lineTo(fx,fy);tx.stroke();
    const ah=8;tx.beginPath();tx.moveTo(fx,fy);tx.lineTo(fx-ah*Math.cos(a-0.4),fy+ah*Math.sin(a-0.4));
    tx.moveTo(fx,fy);tx.lineTo(fx-ah*Math.cos(a+0.4),fy+ah*Math.sin(a+0.4));tx.stroke();
    tx.lineWidth=1;tx.fillStyle='#38d39f';tx.fillText('F',fx+4,fy);
    tx.fillStyle='#ffcc66';tx.fillText('θ='+th+'°',ex-30,ey+18);
    // perpendicular-distance construction: τ = F × (r sin θ)
    const dx=Math.cos(a),dy=-Math.sin(a),tt=(cx-ex)*dx+(cy-ey)*dy,fxp=ex+tt*dx,fyp=ey+tt*dy;
    tx.setLineDash([4,4]);tx.strokeStyle='rgba(56,211,159,.45)';tx.lineWidth=1;tx.beginPath();tx.moveTo(ex-dx*140,ey-dy*140);tx.lineTo(ex+dx*140,ey+dy*140);tx.stroke();
    tx.strokeStyle='#ffcc66';tx.lineWidth=1.5;tx.beginPath();tx.moveTo(cx,cy);tx.lineTo(fxp,fyp);tx.stroke();tx.setLineDash([]);
    tx.fillStyle='#ffcc66';tx.fillText('r sin θ',(cx+fxp)/2+6,(cy+fyp)/2-6);
    tx.fillStyle='#9aa3c4';tx.font='11px system-ui';tx.fillText('dashed = line of action of F',10,290);
    if(Math.abs(tau)>0.01){const ccw=tau>0,r0=34;tx.strokeStyle='#ff6b81';tx.lineWidth=2;tx.beginPath();tx.arc(cx,cy,r0,ccw?-0.3:0.3,ccw?-2.0:2.0,ccw);tx.stroke();
      const ea=ccw?-2.0:2.0,exx=cx+r0*Math.cos(ea),eyy=cy+r0*Math.sin(ea),ta=ea+(ccw?-Math.PI/2:Math.PI/2);
      tx.fillStyle='#ff6b81';tx.beginPath();tx.moveTo(exx+7*Math.cos(ta),eyy+7*Math.sin(ta));tx.lineTo(exx+5*Math.cos(ta+2.4),eyy+5*Math.sin(ta+2.4));tx.lineTo(exx+5*Math.cos(ta-2.4),eyy+5*Math.sin(ta-2.4));tx.closePath();tx.fill();
      tx.font='12px system-ui';tx.fillText('τ',cx-r0-14,cy-r0+4);}
  };
  ['tF','tr','tth'].forEach(id=>$('#'+id).oninput=tupd);tupd();

  /* ---- spin-up animation ---- */
  const rcx=$('#rotCan').getContext('2d');const rst={w:0,th:0,t:0,run:false,hist:[]};let rLast=0;
  const spP=()=>({tau:+$('#sp_t').value,J:+$('#sp_J').value,tl:+$('#sp_L').value});
  function spLbl(){const p=spP();$('#sp_t_v').textContent=p.tau+' N·m';$('#sp_J_v').textContent=p.J+' kg·m²';$('#sp_L_v').textContent=p.tl+' N·m';}
  function spDraw(){const p=spP(),c=rcx,W=520,H=300;c.clearRect(0,0,W,H);
    const cx=130,cy=150,R=82,tnet=p.tau-(rst.w>0?p.tl:Math.min(p.tl,p.tau)),al=tnet/p.J,P=p.tau*rst.w,n=rst.w*60/(2*Math.PI);
    c.fillStyle='#141830';c.strokeStyle='#3a4680';c.lineWidth=3;c.beginPath();c.arc(cx,cy,R,0,7);c.fill();c.stroke();
    for(let k=0;k<6;k++){const a=rst.th+k*Math.PI/3;c.strokeStyle=k===0?'#ffcc66':'#2a2f4a';c.lineWidth=k===0?3:2;c.beginPath();c.moveTo(cx,cy);c.lineTo(cx+R*Math.cos(a),cy-R*Math.sin(a));c.stroke();}
    c.fillStyle='#5b8cff';c.beginPath();c.arc(cx,cy,6,0,7);c.fill();
    if(p.tau>0){const L=0.4+1.6*Math.min(1,p.tau/20),r0=R+16;c.strokeStyle='#38d39f';c.lineWidth=3;c.beginPath();c.arc(cx,cy,r0,-0.2,-0.2-L,true);c.stroke();
      const ea=-0.2-L,exx=cx+r0*Math.cos(ea),eyy=cy+r0*Math.sin(ea),ta=ea-Math.PI/2;c.fillStyle='#38d39f';c.beginPath();c.moveTo(exx+9*Math.cos(ta),eyy+9*Math.sin(ta));c.lineTo(exx+6*Math.cos(ta+2.4),eyy+6*Math.sin(ta+2.4));c.lineTo(exx+6*Math.cos(ta-2.4),eyy+6*Math.sin(ta-2.4));c.closePath();c.fill();
      c.font='12px system-ui';c.fillText('τ_app',cx+r0*Math.cos(-0.2)+4,cy+r0*Math.sin(-0.2)-4);}
    if(p.tl>0){const L=0.3+1.2*Math.min(1,p.tl/10),r0=R-14;c.strokeStyle='#ff6b81';c.lineWidth=2.5;c.beginPath();c.arc(cx,cy,r0,Math.PI-0.2,Math.PI-0.2+L,false);c.stroke();c.fillStyle='#ff6b81';c.font='11px system-ui';c.fillText('τ_load',cx-R-4,cy+R+16);}
    c.fillStyle='#ffcc66';c.font='12px system-ui';c.fillText(`ω = ${fmt(rst.w,2)} rad/s = ${fmt(n,0)} r/min`,cx-70,cy+R+34);c.fillStyle='#9aa3c4';c.font='11px system-ui';c.fillText(`θ = ${fmt(rst.th%(2*Math.PI)*180/Math.PI,0)}° (${fmt(rst.th/(2*Math.PI),1)} rev)`,cx-56,cy+R+48);
    // plots ω(t) and P(t)
    const x0=270,x1=510,yT=40,yB=250;c.strokeStyle='#232a49';c.lineWidth=1;c.beginPath();c.moveTo(x0,yT);c.lineTo(x0,yB);c.lineTo(x1,yB);c.stroke();
    c.fillStyle='#9aa3c4';c.font='11px system-ui';c.fillText('t (s) →',x1-36,yB+14);
    if(rst.hist.length>1){const t0=rst.hist[0].t,t1=rst.hist[rst.hist.length-1].t,span=Math.max(t1-t0,1),wm=Math.max(...rst.hist.map(h=>h.w),1),pm=Math.max(...rst.hist.map(h=>h.P),1);
      const X=t=>x0+(t-t0)/span*(x1-x0);
      c.strokeStyle='#ffcc66';c.lineWidth=2;c.beginPath();rst.hist.forEach((h,k)=>{const x=X(h.t),y=yB-h.w/wm*(yB-yT-10);k?c.lineTo(x,y):c.moveTo(x,y);});c.stroke();
      c.strokeStyle='#38d39f';c.beginPath();rst.hist.forEach((h,k)=>{const x=X(h.t),y=yB-h.P/pm*(yB-yT-10);k?c.lineTo(x,y):c.moveTo(x,y);});c.stroke();
      c.fillStyle='#ffcc66';c.fillText(`ω(t)  max ${fmt(wm,1)} rad/s`,x0+6,yT-10);c.fillStyle='#38d39f';c.fillText(`P = τω  max ${fmt(pm,0)} W`,x0+150,yT-10);}
    else{c.fillStyle='#9aa3c4';c.fillText('ω(t) amber · P(t) green — press Start',x0+6,yT-10);}
    $('#sp_out').innerHTML=`α = (τ<sub>app</sub> − τ<sub>load</sub>)/J = <span class="k">${fmt(al,3)} rad/s²</span>\nω = <span class="k">${fmt(rst.w,2)} rad/s</span> = <span class="k">${fmt(n,1)} r/min</span>\nP = τ<sub>app</sub>·ω = <span class="k">${fmt(P,1)} W</span>${p.tl>0?`\nP<sub>load</sub> = τ<sub>load</sub>·ω = <span class="k">${fmt(p.tl*rst.w,1)} W</span>`:''}\nKE = ½Jω² = <span class="k">${fmt(0.5*p.J*rst.w*rst.w,1)} J</span>`;
  }
  function spLoop(ts){if(!rst.run)return;if(!$('#sec-rot').classList.contains('on')){rst.run=false;$('#sp_run').textContent='▶ Start';return;}
    const dt=Math.min((ts-rLast)/1000||0.016,0.05);rLast=ts;const p=spP();
    let tnet=p.tau-(rst.w>0.01?p.tl:Math.min(p.tl,p.tau));rst.w=Math.max(0,rst.w+tnet/p.J*dt);rst.th+=rst.w*dt;rst.t+=dt;
    rst.hist.push({t:rst.t,w:rst.w,P:p.tau*rst.w});if(rst.hist.length>900)rst.hist.shift();
    spDraw();requestAnimationFrame(spLoop);}
  $('#sp_run').onclick=()=>{rst.run=!rst.run;$('#sp_run').textContent=rst.run?'⏸ Pause':'▶ Start';if(rst.run){rLast=performance.now();requestAnimationFrame(spLoop);}};
  $('#sp_reset').onclick=()=>{rst.run=false;$('#sp_run').textContent='▶ Start';rst.w=0;rst.th=0;rst.t=0;rst.hist=[];spDraw();};
  ['sp_t','sp_J','sp_L'].forEach(id=>$('#'+id).oninput=()=>{spLbl();spDraw();});spLbl();spDraw();

  const pupd=()=>{const t=+$('#p_t').value,n=+$('#p_n').value,w=2*Math.PI*n/60,P=t*w;
    $('#p_out').innerHTML=`ω = 2πn/60 = <span class="k">${fmt(w)} rad/s</span>\nP = τω = <span class="k">${fmt(P)} W</span> = <span class="k">${fmt(P/746)} hp</span>`;};
  $('#p_t').oninput=pupd;$('#p_n').oninput=pupd;pupd();

  const fupd=()=>{const J=+$('#f_J').value,t=+$('#f_t').value,tm=+$('#f_time').value,al=t/J,w=al*tm,n=w*60/(2*Math.PI);
    $('#f_out').innerHTML=`α = τ/J = <span class="k">${fmt(al)} rad/s²</span>\nω = αt = <span class="k">${fmt(w)} rad/s</span> = <span class="k">${fmt(n)} r/min</span>`;};
  ['f_J','f_t','f_time'].forEach(id=>$('#'+id).oninput=fupd);fupd();
});

/* ============================================================ 1.5 Faraday */
section('faraday','Induced Voltage','1.5 · Faraday\'s Law',(el)=>{
  el.innerHTML=`
  <h2 class="title">Faraday's Law — Induced Voltage</h2>
  <p class="subttl">§1.5 · A time-changing flux through a coil induces a voltage (basis of the transformer)</p>
  <div class="grid2">
    <div class="eq" style="text-align:center">e<sub>ind</sub> = −N <span class="frac"><span class="n">dφ</span><span class="d">dt</span></span> <span class="tag">(1‑36)</span></div>
    <div class="eq" style="text-align:center">e<sub>ind</sub> = <span class="frac"><span class="n">dλ</span><span class="d">dt</span></span>, λ=Nφ <span class="tag">(1‑41)</span></div>
  </div>
  <details class="deriv"><summary>Derive Faraday's law from flux linkage</summary>
    <div class="step">① One turn linking flux φ: e = dφ/dt.<span class="why">A changing flux through a single loop drives a voltage — Eq.(1‑35).</span></div>
    <div class="step">② If all N turns link the same φ, voltages add: e = φ̇ + φ̇ + … (N times).<span class="why">Series turns → voltages sum.</span></div>
    <div class="step">③ Define flux linkage λ = Nφ (weber-turns).<span class="why">Eq.(1‑42).</span></div>
    <div class="step">④ Then e = dλ/dt = N dφ/dt.<span class="why">Eq.(1‑41)/(1‑36).</span></div>
    <div class="step">⑤ Sign (Lenz): the induced voltage opposes the flux change → the leading minus sign.<span class="why">Once polarity is known physically, the sign is dropped.</span></div>
  </details>
  <p class="note">Faraday's law also explains <b>eddy-current losses</b>: the changing flux induces swirling currents inside the iron itself → cores are laminated.</p>

  <style>@media(max-width:900px){.fvgrid{grid-template-columns:1fr!important}}</style>
  <h3>Self-inductance — voltage → flux → back-emf in a single coil</h3>
  <div class="card">
    <p>Put an AC voltage on one coil wound on an iron core — an <b>inductor</b> — and a loop of cause and effect starts:</p>
    <div class="grid2">
      <div class="okbox"><b>① v(t) forces φ(t).</b> The coil has almost no resistance, so KVL says v = N·dφ/dt. The flux has no choice: <b>φ = (1/N)∫v dt</b>. For v = V<sub>m</sub> sin ωt this gives φ = −(V<sub>m</sub>/ωN) cos ωt — peak <b>φ<sub>m</sub> = V<sub>m</sub>/(ωN)</b>, <b>lagging v by 90°</b>. The <em>voltage</em> sets the flux.</div>
      <div class="okbox"><b>② φ needs a current — and that defines L.</b> Ampère (§1.4): ℱ = Ni = ℛφ, so <b>i = ℛφ/N</b>, in phase with φ. The flux linkage is λ = Nφ = (N²/ℛ)·i ≡ <b>L·i</b>: the <b>self-inductance L = N²/ℛ = μN²A/ℓ<sub>c</sub></b> depends only on the turns and the core.</div>
      <div class="okbox"><b>③ φ(t) induces a voltage back in the same coil.</b> Faraday: <b>e<sub>ind</sub> = −N dφ/dt = −L di/dt = −v</b> — equal to the applied voltage and <b>180° out of phase</b>: the <em>back-emf</em> (Lenz) that balances the source. This is why a coil "opposes any change in its current".</div>
      <div class="okbox"><b>④ Seen from the terminals it is an inductor.</b> i lags v by 90° and v = L di/dt, so the peaks obey <b>V<sub>m</sub> = ωL·I<sub>m</sub></b> → reactance <b>X<sub>L</sub> = ωL = 2πfL</b>; the field stores W = ½Li². Same physics as the Introduction's L panel, now built from the core.</div>
    </div>
    <div class="fvgrid" style="display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start;margin-top:12px">
      <div>
        <label class="ctl"><span class="lab">Peak voltage V<sub>m</sub> <span class="val" id="fv_V_v"></span></span><input type="range" id="fv_V" min="10" max="400" step="5" value="100"></label>
        <label class="ctl"><span class="lab">Frequency f <span class="val" id="fv_f_v"></span></span><input type="range" id="fv_f" min="25" max="100" step="5" value="50"></label>
        <label class="ctl"><span class="lab">Turns N <span class="val" id="fv_N_v"></span></span><input type="range" id="fv_N" min="50" max="500" step="10" value="200"></label>
        <label class="ctl"><span class="lab">Mean path ℓ<sub>c</sub> <span class="val" id="fv_l_v"></span></span><input type="range" id="fv_l" min="10" max="100" step="1" value="40"></label>
        <label class="ctl"><span class="lab">Core area A <span class="val" id="fv_A_v"></span></span><input type="range" id="fv_A" min="2" max="50" step="1" value="10"></label>
        <label class="ctl"><span class="lab"><span>Core μ<sub>r</sub></span></span><select id="fv_mu"><option value="1">Air (1)</option><option value="200">Cast iron (≈200)</option><option value="2000" selected>Si-steel (≈2000)</option><option value="5000">Best steel (≈5000)</option></select></label>
        <button class="btn" id="fv_run" style="width:100%">⏸ Pause</button>
        <div class="out" id="fv_out" style="font-size:12.5px"></div>
      </div>
      <div>
        <canvas id="fv_core" width="540" height="300" style="width:100%"></canvas>
        <canvas id="fv_ph" width="540" height="250" style="width:100%;margin-top:8px"></canvas>
      </div>
    </div>
    <div class="warnbox" style="margin-top:12px"><b>Two ways to write the same thing.</b> With Lenz's sign, e<sub>ind</sub> = −L di/dt is drawn <b>opposite</b> to V (180°) — the voltage the coil generates <em>against</em> the source. Drop the sign and v<sub>L</sub> = L di/dt sits <b>on top of</b> V — the "voltage across the inductor" of circuit theory. Either way, φ and i are 90° behind V.</div>
    <div class="grid3">
      <div class="eq" style="text-align:center">L = <span class="frac"><span class="n">λ</span><span class="d">i</span></span> = <span class="frac"><span class="n">N²</span><span class="d">ℛ</span></span> = <span class="frac"><span class="n">μN²A</span><span class="d">ℓ<sub>c</sub></span></span></div>
      <div class="eq" style="text-align:center">e<sub>ind</sub> = −N <span class="frac"><span class="n">dφ</span><span class="d">dt</span></span> = −L <span class="frac"><span class="n">di</span><span class="d">dt</span></span></div>
      <div class="eq" style="text-align:center">X<sub>L</sub> = ωL,   W = ½ L i²</div>
    </div>
  </div>

  <h3>Example 1‑6 — sinusoidal flux</h3>
  <details class="deriv"><summary>Derivation: φ = φ<sub>m</sub> sin ωt → e</summary>
    <div class="step">e = N dφ/dt = N·d(φ<sub>m</sub> sin ωt)/dt = <b>Nφ<sub>m</sub>ω cos ωt</b>.<span class="why">Peak voltage = Nφ<sub>m</sub>ω; voltage leads flux by 90°.</span></div>
  </details>
  <div class="card">
    <div class="grid2">
      <div>
        <label class="ctl"><span class="lab">φ<sub>m</sub> (Wb) <span class="val" id="fd_p_v"></span></span><input type="range" id="fd_p" min="0.01" max="0.2" value="0.05" step="0.005"></label>
        <label class="ctl"><span class="lab">N turns <span class="val" id="fd_N_v"></span></span><input type="range" id="fd_N" min="10" max="500" value="100" step="10"></label>
        <label class="ctl"><span class="lab">ω (rad/s) <span class="val" id="fd_w_v"></span></span><input type="range" id="fd_w" min="100" max="628" value="377" step="1"></label>
        <div class="out" id="fd_out"></div>
        <p class="note">Book case: φ=0.05 sin 377t, N=100 → e = 1885 cos 377t V.</p>
      </div>
      <div><canvas id="fdCan" width="380" height="300"></canvas></div>
    </div>
  </div>

  <h3>Problem 1‑16 — triangular flux → square-wave voltage</h3>
  <div class="card">
    <div class="grid2">
      <div>
        <label class="ctl"><span class="lab">Peak flux (Wb) <span class="val" id="tr_p_v"></span></span><input type="range" id="tr_p" min="0.005" max="0.05" value="0.01" step="0.005"></label>
        <label class="ctl"><span class="lab">Period (s) <span class="val" id="tr_T_v"></span></span><input type="range" id="tr_T" min="0.01" max="0.1" value="0.04" step="0.005"></label>
        <label class="ctl"><span class="lab">N turns <span class="val" id="tr_N_v"></span></span><input type="range" id="tr_N" min="10" max="500" value="100" step="10"></label>
        <div class="out" id="tr_out"></div>
      </div>
      <div><canvas id="trCan" width="380" height="300"></canvas></div>
    </div>
  </div>`;
  const fdCan=$('#fdCan'),fx=fdCan.getContext('2d');
  function drawWave(ctx,f1,f2,T,l1,l2,a1,a2){
    const W=380,H=300,pl=30,pr=12,pt=14,mid=H/2;ctx.clearRect(0,0,W,H);
    ctx.strokeStyle='#232a49';ctx.beginPath();ctx.moveTo(pl,mid);ctx.lineTo(W-pr,mid);ctx.stroke();
    const xX=t=>pl+t/T*(W-pl-pr),y1=v=>mid-v/a1*(mid-pt)*0.9,y2=v=>mid-v/a2*(mid-pt)*0.9;
    ctx.strokeStyle='#5b8cff';ctx.lineWidth=2;ctx.beginPath();
    for(let t=0;t<=T;t+=T/300){const x=xX(t),y=y1(f1(t));t===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}ctx.stroke();
    ctx.strokeStyle='#38d39f';ctx.beginPath();
    for(let t=0;t<=T;t+=T/300){const x=xX(t),y=y2(f2(t));t===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}ctx.stroke();
    ctx.fillStyle='#5b8cff';ctx.font='12px system-ui';ctx.fillText(l1+' (flux)',pl+4,pt+6);
    ctx.fillStyle='#38d39f';ctx.fillText(l2+' (voltage)',pl+90,pt+6);
  }
  const fdUpd=()=>{const p=+$('#fd_p').value,N=+$('#fd_N').value,w=+$('#fd_w').value,Epk=N*p*w;
    $('#fd_p_v').textContent=p+' Wb';$('#fd_N_v').textContent=N;$('#fd_w_v').textContent=w;
    $('#fd_out').innerHTML=`e = Nφ<sub>m</sub>ω cos ωt\nPeak = <span class="k">${fmt(Epk)} V</span>  (f = <span class="k">${fmt(w/2/Math.PI)} Hz</span>)`;
    drawWave(fx,t=>p*Math.sin(w*t),t=>N*p*w*Math.cos(w*t),4*Math.PI/w,'φ','e',p,Epk);};
  ['fd_p','fd_N','fd_w'].forEach(id=>$('#'+id).oninput=fdUpd);fdUpd();
  const trCan=$('#trCan'),trx=trCan.getContext('2d');
  const trUpd=()=>{const p=+$('#tr_p').value,T=+$('#tr_T').value,N=+$('#tr_N').value,slope=p/(T/2),e=N*slope;
    $('#tr_p_v').textContent=p+' Wb';$('#tr_T_v').textContent=T+' s';$('#tr_N_v').textContent=N;
    $('#tr_out').innerHTML=`|dφ/dt| = peak/(T/2) = <span class="k">${fmt(slope)} Wb/s</span>\n|e| = N·|dφ/dt| = <span class="k">${fmt(e)} V</span> (square wave)`;
    const tri=t=>{const x=(t%T)/T;return x<0.5?(p*(x/0.5)):(p*(1-(x-0.5)/0.5));},sq=t=>((t%T)/T<0.5?e:-e);
    drawWave(trx,tri,sq,2*T,'φ','e',p,e);};
  ['tr_p','tr_T','tr_N'].forEach(id=>$('#'+id).oninput=trUpd);trUpd();

  /* ---- self-inductance: voltage → flux → back-emf (animated core + phasors) ---- */
  const fcv=$('#fv_core').getContext('2d'),fpv=$('#fv_ph').getContext('2d');let fth=0,frun=true;
  const ahead2=(c,x,y,ang,col,s=7)=>{c.fillStyle=col;c.beginPath();c.moveTo(x+s*Math.cos(ang),y+s*Math.sin(ang));c.lineTo(x+s*Math.cos(ang+2.5),y+s*Math.sin(ang+2.5));c.lineTo(x+s*Math.cos(ang-2.5),y+s*Math.sin(ang-2.5));c.closePath();c.fill();};
  const fvP=()=>{const V=+$('#fv_V').value,f=+$('#fv_f').value,N=+$('#fv_N').value,l=+$('#fv_l').value/100,A=+$('#fv_A').value*1e-4,mur=+$('#fv_mu').value;
    const w=2*Math.PI*f,R=l/(mur*MU0*A),L=N*N/R,pm=V/(w*N),Im=V/(w*L),Bm=pm/A;return {V,f,N,l,A,mur,w,R,L,pm,Im,Bm};};
  function fvUpd(){const p=fvP();
    $('#fv_V_v').textContent=p.V+' V';$('#fv_f_v').textContent=p.f+' Hz';$('#fv_N_v').textContent=p.N;$('#fv_l_v').textContent=Math.round(p.l*100)+' cm';$('#fv_A_v').textContent=Math.round(p.A*1e4)+' cm²';
    $('#fv_out').innerHTML=`ℛ = ℓ<sub>c</sub>/(μ<sub>r</sub>μ<sub>0</sub>A) = <span class="k">${fmt(p.R,3)} A·t/Wb</span>\nL = N²/ℛ = <span class="k">${fmt(p.L*1e3,2)} mH</span>\nφ<sub>m</sub> = V<sub>m</sub>/(ωN) = <span class="k">${fmt(p.pm,4)} Wb</span>  ← lags v by 90°\n${p.Bm>1.8?'⚠ B<sub>m</sub> = '+fmt(p.Bm,2)+' T — real steel would saturate':'B<sub>m</sub> = φ<sub>m</sub>/A = '+fmt(p.Bm,3)+' T'}\nI<sub>m</sub> = ℛφ<sub>m</sub>/N = V<sub>m</sub>/(ωL) = <span class="k">${fmt(p.Im,3)} A</span>  ← in phase with φ\nX<sub>L</sub> = ωL = <span class="k">${fmt(p.w*p.L,2)} Ω</span>   λ<sub>m</sub> = Nφ<sub>m</sub> = L·I<sub>m</sub> = ${fmt(p.N*p.pm,4)} Wb·t ✓\ne<sub>ind</sub> = −N dφ/dt = −L di/dt = <span class="k">−v</span>  ← 180° from v`;}
  function drawCore(){
    const p=fvP(),th=fth,v=Math.sin(th),ph=-Math.cos(th),e=-Math.sin(th),c=fcv,W=540,H=300;c.clearRect(0,0,W,H);
    c.fillStyle='#232a49';c.strokeStyle='#3a4680';c.lineWidth=1.5;c.beginPath();c.rect(170,40,260,220);c.rect(204,74,192,152);c.fill('evenodd');c.stroke();
    c.setLineDash([3,4]);c.strokeStyle='rgba(255,204,102,.35)';c.strokeRect(187,57,226,186);c.setLineDash([]);
    const mag=Math.abs(ph),dirF=ph>=0?1:-1,per=[[187,57,226,0],[413,57,0,186],[413,243,-226,0],[187,243,0,-186]],lens=[226,186,226,186],P=824;
    for(let k=0;k<16;k++){let s=k*P/16+8,seg=0;while(s>lens[seg]){s-=lens[seg];seg++;}const [x0,y0,dx,dy]=per[seg],x=x0+dx*s/lens[seg],y=y0+dy*s/lens[seg];
      ahead2(c,x,y,Math.atan2(dy,dx)+(dirF>0?0:Math.PI),`rgba(255,204,102,${(0.12+0.88*mag).toFixed(2)})`,7);}
    c.fillStyle='#ffcc66';c.font='12px system-ui';c.fillText('φ(t): brightness = |φ|, arrows = direction',236,30);
    c.strokeStyle='#5b8cff';c.lineWidth=2;for(let k=0;k<7;k++){c.beginPath();c.ellipse(187,112+k*13,26,5,0,0,7);c.stroke();}
    c.lineWidth=1.5;c.beginPath();c.moveTo(80,132);c.lineTo(80,108);c.lineTo(161,108);c.moveTo(80,168);c.lineTo(80,192);c.lineTo(161,192);c.stroke();
    c.fillStyle='#12162a';c.lineWidth=2;c.beginPath();c.arc(80,150,18,0,7);c.fill();c.stroke();
    c.beginPath();for(let k=0;k<=20;k++){const x=68+k*1.2,y=150-6*Math.sin(k/20*2*Math.PI);k?c.lineTo(x,y):c.moveTo(x,y);}c.stroke();
    c.fillStyle='#5b8cff';c.font='12px system-ui';c.fillText('v(t)',40,154);
    c.font='bold 14px system-ui';c.fillText(v>=0?'+':'−',92,126);c.fillText(v>=0?'−':'+',92,184);
    const im=ph,len=30*Math.abs(im);if(Math.abs(im)>0.03){const d=im>=0?1:-1;c.strokeStyle='#38d39f';c.lineWidth=2.5;c.beginPath();c.moveTo(122-d*len/2,108);c.lineTo(122+d*len/2,108);c.stroke();ahead2(c,122+d*len/2,108,d>0?0:Math.PI,'#38d39f',7);}
    c.fillStyle='#38d39f';c.font='12px system-ui';c.fillText('i(t) ∝ φ',108,98);
    c.fillStyle='#ff6b81';c.font='bold 14px system-ui';c.fillText(v>=0?'+':'−',222,112);c.fillText(v>=0?'−':'+',222,200);
    c.font='12px system-ui';c.fillText('v_L = L di/dt',216,226);c.fillText('e_ind = −v_L',216,241);
    c.fillStyle='#ffcc66';c.fillText(`λ = Nφ = L·i = ${fmt(p.N*p.pm*ph,4)} Wb·t`,300,150);
    c.fillStyle='#38d39f';c.fillText(`≡ inductor  L = ${fmt(p.L*1e3,2)} mH,  X_L = ${fmt(p.w*p.L,2)} Ω`,300,170);
    c.fillStyle='rgba(23,26,43,.9)';c.fillRect(8,8,215,80);c.strokeStyle='#2a2f4a';c.lineWidth=1;c.strokeRect(8,8,215,80);
    c.font='12px system-ui';c.fillStyle='#5b8cff';c.fillText(`v = ${fmt(p.V*v,1)} V`,16,26);c.fillStyle='#38d39f';c.fillText(`i = ${fmt(p.Im*ph,3)} A`,16,44);c.fillStyle='#ffcc66';c.fillText(`φ = ${fmt(p.pm*ph,4)} Wb`,16,62);c.fillStyle='#ff6b81';c.fillText(`e_ind = −L di/dt = ${fmt(p.V*e,1)} V`,16,80);
    c.fillStyle='#5b8cff';c.fillText('N turns on one core — a self-inductance',150,278);
    c.fillStyle='#ff6b81';c.fillText('e_ind = −v : the coil pushes back on the source (back-emf)',150,294);
  }
  function drawPh(){const c=fpv,W=540,H=250,th=fth,cx=110,cy=122,R=80;c.clearRect(0,0,W,H);
    c.strokeStyle='#232a49';c.lineWidth=1;c.beginPath();c.arc(cx,cy,R,0,7);c.stroke();c.beginPath();c.moveTo(cx-R-8,cy);c.lineTo(cx+R+8,cy);c.moveTo(cx,cy-R-8);c.lineTo(cx,cy+R+8);c.stroke();
    const phz=(len,ang,col,lab,dash)=>{const x=cx+len*Math.cos(ang),y=cy-len*Math.sin(ang);if(dash)c.setLineDash([4,4]);c.strokeStyle=col;c.lineWidth=dash?1.5:2.5;c.beginPath();c.moveTo(cx,cy);c.lineTo(x,y);c.stroke();c.setLineDash([]);
      if(!dash){ahead2(c,x,y,-ang,col,8);c.fillStyle=col;c.font='12px system-ui';c.fillText(lab,x+10*Math.cos(ang)-8,y-10*Math.sin(ang)+4);}};
    phz(R,th,'#5b8cff','V');phz(R*.75,th-Math.PI/2,'#ffcc66','Φ');phz(R*.5,th-Math.PI/2,'#38d39f','I');phz(R,th+Math.PI,'#ff6b81','E_ind');phz(R,th,'#ff6b81','',true);
    c.fillStyle='#9aa3c4';c.font='11px system-ui';c.fillText('phasors rotate at ω',12,14);c.fillText('dashed red = |E_ind| = V_L (sign dropped)',12,H-8);
    const x0=225,x1=530,mid=118,A=68,span=4*Math.PI;c.strokeStyle='#232a49';c.beginPath();c.moveTo(x0,mid);c.lineTo(x1,mid);c.stroke();
    const fns=[[t=>Math.sin(t),'#5b8cff',1],[t=>-Math.cos(t),'#38d39f',.6],[t=>-Math.sin(t),'#ff6b81',1]];
    fns.forEach(([fn,col,sc])=>{c.strokeStyle=col;c.lineWidth=2;c.beginPath();for(let k=0;k<=300;k++){const t=k/300*span,x=x0+(x1-x0)*k/300,y=mid-fn(t)*A*sc;k?c.lineTo(x,y):c.moveTo(x,y);}c.stroke();});
    const tc=((th%span)+span)%span,xc=x0+(x1-x0)*tc/span;c.strokeStyle='rgba(255,255,255,.35)';c.setLineDash([3,3]);c.beginPath();c.moveTo(xc,mid-A-10);c.lineTo(xc,mid+A+10);c.stroke();c.setLineDash([]);
    fns.forEach(([fn,col,sc])=>{c.fillStyle=col;c.beginPath();c.arc(xc,mid-fn(tc)*A*sc,4,0,7);c.fill();});
    c.font='12px system-ui';c.fillStyle='#5b8cff';c.fillText('v(t)',x0,26);c.fillStyle='#38d39f';c.fillText('i(t), φ(t) — lag 90°',x0+45,26);c.fillStyle='#ff6b81';c.fillText('e_ind = −L di/dt — 180°',x0+190,26);
    c.fillStyle='#9aa3c4';c.font='11px system-ui';c.fillText('0',x0-4,mid+A+22);c.fillText('T',x0+(x1-x0)/2-3,mid+A+22);c.fillText('2T',x1-10,mid+A+22);
  }
  function fLoop(){if($('#sec-faraday').classList.contains('on')){drawCore();drawPh();if(frun)fth+=0.025;}requestAnimationFrame(fLoop);}
  ['fv_V','fv_f','fv_N','fv_l','fv_A'].forEach(id=>$('#'+id).oninput=fvUpd);$('#fv_mu').onchange=fvUpd;
  $('#fv_run').onclick=()=>{frun=!frun;$('#fv_run').textContent=frun?'⏸ Pause':'▶ Play';};
  fvUpd();drawCore();drawPh();fLoop();
});

/* ============================================================ 1.6 force */
section('force','Induced Force','1.6 · Force on a Wire',(el)=>{
  el.innerHTML=`
  <h2 class="title">Induced Force on a Current-Carrying Wire</h2>
  <p class="subttl">§1.6 · Basis of motor action</p>
  <div class="grid2">
    <div class="eq" style="text-align:center"><span class="vec">F</span> = i(<span class="vec">l</span> × <span class="vec">B</span>) <span class="tag">(1‑43)</span></div>
    <div class="eq" style="text-align:center">F = i l B sin θ <span class="tag">(1‑44)</span></div>
  </div>
  <details class="deriv"><summary>From the vector law to F = ilB sin θ</summary>
    <div class="step">① Each charge in the wire feels <b>F</b>=q<b>v</b>×<b>B</b>; summing over all charges in length l carrying current i gives <b>F</b> = i(<b>l</b>×<b>B</b>).<span class="why">Eq.(1‑43); l points along current flow.</span></div>
    <div class="step">② The magnitude of a cross product is |l||B|sin θ.<span class="why">θ = angle between wire and field.</span></div>
    <div class="step">③ So <b>F = ilB sin θ</b>; maximum when the wire is ⟂ to B (θ=90°), zero when parallel.<span class="why">Eq.(1‑44). Direction by the right-hand rule.</span></div>
  </details>
  <div class="card">
    <div class="grid2">
      <div>
        <label class="ctl"><span class="lab">Current i (A) <span class="val" id="F_i_v"></span></span><input type="range" id="F_i" min="0" max="10" value="0.5" step="0.1"></label>
        <label class="ctl"><span class="lab">Length l (m) <span class="val" id="F_l_v"></span></span><input type="range" id="F_l" min="0.1" max="3" value="1" step="0.1"></label>
        <label class="ctl"><span class="lab">Flux density B (T) <span class="val" id="F_B_v"></span></span><input type="range" id="F_B" min="0" max="1" value="0.25" step="0.01"></label>
        <label class="ctl"><span class="lab">Angle θ (°) <span class="val" id="F_th_v"></span></span><input type="range" id="F_th" min="0" max="180" value="90" step="1"></label>
        <div class="flex" style="margin:4px 0"><button class="btn ghost" id="F_flipI">⇄ reverse i</button><button class="btn ghost" id="F_flipB">⇅ reverse B</button></div>
        <div class="out" id="F_out"></div>
        <p class="note">Defaults = <b>Example 1‑7</b> (→ 0.125 N). Set i=5 A for <b>Problem 1‑9</b>. B lies in the page (blue arrows); the wire is tilted θ from B; the force comes <b>out of</b> (⊙) or <b>into</b> (⊗) the page.</p>
      </div>
      <div><canvas id="FCan" width="380" height="280"></canvas></div>
    </div>
  </div>`;
  const FCan=$('#FCan'),Fx=FCan.getContext('2d');let fI=1,fB=1;
  const fArr=(c,x0,y0,x1,y1,col,w=2)=>{c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(x0,y0);c.lineTo(x1,y1);c.stroke();const a=Math.atan2(y1-y0,x1-x0);c.fillStyle=col;c.beginPath();c.moveTo(x1,y1);c.lineTo(x1-8*Math.cos(a-0.45),y1-8*Math.sin(a-0.45));c.lineTo(x1-8*Math.cos(a+0.45),y1-8*Math.sin(a+0.45));c.closePath();c.fill();};
  const upd=()=>{const i=+$('#F_i').value,l=+$('#F_l').value,B=+$('#F_B').value,th=+$('#F_th').value,Fm=i*l*B*Math.sin(th*Math.PI/180),F=Fm*fI*fB;
    $('#F_i_v').textContent=i+' A';$('#F_l_v').textContent=l+' m';$('#F_B_v').textContent=B+' T';$('#F_th_v').textContent=th+'°';
    $('#F_out').innerHTML=`F = ilB sin θ = ${i}·${l}·${B}·sin ${th}°\n|F| = <span class="k">${fmt(Math.abs(Fm),4)} N</span>   direction: <span class="k">${Math.abs(F)<1e-9?'— (no force)':F>0?'out of page ⊙':'into page ⊗'}</span>\n(i ${fI>0?'→ as drawn':'reversed'}, B ${fB>0?'up':'down'})`;
    const c=Fx,W=380,H=280,cx=175,cy=140;c.clearRect(0,0,W,H);
    // B field lines in the page (vertical)
    const bal=0.15+0.75*Math.min(1,B);for(let k=0;k<8;k++){const x=30+k*42;if(fB>0)fArr(c,x,262,x,30,`rgba(91,140,255,${bal.toFixed(2)})`,1.5);else fArr(c,x,30,x,262,`rgba(91,140,255,${bal.toFixed(2)})`,1.5);}
    c.fillStyle='#5b8cff';c.font='12px system-ui';c.fillText(`B = ${B} T (${fB>0?'up':'down'}, in the page)`,8,16);
    // wire at angle θ from B
    const ph=(90-th)*Math.PI/180,dx=Math.cos(ph),dy=-Math.sin(ph),hl=110;
    c.strokeStyle='#38d39f';c.lineWidth=4;c.beginPath();c.moveTo(cx-hl*dx,cy-hl*dy);c.lineTo(cx+hl*dx,cy+hl*dy);c.stroke();
    const tip=fI>0?1:-1;fArr(c,cx+tip*(hl-40)*dx,cy+tip*(hl-40)*dy,cx+tip*(hl-4)*dx,cy+tip*(hl-4)*dy,'#38d39f',4);
    c.fillStyle='#38d39f';c.fillText('i',cx+tip*(hl-18)*dx+10*dy*tip,cy+tip*(hl-18)*dy-10*dx*tip);
    // θ arc between B (up) and the wire
    c.strokeStyle='#ffcc66';c.lineWidth=1.5;c.beginPath();c.arc(cx,cy,44,-Math.PI/2,-Math.PI/2+th*Math.PI/180,false);c.stroke();
    c.fillStyle='#ffcc66';c.fillText('θ='+th+'°',cx+8+40*Math.sin(th*Math.PI/360),cy-40*Math.cos(th*Math.PI/360)+4);
    // force marker (out of / into page)
    const r=6+22*Math.min(1,Math.abs(F)/5);
    if(Math.abs(F)<1e-9){c.strokeStyle='#9aa3c4';c.lineWidth=1.5;c.setLineDash([3,3]);c.beginPath();c.arc(cx,cy,10,0,7);c.stroke();c.setLineDash([]);c.fillStyle='#9aa3c4';c.fillText('F = 0 (wire ∥ B)',cx+16,cy+4);}
    else{c.fillStyle='rgba(255,107,129,.18)';c.beginPath();c.arc(cx,cy,r,0,7);c.fill();c.strokeStyle='#ff6b81';c.lineWidth=2.5;c.beginPath();c.arc(cx,cy,r,0,7);c.stroke();
      if(F>0){c.fillStyle='#ff6b81';c.beginPath();c.arc(cx,cy,Math.max(3,r*0.25),0,7);c.fill();}
      else{c.beginPath();c.moveTo(cx-r*0.6,cy-r*0.6);c.lineTo(cx+r*0.6,cy+r*0.6);c.moveTo(cx-r*0.6,cy+r*0.6);c.lineTo(cx+r*0.6,cy-r*0.6);c.stroke();}
      c.fillStyle='#ff6b81';c.font='bold 12px system-ui';c.fillText(`F = ${fmt(Math.abs(F),3)} N ${F>0?'⊙ out':'⊗ in'}`,cx+r+8,cy+4);c.font='12px system-ui';}
    // right-hand-rule inset
    const ix=300,iy=228;c.fillStyle='rgba(23,26,43,.9)';c.fillRect(ix-46,iy-46,90,64);c.strokeStyle='#2a2f4a';c.lineWidth=1;c.strokeRect(ix-46,iy-46,90,64);
    fArr(c,ix-30,iy,ix+6,iy,'#38d39f',2);c.fillStyle='#38d39f';c.font='10px system-ui';c.fillText('i',ix+9,iy+4);
    fArr(c,ix-30,iy,ix-30,iy-34,'#5b8cff',2);c.fillStyle='#5b8cff';c.fillText('B',ix-28,iy-36);
    c.strokeStyle='#ff6b81';c.beginPath();c.arc(ix-30,iy,7,0,7);c.stroke();c.fillStyle='#ff6b81';c.beginPath();c.arc(ix-30,iy,2.2,0,7);c.fill();c.fillText('F ⊙',ix-24,iy+14);
    c.fillStyle='#9aa3c4';c.fillText('F = i l × B',ix-44,iy-52+16);};
  ['F_i','F_l','F_B','F_th'].forEach(id=>$('#'+id).oninput=upd);
  $('#F_flipI').onclick=()=>{fI=-fI;upd();};$('#F_flipB').onclick=()=>{fB=-fB;upd();};upd();
});

/* ============================================================ 1.7 moving conductor */
section('movevolt','Induced Voltage','1.7 · Moving Conductor',(el)=>{
  el.innerHTML=`
  <h2 class="title">Induced Voltage on a Moving Conductor</h2>
  <p class="subttl">§1.7 · Basis of generator action</p>
  <div class="grid2">
    <div class="eq" style="text-align:center">e<sub>ind</sub> = (<span class="vec">v</span> × <span class="vec">B</span>)·<span class="vec">l</span> <span class="tag">(1‑45)</span></div>
    <div class="eq" style="text-align:center">e<sub>ind</sub> = v B l cos α</div>
  </div>
  <details class="deriv"><summary>Derive e = vBl cos α</summary>
    <div class="step">① A charge in the moving wire feels force q<b>v</b>×<b>B</b>, i.e. an effective field <b>v</b>×<b>B</b>.<span class="why">Motional EMF.</span></div>
    <div class="step">② Voltage = (that field)·(wire vector l) = (<b>v</b>×<b>B</b>)·<b>l</b>.<span class="why">Dot product picks the component of v×B along the wire — Eq.(1‑45).</span></div>
    <div class="step">③ If v⟂B, |v×B|=vB; the dot product with l adds cos α (α = angle of l to v×B): <b>e = vBl cos α</b>.<span class="why">Max when l ∥ v×B (α=0).</span></div>
  </details>
  <div class="card">
    <div class="grid2">
      <div>
        <label class="ctl"><span class="lab">Velocity v (m/s) <span class="val" id="M_v_v"></span></span><input type="range" id="M_v" min="0" max="20" value="5" step="0.5"></label>
        <label class="ctl"><span class="lab">Flux density B (T) <span class="val" id="M_B_v"></span></span><input type="range" id="M_B" min="0" max="1" value="0.5" step="0.01"></label>
        <label class="ctl"><span class="lab">Length l (m) <span class="val" id="M_l_v"></span></span><input type="range" id="M_l" min="0.1" max="2" value="1" step="0.1"></label>
        <label class="ctl"><span class="lab">Angle α (°) <span class="val" id="M_a_v"></span></span><input type="range" id="M_a" min="0" max="90" value="0" step="1"></label>
        <div class="flex" style="margin:4px 0"><button class="btn" id="M_run">⏸ Pause</button><button class="btn ghost" id="M_flip">⇄ reverse v</button></div>
        <div class="out" id="M_out"></div>
        <p class="note"><b>Ex 1‑8</b>: v=5,B=0.5,l=1,α=0 → 2.5 V. <b>Ex 1‑9</b>: v=10,α=30° → 4.33 V. The force q<b>v</b>×<b>B</b> pushes the free charges to one end — that separation <em>is</em> the induced voltage.</p>
      </div>
      <div><canvas id="MCan" width="380" height="280"></canvas></div>
    </div>
  </div>`;
  const MCan=$('#MCan'),Mx=MCan.getContext('2d');let mX=90,mRun=true,mDir=1;
  const mArr=(c,x0,y0,x1,y1,col,w=2)=>{c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(x0,y0);c.lineTo(x1,y1);c.stroke();const a=Math.atan2(y1-y0,x1-x0);c.fillStyle=col;c.beginPath();c.moveTo(x1,y1);c.lineTo(x1-8*Math.cos(a-0.45),y1-8*Math.sin(a-0.45));c.lineTo(x1-8*Math.cos(a+0.45),y1-8*Math.sin(a+0.45));c.closePath();c.fill();};
  const mP=()=>({v:+$('#M_v').value,B:+$('#M_B').value,l:+$('#M_l').value,a:+$('#M_a').value});
  const upd=()=>{const {v,B,l,a}=mP(),e=v*B*l*Math.cos(a*Math.PI/180)*mDir;
    $('#M_v_v').textContent=v+' m/s';$('#M_B_v').textContent=B+' T';$('#M_l_v').textContent=l+' m';$('#M_a_v').textContent=a+'°';
    $('#M_out').innerHTML=`e = vBl cos α = ${v}·${B}·${l}·cos ${a}°\ne = <span class="k">${fmt(Math.abs(e),4)} V</span>   ${Math.abs(e)<1e-9?'':e>0?'(upper end +)':'(upper end −, v reversed)'}`;};
  function mDraw(){const {v,B,l,a}=mP(),e=v*B*l*Math.cos(a*Math.PI/180)*mDir,c=Mx,W=380,H=280;c.clearRect(0,0,W,H);
    c.fillStyle=`rgba(154,163,196,${(0.35+0.6*B).toFixed(2)})`;c.font='13px system-ui';for(let A=0;A<8;A++)for(let b=0;b<6;b++)c.fillText('×',22+A*46,44+b*42);
    c.fillStyle='#9aa3c4';c.font='12px system-ui';c.fillText(`B = ${B} T into page`,8,16);
    const cy=140,hl=30+35*l,ar=a*Math.PI/180,dx=Math.sin(ar),dy=-Math.cos(ar),tx=mX+hl*dx,ty=cy+hl*dy,bx=mX-hl*dx,by=cy-hl*dy;
    c.strokeStyle='#38d39f';c.lineWidth=5;c.beginPath();c.moveTo(bx,by);c.lineTo(tx,ty);c.stroke();c.fillStyle='#38d39f';c.fillText('l',tx+8,ty+14);
    if(v>0)mArr(c,mX,cy,mX+mDir*(20+3*v),cy,'#5b8cff',2.5);c.fillStyle='#5b8cff';c.fillText('v',mX+mDir*(26+3*v),cy-6);
    if(v>0&&B>0){mArr(c,mX,cy,mX,cy-mDir*(30+40*B),'#ffcc66',2);c.fillStyle='#ffcc66';c.fillText('v×B',mX+6,cy-mDir*(34+40*B));}
    if(a>0){c.strokeStyle='#ffcc66';c.lineWidth=1.2;c.beginPath();c.arc(mX,cy,26,-Math.PI/2*mDir,-Math.PI/2*mDir+ar*mDir,mDir<0);c.stroke();c.fillStyle='#ffcc66';c.fillText('α',mX+10,cy-30*mDir+4);}
    const n=Math.min(6,Math.round(Math.abs(e)/0.6)),top=e>0?'+':'−',bot=e>0?'−':'+';
    c.font='bold 12px system-ui';for(let k=0;k<n;k++){c.fillStyle=e>0?'#ff6b81':'#5b8cff';c.fillText(top,tx-4+(k%2)*12-6,ty-6-Math.floor(k/2)*13);c.fillStyle=e>0?'#5b8cff':'#ff6b81';c.fillText(bot,bx-4+(k%2)*12-6,by+16+Math.floor(k/2)*13);}
    if(n>0){c.fillStyle='#e8ebf7';c.font='12px system-ui';c.fillText(`${top} end`,tx+12,ty-4);c.fillText(`${bot} end`,bx+12,by+8);}
    c.fillStyle='rgba(23,26,43,.9)';c.fillRect(W-170,H-58,162,50);c.strokeStyle='#2a2f4a';c.lineWidth=1;c.strokeRect(W-170,H-58,162,50);
    c.fillStyle='#e8ebf7';c.font='12px system-ui';c.fillText(`e = vBl cos α`,W-162,H-40);c.fillStyle='#ff6b81';c.font='bold 13px system-ui';c.fillText(`= ${fmt(Math.abs(e),3)} V`,W-162,H-20);
    c.fillStyle='#9aa3c4';c.font='11px system-ui';c.fillText(Math.abs(e)<1e-9?'no motion across B → no emf':'charges pile up at the ends → voltage',8,H-8);
  }
  function mLoop(){if($('#sec-movevolt').classList.contains('on')){if(mRun){const {v}=mP();mX+=mDir*v*0.5;if(mX>300)mX=90;if(mX<90)mX=300;}mDraw();}requestAnimationFrame(mLoop);}
  ['M_v','M_B','M_l','M_a'].forEach(id=>$('#'+id).oninput=upd);
  $('#M_run').onclick=()=>{mRun=!mRun;$('#M_run').textContent=mRun?'⏸ Pause':'▶ Play';};
  $('#M_flip').onclick=()=>{mDir=-mDir;upd();};
  upd();mDraw();mLoop();
});

/* ============================================================ 1.8 linear DC machine (animated) */
section('linear','DC Machine','1.8 · Linear DC Machine',(el)=>{
  el.innerHTML=`
  <h2 class="title">The Linear DC Machine — Live Simulation</h2>
  <p class="subttl">§1.8 · The simplest machine — watch the bar actually move as motor, generator & on starting</p>
  <div class="card">
    <b>Four governing equations:</b>
    <div class="grid2">
      <div class="eq" style="text-align:center">F<sub>ind</sub> = i l B <span class="tag">(1‑43)</span></div>
      <div class="eq" style="text-align:center">e<sub>ind</sub> = v B l <span class="tag">(1‑45)</span></div>
      <div class="eq" style="text-align:center">i = <span class="frac"><span class="n">V<sub>B</sub> − e<sub>ind</sub></span><span class="d">R</span></span> <span class="tag">(1‑47)</span></div>
      <div class="eq" style="text-align:center">F<sub>net</sub> = m·dv/dt <span class="tag">(1‑7)</span></div>
    </div>
  </div>
  <details class="deriv"><summary>Derive the no-load speed v = V<sub>B</sub>/(Bl) (1‑50)</summary>
    <div class="step">① KVL: V<sub>B</sub> = iR + e<sub>ind</sub>.<span class="why">Battery drives current through R and the moving bar — Eq.(1‑47).</span></div>
    <div class="step">② At steady state the bar isn't accelerating → F<sub>net</sub>=0 → F<sub>ind</sub>=ilB=0 → i=0.<span class="why">No net force means no current (no load).</span></div>
    <div class="step">③ With i=0: V<sub>B</sub> = e<sub>ind</sub> = v·Bl.<span class="why">Back-emf has risen to equal the battery.</span></div>
    <div class="step">④ Solve: <b>v = V<sub>B</sub>/(Bl)</b>.<span class="why">Eq.(1‑50). Note: weaken B → faster bar (field weakening).</span></div>
  </details>

  <h3>▶ Real-time simulation</h3>
  <div class="card">
    <div class="grid2">
      <div>
        <label class="ctl"><span class="lab">Battery V<sub>B</sub> (V) <span class="val" id="a_V_v"></span></span><input type="range" id="a_V" min="20" max="250" value="120" step="5"></label>
        <label class="ctl"><span class="lab">Resistance R (Ω) <span class="val" id="a_R_v"></span></span><input type="range" id="a_R" min="0.1" max="2" value="0.3" step="0.05"></label>
        <label class="ctl"><span class="lab">Flux density B (T) <span class="val" id="a_B_v"></span></span><input type="range" id="a_B" min="0.02" max="0.5" value="0.1" step="0.01"></label>
        <label class="ctl"><span class="lab">Bar length l (m) <span class="val" id="a_l_v"></span></span><input type="range" id="a_l" min="1" max="10" value="10" step="0.5"></label>
        <label class="ctl"><span class="lab">Bar mass m (kg) <span class="val" id="a_m_v"></span></span><input type="range" id="a_m" min="0.5" max="20" value="5" step="0.5"></label>
        <label class="ctl"><span class="lab">Applied force F<sub>app</sub> (N): + right (gen) / − left (motor) <span class="val" id="a_F_v"></span></span><input type="range" id="a_F" min="-40" max="40" value="0" step="1"></label>
        <div class="flex">
          <button class="btn" id="a_run">▶ Start</button>
          <button class="btn ghost" id="a_reset">↺ Reset</button>
          <button class="btn warn" id="a_short">⚡ Show starting surge</button>
        </div>
      </div>
      <div>
        <div class="grid3">
          <div class="gauge"><div class="g-l">velocity</div><div class="g-v"><span id="g_v">0</span></div><div class="mini">m/s</div></div>
          <div class="gauge"><div class="g-l">current i</div><div class="g-v"><span id="g_i">0</span></div><div class="mini">A</div></div>
          <div class="gauge"><div class="g-l">e<sub>ind</sub></div><div class="g-v"><span id="g_e">0</span></div><div class="mini">V</div></div>
        </div>
        <div id="a_mode" class="okbox" style="margin-top:10px">Idle — press Start</div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px">
          <div class="gauge"><div class="g-l">P<sub>batt</sub> = V<sub>B</sub>·i</div><div class="g-v" style="font-size:16px"><span id="g_pb">0</span></div><div class="mini">W</div></div>
