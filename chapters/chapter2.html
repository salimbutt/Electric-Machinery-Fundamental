section('voltreg','System Tools','2.6 · Voltage Regulation ★',(el)=>{
  el.innerHTML=`
  <h2 class="title">Voltage Regulation</h2>
  <p class="subttl">§2.6 · Regulation phasors referred to the primary (Step 1) and to the secondary (Step 2), then Example 2‑5 with the VR-vs-load trend (Step 3) · efficiency has its own section, §2.7</p>
  <div class="eq" style="text-align:center">VR = <span class="frac"><span class="n">V<sub>P</sub>/a − V<sub>S,fl</sub></span><span class="d">V<sub>S,fl</sub></span></span> ×100%<span class="tag">2‑61</span></div>
  <div class="eq"><span class="vec">V<sub>P</sub></span>/a = <span class="vec">V<sub>S</sub></span> + (R<sub>eq</sub>+jX<sub>eq</sub>)<span class="vec">I<sub>S</sub></span> <span class="tag">(2‑64)</span></div>
  <details class="deriv"><summary>Why PF sign flips the regulation</summary>
    <div class="step">Lagging (inductive) load: I lags V; the jX<sub>eq</sub>I drop adds along V → V<sub>P</sub>/a > V<sub>S</sub> → <b>VR > 0</b>.</div>
    <div class="step">Leading (capacitive) load: the reactive drop subtracts → V<sub>S</sub> can exceed V<sub>P</sub>/a → <b>VR < 0</b>.<span class="why">This is why capacitive loads can "boost" secondary voltage.</span></div>
  </details>

  <h3>Step 1 — Fix the primary voltage: the phasor diagram referred to the primary</h3>
  <p class="note">Collapse the whole transformer onto the primary side (§2.5, Step 3): the series impedance is <b>R<sub>eq,p</sub> = R<sub>p</sub> + a²R<sub>s</sub></b>, <b>X<sub>eq,p</sub> = X<sub>p</sub> + a²X<sub>s</sub></b>, and the load voltage appears as <b>aV<sub>S</sub></b>. The supply fixes V<sub>P</sub>; the current I<sub>P</sub> pays the copper drop (along I<sub>P</sub>) and the leakage drop (90° ahead of I<sub>P</sub>); <b>aV<sub>S</sub> is whatever is left for the load</b>. V<sub>P</sub> is the reference. Drops are magnified in the drawing only.</p>
  <div class="eq"><span class="vec">V</span><sub>P</sub> = a<span class="vec">V</span><sub>S</sub> + <span class="vec">I</span><sub>P</sub>R<sub>eq,p</sub> + j<span class="vec">I</span><sub>P</sub>X<sub>eq,p</sub> <span class="tag">referred to the primary</span></div>
  <div class="card">
    <div class="pvgrid" style="display:grid;grid-template-columns:270px 1fr;gap:16px;align-items:start">
      <div>
        <label class="ctl"><span class="lab"><span>Primary voltage V<sub>P</sub> (held fixed)</span> <span class="val" id="pv_V_v"></span></span><input type="range" id="pv_V" min="500" max="5000" step="10" value="2300"></label>
        <label class="ctl"><span class="lab"><span>Primary current I<sub>P</sub></span> <span class="val" id="pv_I_v"></span></span><input type="range" id="pv_I" min="0" max="20" step="0.01" value="6.52"></label>
        <label class="ctl"><span class="lab"><span>Power-factor angle θ (+ lag / − lead)</span> <span class="val" id="pv_th_v"></span></span><input type="range" id="pv_th" min="-60" max="60" step="1" value="37"></label>
        <label class="ctl"><span class="lab"><span>R<sub>eq,p</sub> (Ω, primary side)</span> <span class="val" id="pv_R_v"></span></span><input type="range" id="pv_R" min="0" max="20" step="0.05" value="4.45"></label>
        <label class="ctl"><span class="lab"><span>X<sub>eq,p</sub> (Ω, primary side)</span> <span class="val" id="pv_X_v"></span></span><input type="range" id="pv_X" min="0" max="30" step="0.05" value="6.45"></label>
        <div class="grid2">
          <label class="ctl"><span class="lab"><span>Turns ratio a</span></span><input type="number" id="pv_a" value="10" step="any" min="0.01"></label>
          <label class="ctl"><span class="lab"><span>Drop ×k (drawing)</span> <span class="val" id="pv_k_v"></span></span><input type="range" id="pv_k" min="1" max="40" step="1" value="8"></label>
        </div>
        <div class="out" id="pv_out" style="font-size:12.5px"></div>
      </div>
      <canvas id="pv_can" width="540" height="330" style="width:100%"></canvas>
    </div>
    <p class="note">Slide θ from lagging through zero to leading: for a lagging load aV<sub>S</sub> falls well short of V<sub>P</sub> (the load voltage sags); for a leading load the reactive drop turns backwards and aV<sub>S</sub> can even exceed V<sub>P</sub>.</p>
  </div>

  <style>@media(max-width:900px){.vsgrid{grid-template-columns:1fr!important}}</style>
  <h3>Step 2 — Now fix the secondary voltage and see what the primary must be</h3>
  <p class="note">Same picture, read from the other end. Refer everything to the secondary: <b>V<sub>P</sub>/a = V<sub>S</sub> + I<sub>S</sub>R<sub>eq</sub> + jI<sub>S</sub>X<sub>eq</sub></b>. Hold <b>V<sub>S</sub></b> fixed as the reference, set the load current and its power factor, and the triangle tells you the primary voltage the supply must provide. The gap between |V<sub>P</sub>/a| and V<sub>S</sub> <em>is</em> the voltage regulation. Slide the power-factor angle from lagging through zero to leading and watch the triangle swing round.</p>
  <div class="card">
    <div class="vsgrid" style="display:grid;grid-template-columns:270px 1fr;gap:16px;align-items:start">
      <div>
        <label class="ctl"><span class="lab"><span>Secondary voltage V<sub>S</sub> (held fixed)</span> <span class="val" id="vs_V_v"></span></span><input type="range" id="vs_V" min="100" max="500" step="1" value="230"></label>
        <label class="ctl"><span class="lab"><span>Load current I<sub>S</sub></span> <span class="val" id="vs_I_v"></span></span><input type="range" id="vs_I" min="0" max="100" step="0.1" value="65.2"></label>
        <label class="ctl"><span class="lab"><span>Power-factor angle θ (+ lag / − lead)</span> <span class="val" id="vs_th_v"></span></span><input type="range" id="vs_th" min="-60" max="60" step="1" value="37"></label>
        <label class="ctl"><span class="lab"><span>R<sub>eq</sub> (Ω, secondary side)</span> <span class="val" id="vs_R_v"></span></span><input type="range" id="vs_R" min="0" max="0.2" step="0.001" value="0.0445"></label>
        <label class="ctl"><span class="lab"><span>X<sub>eq</sub> (Ω, secondary side)</span> <span class="val" id="vs_X_v"></span></span><input type="range" id="vs_X" min="0" max="0.3" step="0.001" value="0.0645"></label>
        <label class="ctl"><span class="lab"><span>Drop magnification (drawing only)</span> <span class="val" id="vs_k_v"></span></span><input type="range" id="vs_k" min="1" max="40" step="1" value="8"></label>
        <div class="out" id="vs_out" style="font-size:12.5px"></div>
      </div>
      <canvas id="vs_can" width="540" height="330" style="width:100%"></canvas>
    </div>
    <div class="grid3" style="margin-top:8px">
      <div class="okbox"><b>Lagging (inductive), θ &gt; 0:</b> both drops lean forward along V<sub>S</sub> → |V<sub>P</sub>/a| &gt; V<sub>S</sub> → <b>VR positive</b> and largest.</div>
      <div class="okbox"><b>Unity (resistive), θ = 0:</b> the resistive drop adds head-on, the reactive drop is sideways → small positive VR.</div>
      <div class="okbox"><b>Leading (capacitive), θ &lt; 0:</b> the jX drop now points <em>backwards</em> → |V<sub>P</sub>/a| can be <em>less</em> than V<sub>S</sub> → <b>VR negative</b>.</div>
    </div>
  </div>
  <h3>Step 3 — Live analysis <span class="badge">Example 2‑5</span></h3>
  <div class="card">
    <div class="grid2">
      <div>
        <label class="ctl"><span class="lab"><span>R<sub>eq</sub> (Ω, sec. side)</span> <span class="val" id="v_R_v"></span></span><input type="range" id="v_R" min="0" max="0.2" value="0.0445" step="0.001"></label>
        <label class="ctl"><span class="lab"><span>X<sub>eq</sub> (Ω)</span> <span class="val" id="v_X_v"></span></span><input type="range" id="v_X" min="0" max="0.3" value="0.0645" step="0.001"></label>
        <label class="ctl"><span class="lab"><span>V<sub>S</sub> (V)</span></span><input type="number" id="v_Vs" value="230" step="any"></label>
        <label class="ctl"><span class="lab"><span>Rated I<sub>S</sub> (A)</span></span><input type="number" id="v_Is" value="65.2" step="any"></label>
        <label class="ctl"><span class="lab"><span>Load level (fraction of rated I<sub>S</sub>)</span> <span class="val" id="v_load_v"></span></span><input type="range" id="v_load" min="0" max="100" value="100" step="1"></label>
        <label class="ctl"><span class="lab"><span>Power-factor angle θ (+ lag / − lead)</span> <span class="val" id="v_pf_v"></span></span><input type="range" id="v_pf" min="-90" max="90" value="37" step="1"></label>
        <label class="ctl"><span class="lab"><span>Drop ×k (drawing only)</span> <span class="val" id="v_k_v"></span></span><input type="range" id="v_k" min="1" max="40" value="8" step="1"></label>
        <div class="out" id="v_out"></div>
      </div>
      <div>
        <canvas id="v_phasor" width="540" height="330" style="width:100%"></canvas>
        <div class="note" style="margin-top:6px">Same diagram as Step 2, now driven by the Example 2‑5 transformer at the load level you choose: <b>V<sub>S</sub></b> (green) is the rated secondary voltage held fixed; <b>I<sub>S</sub></b> (purple) = load level × rated current at the chosen power-factor angle; the red and amber drops are I<sub>S</sub>R<sub>eq</sub> and jI<sub>S</sub>X<sub>eq</sub>; <b>V<sub>P</sub>/a</b> (blue) is the primary voltage the supply must hold. VR compares the blue length with the green. Drag the load level to 0 and the triangle collapses — no-load, VR = 0.</div>
      </div>
    </div>
  </div>
  <h3>Trend across the whole load range</h3>
  <div class="card"><b>Voltage regulation vs load</b><canvas id="v_vr" width="840" height="300" style="width:100%"></canvas><div class="note">Three curves for the Example 2‑5 transformer: 0.8 lagging (red) climbs steepest, unity (green) rises gently, 0.8 leading (blue) goes negative — Fig 2‑31. Efficiency is treated separately in §2.7.</div></div>`;
  const ph=$('#v_phasor').getContext('2d'),vrC=$('#v_vr').getContext('2d');
  const P=()=>({R:+$('#v_R').value,X:+$('#v_X').value,Vs:+$('#v_Vs').value,Irated:+$('#v_Is').value,load:+$('#v_load').value/100,pf:+$('#v_pf').value});
  function VP(Vs,R,X,Is,ang){ // returns complex Vp/a with Vs as reference (0°)
    const Ivec=cPolar(Is,ang);const Z=C(R,X);return cAdd(C(Vs,0),cMul(Z,Ivec));
  }
  function upd(){
    const p=P();const Is=p.Irated*p.load;
    $('#v_R_v').textContent=fmt(p.R,4)+' Ω';$('#v_X_v').textContent=fmt(p.X,4)+' Ω';
    $('#v_load_v').textContent=Math.round(p.load*100)+'%';
    $('#v_pf_v').textContent=thTxt(p.pf);$('#v_k_v').textContent='×'+$('#v_k').value;
    const Vp=VP(p.Vs,p.R,p.X,Is,-p.pf);const VpMag=cAbs(Vp);
    const VR=(VpMag-p.Vs)/p.Vs*100;
    $('#v_out').innerHTML=`I<sub>S</sub> = ${Math.round(p.load*100)} % × ${p.Irated} = <span class="k">${fmt(Is,1)} A</span> at ${thTxt(p.pf)}\nV<sub>P</sub>/a = <span class="k">${fmt(VpMag,2)} V ∠${fmt(cAng(Vp),2)}°</span>\n<b>VR = (V<sub>P</sub>/a − V<sub>S</sub>)/V<sub>S</sub> = <span class="k">${fmt(VR,3)} %</span></b>`;
    // phasor — same routine as Step 2
    regPhasor(ph,540,330,p.Vs,Is,p.pf,p.R,p.X,+$('#v_k').value,'fwd',{ref:'V_S',out:'V_P/a',cur:'I_S',r:'I_S·R_eq',x:'jI_S·X_eq',refCol:'#38d39f',outCol:'#5b8cff',legend:'green V_S (rated, fixed)  ·  blue V_P/a (primary needed)  ·  red I_S·R_eq (∥ I_S)  ·  amber jI_S·X_eq (⟂ I_S)  ·  purple I_S = load × rated'});
    // VR trend
    drawVR(p);
  }
  function drawVR(p){
    const W=840,H=300;axes(vrC,W,H,{l:44,r:10,t:14,b:26},'load (A)','VR (%)');
    const pfs=[[-36.87,'#ff6b81','0.8 lag'],[0,'#38d39f','unity'],[36.87,'#5b8cff','0.8 lead']];
    // find range
    let vals=[];pfs.forEach(([ang])=>{for(let f=0;f<=1;f+=0.05){const Is=p.Irated*f;vals.push((cAbs(VP(p.Vs,p.R,p.X,Is,ang))-p.Vs)/p.Vs*100);}});
    const vmax=Math.max(...vals,0.5),vmin=Math.min(...vals,-0.5);
    const yY=v=>(H-26)-(v-vmin)/(vmax-vmin)*(H-40);
    // zero line
    vrC.strokeStyle='#333c60';vrC.beginPath();vrC.moveTo(44,yY(0));vrC.lineTo(W-10,yY(0));vrC.stroke();
    pfs.forEach(([ang,c,lab],i)=>{vrC.strokeStyle=c;vrC.lineWidth=2;vrC.beginPath();
      for(let f=0;f<=1;f+=0.02){const Is=p.Irated*f;const x=44+f*(W-54);const v=(cAbs(VP(p.Vs,p.R,p.X,Is,ang))-p.Vs)/p.Vs*100;const y=yY(v);f===0?vrC.moveTo(x,y):vrC.lineTo(x,y);}vrC.stroke();
      vrC.fillStyle=c;vrC.font='11px system-ui';vrC.font='12px system-ui';vrC.fillText(lab,54,22+i*15);});
  }
  ['v_R','v_X','v_Vs','v_Is','v_load','v_pf','v_k'].forEach(id=>$('#'+id).oninput=upd);upd();

  /* ---- shared regulation phasor: mode 'fwd' OUT = V + Z·I (V_S fixed) ; mode 'back' OUT = V − Z·I (V_P fixed) ---- */
  function pvArr(c,x0,y0,x1,y1,col,w=2.5){c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(x0,y0);c.lineTo(x1,y1);c.stroke();const a=Math.atan2(y1-y0,x1-x0);c.fillStyle=col;c.beginPath();c.moveTo(x1,y1);c.lineTo(x1-9*Math.cos(a-0.45),y1-9*Math.sin(a-0.45));c.lineTo(x1-9*Math.cos(a+0.45),y1-9*Math.sin(a+0.45));c.closePath();c.fill();}
  function regPhasor(c,W,H,V,I,th,R,X,k,mode,L){
    const ox=42,oy=Math.round(H*0.64),a=-th*Math.PI/180,Ir=I*Math.cos(a),Ii=I*Math.sin(a),dRr=Ir*R,dRi=Ii*R,dXr=-Ii*X,dXi=Ir*X,sg=mode==='fwd'?1:-1;
    const Or=V+sg*(dRr+dXr),Oi=sg*(dRi+dXi),Om=Math.hypot(Or,Oi),Od=Math.atan2(Oi,Or)*180/Math.PI;
    const Or2=V+sg*k*(dRr+dXr),Oi2=sg*k*(dRi+dXi),sc=(W-110)/Math.max(V,Math.hypot(Or2,Oi2),1e-9);
    c.clearRect(0,0,W,H);
    c.strokeStyle='#232a49';c.lineWidth=1;c.beginPath();c.moveTo(ox-20,oy);c.lineTo(W-10,oy);c.moveTo(ox,oy+95);c.lineTo(ox,32);c.stroke();
    c.setLineDash([4,4]);c.strokeStyle='rgba(154,163,196,.45)';c.beginPath();c.arc(ox,oy,V*sc,-0.9,0.5);c.stroke();c.setLineDash([]);
    const Rf=[ox+V*sc,oy],Ot=[ox+Or2*sc,oy-Oi2*sc],S=mode==='fwd'?Rf:Ot,P1=[S[0]+k*dRr*sc,S[1]-k*dRi*sc],E=mode==='fwd'?Ot:Rf;
    pvArr(c,ox,oy,Rf[0],Rf[1],L.refCol,3);
    if(I*R>0)pvArr(c,S[0],S[1],P1[0],P1[1],'#ff6b81',3);if(I*X>0)pvArr(c,P1[0],P1[1],E[0],E[1],'#ffcc66',3);
    pvArr(c,ox,oy,Ot[0],Ot[1],L.outCol,3);
    if(I*R>0&&I*X>0){let ux=P1[0]-S[0],uy=P1[1]-S[1],vx=E[0]-P1[0],vy=E[1]-P1[1];const um=Math.hypot(ux,uy)||1,vm=Math.hypot(vx,vy)||1;ux/=um;uy/=um;vx/=vm;vy/=vm;const m=9;c.strokeStyle='#9aa3c4';c.lineWidth=1;c.beginPath();c.moveTo(P1[0]-ux*m,P1[1]-uy*m);c.lineTo(P1[0]-ux*m+vx*m,P1[1]-uy*m+vy*m);c.lineTo(P1[0]+vx*m,P1[1]+vy*m);c.stroke();}
    const Ix=ox+130*Math.cos(a),Iy=oy-130*Math.sin(a);pvArr(c,ox,oy,Ix,Iy,'#c774e6',2.5);
    c.font='12px system-ui';
    if(th!==0){c.strokeStyle='#c774e6';c.lineWidth=1.2;c.beginPath();c.arc(ox,oy,58,0,-a,th<0);c.stroke();c.fillStyle='#c774e6';c.fillText('θ',ox+63,oy+(th>0?16:-8));}
    const d2=Math.atan2(Oi2,Or2);if(Math.abs(Od)>0.05){c.strokeStyle=L.outCol;c.lineWidth=1.2;c.beginPath();c.arc(ox,oy,150,0,-d2,d2>0);c.stroke();c.fillStyle=L.outCol;c.fillText('δ',ox+155,oy+(d2<0?14:-6));}
    c.fillStyle='#c774e6';c.fillText(L.cur,Ix+6,Iy+4);
    c.fillStyle=L.refCol;c.fillText(`${L.ref} = ${fmt(V,1)} V (fixed)`,Rf[0]-118,Rf[1]+(Ot[1]<oy?18:-10));
    c.fillStyle=L.outCol;c.fillText(`${L.out} = ${fmt(Om,1)} V ∠${fmt(Od,1)}°`,ox+(Ot[0]-ox)*0.42,Ot[1]+(Ot[1]<oy?-10:20));
    c.fillStyle='#ff6b81';c.fillText(`${L.r} = ${fmt(I*R,1)} V`,(S[0]+P1[0])/2+10,(S[1]+P1[1])/2+4);
    c.fillStyle='#ffcc66';c.fillText(`${L.x} = ${fmt(I*X,1)} V`,(P1[0]+E[0])/2+10,(P1[1]+E[1])/2-6);
    c.fillStyle='#9aa3c4';c.font='11px system-ui';c.fillText(L.legend,ox,22);
    c.fillText(`dashed arc = |${L.ref}| ; drops drawn ×${k} so the triangle is visible — all numbers in the readout are exact`,ox,H-10);
    return {Om,Od,Or,Oi,Ir,Ii};
  }
  function cjx(r,i){return `${fmt(r,2)} ${i>=0?'+':'−'} j${fmt(Math.abs(i),2)}`;}
  function thTxt(th){return th>0?th+'° lagging (PF '+fmt(Math.cos(th*Math.PI/180),3)+')':th<0?(-th)+'° leading (PF '+fmt(Math.cos(th*Math.PI/180),3)+')':'0° unity (PF 1)';}

  /* ---- Step 1: V_P fixed → aV_S (referred to primary) ---- */
  const pvx=$('#pv_can').getContext('2d');
  function pvUpd(){
    const V=+$('#pv_V').value,I=+$('#pv_I').value,th=+$('#pv_th').value,R=+$('#pv_R').value,X=+$('#pv_X').value,k=+$('#pv_k').value,aT=+$('#pv_a').value||1;
    $('#pv_V_v').textContent=V+' V';$('#pv_I_v').textContent=I+' A';$('#pv_th_v').textContent=thTxt(th);$('#pv_R_v').textContent=R+' Ω';$('#pv_X_v').textContent=X+' Ω';$('#pv_k_v').textContent='×'+k;
    const r=regPhasor(pvx,540,330,V,I,th,R,X,k,'back',{ref:'V_P',out:'aV_S',cur:'I_P',r:'I_P·R_eq,p',x:'jI_P·X_eq,p',refCol:'#5b8cff',outCol:'#38d39f',legend:'blue V_P (reference, fixed)  ·  green aV_S (load voltage, referred)  ·  red I_P·R_eq,p (∥ I_P)  ·  amber jI_P·X_eq,p (⟂ I_P)  ·  purple I_P'});
    const Vs=r.Om/aT,VR=(V-r.Om)/r.Om*100;
    $('#pv_out').innerHTML=`<b>V<sub>P</sub> = aV<sub>S</sub> + I<sub>P</sub>R<sub>eq,p</sub> + jI<sub>P</sub>X<sub>eq,p</sub></b>\nV<sub>P</sub> = ${V}∠0° V (reference, fixed)\nI<sub>P</sub> = ${I}∠${-th}° = ${cjx(r.Ir,r.Ii)} A\nI<sub>P</sub>R<sub>eq,p</sub> = <span class="k">${fmt(I*R,2)} V</span> ∠${-th}°  (along I<sub>P</sub>)\njI<sub>P</sub>X<sub>eq,p</sub> = <span class="k">${fmt(I*X,2)} V</span> ∠${90-th}°  (90° ahead of I<sub>P</sub>)\naV<sub>S</sub> = V<sub>P</sub> − I<sub>P</sub>R<sub>eq,p</sub> − jI<sub>P</sub>X<sub>eq,p</sub>\n   = ${cjx(r.Or,r.Oi)} = <span class="k">${fmt(r.Om,2)} V ∠${fmt(r.Od,2)}°</span>\nV<sub>S</sub> = |aV<sub>S</sub>|/a = ${fmt(r.Om,2)}/${aT} = <span class="k">${fmt(Vs,2)} V</span>   (I<sub>S</sub> = aI<sub>P</sub> = ${fmt(aT*I,1)} A)\n<b>VR = (V<sub>P</sub>/a − V<sub>S</sub>)/V<sub>S</sub> = <span class="k">${fmt(VR,2)} %</span></b>  ${VR>0.005?'(load voltage sags below no-load)':VR<-0.005?'(negative: load voltage rises above no-load)':'(zero)'}`;
  }
  ['pv_V','pv_I','pv_th','pv_R','pv_X','pv_k','pv_a'].forEach(id=>$('#'+id).oninput=pvUpd);pvUpd();

  /* ---- Step 2: V_S fixed → required V_P/a (referred to secondary) ---- */
  const vsx=$('#vs_can').getContext('2d');
  function vsUpd(){
    const V=+$('#vs_V').value,I=+$('#vs_I').value,th=+$('#vs_th').value,R=+$('#vs_R').value,X=+$('#vs_X').value,k=+$('#vs_k').value;
    $('#vs_V_v').textContent=V+' V';$('#vs_I_v').textContent=I+' A';$('#vs_th_v').textContent=thTxt(th);$('#vs_R_v').textContent=fmt(R,4)+' Ω';$('#vs_X_v').textContent=fmt(X,4)+' Ω';$('#vs_k_v').textContent='×'+k;
    const r=regPhasor(vsx,540,330,V,I,th,R,X,k,'fwd',{ref:'V_S',out:'V_P/a',cur:'I_S',r:'I_S·R_eq',x:'jI_S·X_eq',refCol:'#38d39f',outCol:'#5b8cff',legend:'green V_S (reference, fixed)  ·  blue V_P/a (primary needed, referred)  ·  red I_S·R_eq (∥ I_S)  ·  amber jI_S·X_eq (⟂ I_S)  ·  purple I_S'});
    const VR=(r.Om-V)/V*100;
    $('#vs_out').innerHTML=`<b>V<sub>P</sub>/a = V<sub>S</sub> + I<sub>S</sub>R<sub>eq</sub> + jI<sub>S</sub>X<sub>eq</sub></b>\nV<sub>S</sub> = ${V}∠0° V (reference, fixed)\nI<sub>S</sub> = ${I}∠${-th}° = ${cjx(r.Ir,r.Ii)} A\nI<sub>S</sub>R<sub>eq</sub> = <span class="k">${fmt(I*R,2)} V</span> ∠${-th}°  (along I<sub>S</sub>)\njI<sub>S</sub>X<sub>eq</sub> = <span class="k">${fmt(I*X,2)} V</span> ∠${90-th}°  (90° ahead of I<sub>S</sub>)\nV<sub>P</sub>/a = ${cjx(r.Or,r.Oi)} = <span class="k">${fmt(r.Om,2)} V ∠${fmt(r.Od,2)}°</span>\n<b>VR = (V<sub>P</sub>/a − V<sub>S</sub>)/V<sub>S</sub> = <span class="k">${fmt(VR,2)} %</span></b>  ${VR>0.005?'(primary must be higher — voltage sags to the load)':VR<-0.005?'(negative: the load voltage rises above the no-load value)':'(zero)'}`;
  }
  ['vs_V','vs_I','vs_th','vs_R','vs_X','vs_k'].forEach(id=>$('#'+id).oninput=vsUpd);vsUpd();
});

/* ===================================================================
   2.7 Efficiency & maximum efficiency
=================================================================== */
section('eff','System Tools','2.7 · Efficiency & Maximum Efficiency ★',(el)=>{
  el.innerHTML=`
  <style>@media(max-width:900px){.efgrid{grid-template-columns:1fr!important}}</style>
  <h2 class="title">Efficiency & Maximum Efficiency</h2>
  <p class="subttl">§2.7 · Where the losses come from, why efficiency peaks at a particular load, and what moves that peak</p>
  <div class="grid3">
    <div class="eq" style="text-align:center"><i>η</i> = <span class="frac"><span class="n"><i>P</i><sub>out</sub></span><span class="d"><i>P</i><sub>out</sub> + <i>P</i><sub>Cu</sub> + <i>P</i><sub>core</sub></span></span> × 100 %<span class="tag">2‑67</span></div>
    <div class="eq" style="text-align:center"><i>P</i><sub>out</sub> = <i>V</i><sub>S</sub> <i>I</i><sub>S</sub> cos <i>θ</i></div>
    <div class="eq" style="text-align:center"><i>P</i><sub>Cu</sub> = <i>I</i><sub>S</sub>² <i>R</i><sub>eq</sub>,    <i>P</i><sub>core</sub> = <span class="frac"><span class="n"><i>V</i><sub>S</sub>²</span><span class="d"><i>R</i><sub>C</sub></span></span></div>
  </div>

  <h3>Step 1 — Two kinds of loss, two different behaviours</h3>
  <div class="card">
    <div class="grid2">
      <div class="okbox"><b>Core (iron) loss P<sub>core</sub> — constant.</b> Hysteresis + eddy currents in the laminations. It is set by the <em>flux</em>, i.e. by the applied voltage and frequency (P<sub>h</sub> ∝ f·B<sup>1.6</sup>, P<sub>e</sub> ∝ f²B²t²), not by the load current. From no load to full load it hardly changes — the transformer pays it every hour it is energised. Circuit model: R<sub>C</sub>.</div>
      <div class="okbox"><b>Copper (I²R) loss P<sub>Cu</sub> — grows with load².</b> Heating of the two windings, I<sub>S</sub>²R<sub>eq</sub>. Zero at no load, P<sub>Cu,fl</sub> at rated current, and because it goes as I² it is four times larger at full load than at half load. It depends only on <em>how much</em> current flows, not on its phase angle. Circuit model: R<sub>eq</sub>.</div>
    </div>
    <div class="eq">At load fraction <i>x</i> = <span class="frac"><span class="n"><i>I</i><sub>S</sub></span><span class="d"><i>I</i><sub>S,rated</sub></span></span> :     <i>P</i><sub>out</sub> = <i>x</i> <i>S</i> cos <i>θ</i>,     <i>P</i><sub>Cu</sub> = <i>x</i>² <i>P</i><sub>Cu,fl</sub>,     <i>P</i><sub>core</sub> = constant</div>
    <p class="note">So at light load the fixed core loss dominates and η is poor; at heavy load the fast-growing copper loss takes over. Somewhere in between the two are equal — and that is exactly where η is highest.</p>
  </div>

  <h3>Step 2 — Derivation: efficiency is maximum when P<sub>Cu</sub> = P<sub>core</sub></h3>
  <details class="deriv" open><summary>Derive the condition and the load at which it happens</summary>
    <div class="step">① Write the efficiency as a function of the load fraction <span class="m"><i>x</i> = <i>I</i><sub>S</sub>/<i>I</i><sub>S,rated</sub></span>:
      <span class="dq"><i>η</i>(<i>x</i>) = <span class="frac"><span class="n"><i>x</i> <i>S</i> cos <i>θ</i></span><span class="d"><i>x</i> <i>S</i> cos <i>θ</i> + <i>x</i>² <i>P</i><sub>Cu,fl</sub> + <i>P</i><sub>core</sub></span></span></span>
      <span class="why">Output grows in proportion to <i>x</i>, copper loss grows as <i>x</i>², core loss is fixed.</span></div>
    <div class="step">② Divide numerator and denominator by <i>x</i>:
      <span class="dq"><i>η</i> = <span class="frac"><span class="n"><i>S</i> cos <i>θ</i></span><span class="d"><i>S</i> cos <i>θ</i> + <i>L</i>(<i>x</i>)</span></span>,      where   <i>L</i>(<i>x</i>) = <i>x</i> <i>P</i><sub>Cu,fl</sub> + <span class="frac"><span class="n"><i>P</i><sub>core</sub></span><span class="d"><i>x</i></span></span></span>
      <span class="why"><i>S</i> cos <i>θ</i> is constant for a given power factor, so <i>η</i> is largest exactly when <i>L</i>(<i>x</i>) — the loss per unit of output — is smallest.</span></div>
    <div class="step">③ Minimise <i>L</i>(<i>x</i>):
      <span class="dq"><span class="frac"><span class="n">d<i>L</i></span><span class="d">d<i>x</i></span></span> = <i>P</i><sub>Cu,fl</sub> − <span class="frac"><span class="n"><i>P</i><sub>core</sub></span><span class="d"><i>x</i>²</span></span> = 0     ⟹     <b><i>x</i>² <i>P</i><sub>Cu,fl</sub> = <i>P</i><sub>core</sub></b></span>
      <span class="dq" style="font-size:16px;color:var(--muted)"><span class="frac"><span class="n">d²<i>L</i></span><span class="d">d<i>x</i>²</span></span> = <span class="frac"><span class="n">2 <i>P</i><sub>core</sub></span><span class="d"><i>x</i>³</span></span> &gt; 0     (a minimum of <i>L</i>, hence a maximum of <i>η</i>)</span>
      <span class="why"><i>x</i>² <i>P</i><sub>Cu,fl</sub> is the copper loss at load <i>x</i>. So the condition reads: <b>copper loss = core loss</b>.</span></div>
    <div class="step">④ Load for maximum efficiency:
      <span class="dq"><i>x</i>* = <span class="sqrt tall"><span class="rad"><span class="frac"><span class="n"><i>P</i><sub>core</sub></span><span class="d"><i>P</i><sub>Cu,fl</sub></span></span></span></span>,       <i>S</i>* = <i>x</i>* <i>S</i>,       <i>I</i>* = <i>x</i>* <i>I</i><sub>rated</sub></span>
      <span class="why">It depends only on the two loss figures — a property of the design, not of the load connected.</span></div>
    <div class="step">⑤ The maximum efficiency itself (the total loss at <i>x</i>* is 2<i>P</i><sub>core</sub>):
      <span class="dq"><i>η</i><sub>max</sub> = <span class="frac"><span class="n"><i>x</i>* <i>S</i> cos <i>θ</i></span><span class="d"><i>x</i>* <i>S</i> cos <i>θ</i> + 2 <i>P</i><sub>core</sub></span></span></span></div>
    <div class="step">⑥ Two things to notice. <b><i>x</i>* does not depend on the power factor</b> — the losses only see |<i>I</i>|. But <b><i>η</i><sub>max</sub> does</b>: a lower cos <i>θ</i> delivers less output for the same current and the same losses, so the whole curve, peak included, moves down.</div>
    <div class="step">The same result in terms of current:
      <span class="dq"><i>η</i> = <span class="frac"><span class="n"><i>V</i> <i>I</i> cos <i>θ</i></span><span class="d"><i>V</i> <i>I</i> cos <i>θ</i> + <i>I</i>² <i>R</i><sub>eq</sub> + <i>P</i><sub>core</sub></span></span>,       <span class="frac"><span class="n">d<i>η</i></span><span class="d">d<i>I</i></span></span> = 0     ⟹     <b><i>I</i>² <i>R</i><sub>eq</sub> = <i>P</i><sub>core</sub></b></span></div>
  </details>
  <h3>▶ Efficiency lab — losses, η vs load, η vs power factor</h3>
  <p class="note">Preset to the Example 2‑5 transformer (15 kVA, P<sub>Cu,fl</sub> = 189 W, P<sub>core</sub> = 52.5 W). Everything redraws as you move a slider.</p>
  <div class="card">
    <div class="efgrid" style="display:grid;grid-template-columns:270px 1fr;gap:16px;align-items:start">
      <div>
        <label class="ctl"><span class="lab"><span>Rated power S</span> <span class="val" id="ef_S_v"></span></span><input type="range" id="ef_S" min="1" max="100" step="1" value="15"></label>
        <label class="ctl"><span class="lab"><span>Full-load copper loss P<sub>Cu,fl</sub></span> <span class="val" id="ef_cu_v"></span></span><input type="range" id="ef_cu" min="20" max="1000" step="1" value="189"></label>
        <label class="ctl"><span class="lab"><span>Core loss P<sub>core</sub></span> <span class="val" id="ef_co_v"></span></span><input type="range" id="ef_co" min="5" max="500" step="0.5" value="52.5"></label>
        <label class="ctl"><span class="lab"><span>Power factor cos θ</span> <span class="val" id="ef_pf_v"></span></span><input type="range" id="ef_pf" min="0.3" max="1" step="0.01" value="0.8"></label>
        <label class="ctl"><span class="lab"><span>Load x (% of rated current)</span> <span class="val" id="ef_x_v"></span></span><input type="range" id="ef_x" min="0" max="125" step="1" value="100"></label>
        <div class="out" id="ef_out" style="font-size:12.5px"></div>
      </div>
      <div>
        <canvas id="ef_can1" width="540" height="300" style="width:100%"></canvas>
        <div class="grid2" style="margin-top:8px">
          <canvas id="ef_can2" width="270" height="230" style="width:100%"></canvas>
          <canvas id="ef_can3" width="270" height="230" style="width:100%"></canvas>
        </div>
        <canvas id="ef_can4" width="540" height="215" style="width:100%;margin-top:8px"></canvas>
      </div>
    </div>
    <div class="grid3" style="margin-top:8px">
      <div class="okbox"><b>Top graph — η vs load.</b> Every curve peaks at the <em>same</em> x* (dashed line); a lower power factor only pushes the whole curve down.</div>
      <div class="okbox"><b>Left graph — the two losses.</b> Flat core loss, parabolic copper loss; they cross at x*. Right of the crossing copper loss wins, left of it core loss wins.</div>
      <div class="okbox"><b>Phasor — why PF matters.</b> Only the component of I<sub>S</sub> in phase with V<sub>S</sub> delivers power; the quadrature part still heats the copper (I² counts both) but produces nothing.</div>
    </div>
  </div>

  <h3>Step 3 — What moves the efficiency, and what moves its peak</h3>
  <div class="card">
    <table>
      <tr><th>Factor</th><th>Effect on η at a given load</th><th>Effect on x* (load for η<sub>max</sub>)</th><th>Effect on η<sub>max</sub></th></tr>
      <tr><td>Load level x</td><td>rises steeply from zero, peaks at x*, then falls slowly as I²R grows</td><td>—</td><td>—</td></tr>
      <tr><td>Power factor cos θ</td><td>lower PF → same current, same losses, less useful output → lower η</td><td><b>none</b></td><td>lower</td></tr>
      <tr><td>Core loss (steel grade, lamination thickness, flux density)</td><td>lowers η at every load; dominates at light load</td><td>higher P<sub>core</sub> → x* moves <b>up</b></td><td>lower</td></tr>
      <tr><td>Copper loss (conductor size; temperature — R rises ≈0.4 %/°C)</td><td>lowers η mainly at heavy load</td><td>higher P<sub>Cu,fl</sub> → x* moves <b>down</b></td><td>lower</td></tr>
      <tr><td>Applied voltage ↑ (same f)</td><td>B ↑ → core loss ↑ (≈ V²), saturation near the knee</td><td>x* up</td><td>lower</td></tr>
      <tr><td>Frequency ↓ (same V)</td><td>B ↑ → core loss ↑ (see §2.11 ratings)</td><td>x* up</td><td>lower</td></tr>
    </table>
    <div class="okbox" style="margin-top:8px"><b>Design consequence.</b> A <b>distribution transformer</b> is energised 24 h but heavily loaded only a few hours, so it is built with low core loss and its peak placed at light load (x* ≈ 0.4–0.6). A <b>power transformer</b> in a substation runs near full load, so its peak is placed near x* ≈ 0.8–1.0. The designer chooses x* by choosing the ratio P<sub>core</sub>/P<sub>Cu,fl</sub>.</div>
  </div>

  <h3>Step 4 — Energy (all-day) efficiency: why the peak is placed where it is</h3>
  <p class="note">Power efficiency is an instant snapshot. Over a day the core loss is paid for all 24 h while copper loss is paid only when current flows — so the <b>all-day efficiency</b> η<sub>ad</sub> = (energy out)/(energy out + energy lost) can differ a lot from the full-load figure. Uses S, P<sub>Cu,fl</sub>, P<sub>core</sub> from the lab above.</p>
  <div class="card">
    <div class="efgrid" style="display:grid;grid-template-columns:270px 1fr;gap:16px;align-items:start">
      <div>
        <label class="ctl"><span class="lab"><span>Hours at heavy load, h<sub>1</sub></span> <span class="val" id="ad_h1_v"></span></span><input type="range" id="ad_h1" min="0" max="24" step="0.5" value="8"></label>
        <label class="ctl"><span class="lab"><span>Heavy-load level x<sub>1</sub></span> <span class="val" id="ad_x1_v"></span></span><input type="range" id="ad_x1" min="0" max="125" step="1" value="100"></label>
        <label class="ctl"><span class="lab"><span>PF during heavy load</span> <span class="val" id="ad_p1_v"></span></span><input type="range" id="ad_p1" min="0.3" max="1" step="0.01" value="0.8"></label>
        <label class="ctl"><span class="lab"><span>Light-load level x<sub>2</sub> (rest of the day)</span> <span class="val" id="ad_x2_v"></span></span><input type="range" id="ad_x2" min="0" max="125" step="1" value="25"></label>
        <label class="ctl"><span class="lab"><span>PF during light load</span> <span class="val" id="ad_p2_v"></span></span><input type="range" id="ad_p2" min="0.3" max="1" step="0.01" value="0.9"></label>
      </div>
      <div>
        <canvas id="ad_can" width="540" height="200" style="width:100%"></canvas>
        <div class="out" id="ad_out" style="font-size:12.5px"></div>
      </div>
    </div>
  </div>

  <h3>Worked example — Example 2‑5 transformer (15 kVA, 2300/230 V)</h3>
  <div class="card">
    <div class="step">① Rated secondary current I<sub>S</sub> = 15 000/230 = 65.2 A. Full-load copper loss P<sub>Cu,fl</sub> = I<sub>S</sub>²R<sub>eq,s</sub> = 65.2² × 0.0445 = <b>189 W</b>.</div>
    <div class="step">② Core loss P<sub>core</sub> = (V<sub>P</sub>/a)²/R<sub>C,s</sub> = 234.85²/1050 = <b>52.5 W</b> (treated as constant).</div>
    <div class="step">③ Full-load efficiency at 0.8 PF: P<sub>out</sub> = 15 000 × 0.8 = 12 000 W → η = 12 000/(12 000 + 189 + 52.5) = <b>98.03 %</b>.</div>
    <div class="step">④ Load for maximum efficiency: x* = √(52.5/189) = <b>0.527</b> → 7.9 kVA, I* = 34.4 A (copper loss there = 0.527² × 189 = 52.5 W = core loss ✓).</div>
    <div class="step">⑤ η<sub>max</sub> at 0.8 PF = 0.527 × 12 000/(0.527 × 12 000 + 2 × 52.5) = 6324/6429 = <b>98.37 %</b>; at unity PF the same peak load gives 7905/(7905 + 105) = <b>98.69 %</b>.</div>
    <p class="note">Set the lab sliders to x = 53 % and compare 0.8 and 1.0 PF to see both numbers.</p>
  </div>`;

  const c1=$('#ef_can1').getContext('2d'),c2=$('#ef_can2').getContext('2d'),c3=$('#ef_can3').getContext('2d'),c4=$('#ef_can4').getContext('2d'),cad=$('#ad_can').getContext('2d');
  const eP=()=>({S:+$('#ef_S').value*1000,Cu:+$('#ef_cu').value,Co:+$('#ef_co').value,pf:+$('#ef_pf').value,x:+$('#ef_x').value/100});
  const effAt=(x,pf,S,Cu,Co)=>{const Po=x*S*pf;return Po>0?Po/(Po+x*x*Cu+Co)*100:0;};
  const frame=(c,W,H,pad,xl,yl)=>{c.clearRect(0,0,W,H);c.strokeStyle='#232a49';c.lineWidth=1;c.beginPath();c.moveTo(pad.l,pad.t);c.lineTo(pad.l,H-pad.b);c.lineTo(W-pad.r,H-pad.b);c.stroke();c.fillStyle='#9aa3c4';c.font='12px system-ui';c.fillText(xl,W-pad.r-c.measureText(xl).width,H-6);c.save();c.translate(12,pad.t+c.measureText(yl).width+4);c.rotate(-Math.PI/2);c.fillText(yl,0,0);c.restore();};
  const dot=(c,x,y,col,r=4)=>{c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,7);c.fill();};
  function efUpd(){
    const p=eP(),xs=Math.sqrt(p.Co/p.Cu),emax=effAt(xs,p.pf,p.S,p.Cu,p.Co),Pout=p.x*p.S*p.pf,Pcu=p.x*p.x*p.Cu,eta=effAt(p.x,p.pf,p.S,p.Cu,p.Co);
    $('#ef_S_v').textContent=(p.S/1000)+' kVA';$('#ef_cu_v').textContent=p.Cu+' W';$('#ef_co_v').textContent=p.Co+' W';$('#ef_pf_v').textContent=fmt(p.pf,2)+' (θ = '+fmt(Math.acos(p.pf)*180/Math.PI,1)+'°)';$('#ef_x_v').textContent=Math.round(p.x*100)+' %';

    // --- graph 1: η vs load for several PFs ---

      let ymin=100;curves.forEach(([pf])=>{for(let x=0.05;x<=1.25;x+=0.05)ymin=Math.min(ymin,effAt(x,pf,p.S,p.Cu,p.Co));});ymin=Math.max(0,Math.floor(ymin/5)*5-5);

      c.setLineDash([5,4]);c.strokeStyle='#ff6b81';c.beginPath();c.moveTo(X(xs),pad.t);c.lineTo(X(xs),H-pad.b);c.stroke();c.setLineDash([]);c.fillStyle='#ff6b81';c.font='12px system-ui';c.fillText('x* = '+fmt(xs*100,0)+' % — same for every PF',X(xs)+6,pad.t+10);
      curves.forEach(([pf,col,lab],i)=>{const mine=Math.abs(pf-p.pf)<1e-9;c.strokeStyle=col;c.lineWidth=mine?3:1.6;c.beginPath();let st=false;for(let x=0.01;x<=1.25;x+=0.01){const y=Y(Math.max(ymin,effAt(x,pf,p.S,p.Cu,p.Co)));st?c.lineTo(X(x),y):(c.moveTo(X(x),y),st=true);}c.stroke();dot(c,X(xs),Y(effAt(xs,pf,p.S,p.Cu,p.Co)),col,3.5);c.fillStyle=col;c.font=mine?'bold 11px system-ui':'12px system-ui';c.fillText(lab+(mine?' ◄':''),W-pad.r-150,H-pad.b-14-i*14);});

    {const c=c2,W=270,H=230,pad={l:40,r:10,t:22,b:30};frame(c,W,H,pad,'load x (%)','W');
      const ymax=Math.max(p.Cu*1.5625,p.Co)*1.15,X=x=>pad.l+x/1.25*(W-pad.l-pad.r),Y=v=>H-pad.b-v/ymax*(H-pad.t-pad.b);

      c.strokeStyle='#ff6b81';c.beginPath();for(let x=0;x<=1.25;x+=0.02){const y=Y(x*x*p.Cu);x===0?c.moveTo(X(x),y):c.lineTo(X(x),y);}c.stroke();
      c.strokeStyle='#e8ebf7';c.lineWidth=1.5;c.beginPath();for(let x=0;x<=1.25;x+=0.02){const y=Y(x*x*p.Cu+p.Co);x===0?c.moveTo(X(x),y):c.lineTo(X(x),y);}c.stroke();

      if(p.x>0){c.strokeStyle='rgba(56,211,159,.6)';c.setLineDash([2,3]);c.beginPath();c.moveTo(X(p.x),pad.t);c.lineTo(X(p.x),H-pad.b);c.stroke();c.setLineDash([]);dot(c,X(p.x),Y(Pcu),'#38d39f',4);}
      c.font='11px system-ui';c.fillStyle='#ffcc66';c.fillText('core (const)',pad.l+4,pad.t-8);c.fillStyle='#ff6b81';c.fillText('copper ∝ x²',pad.l+74,pad.t-8);c.fillStyle='#e8ebf7';c.fillText('total',pad.l+150,pad.t-8);
    }
    // --- graph 3: η vs PF ---
    {const c=c3,W=270,H=230,pad={l:40,r:10,t:22,b:30};frame(c,W,H,pad,'power factor cos θ','η (%)');
      let ymin=100;for(let pf=0.3;pf<=1;pf+=0.05){ymin=Math.min(ymin,effAt(Math.max(p.x,0.05),pf,p.S,p.Cu,p.Co),effAt(xs,pf,p.S,p.Cu,p.Co));}ymin=Math.max(0,Math.floor(ymin/5)*5-5);
      const X=pf=>pad.l+(pf-0.3)/0.7*(W-pad.l-pad.r),Y=e=>H-pad.b-(e-ymin)/(100-ymin)*(H-pad.t-pad.b);
      [0.4,0.6,0.8,1].forEach(g=>{c.fillStyle='#9aa3c4';c.font='11px system-ui';c.fillText(g,X(g)-8,H-pad.b+12);});
      for(let g=Math.ceil(ymin/5)*5;g<=100;g+=5){const y=Y(g);c.strokeStyle='#1a1f38';c.beginPath();c.moveTo(pad.l,y);c.lineTo(W-pad.r,y);c.stroke();c.fillStyle='#9aa3c4';c.fillText(g,16,y+3);}
      c.setLineDash([4,4]);c.strokeStyle='#e8ebf7';c.lineWidth=1.5;c.beginPath();let st=false;for(let pf=0.3;pf<=1.0001;pf+=0.01){const y=Y(Math.max(ymin,effAt(xs,pf,p.S,p.Cu,p.Co)));st?c.lineTo(X(pf),y):(c.moveTo(X(pf),y),st=true);}c.stroke();c.setLineDash([]);
      if(p.x>0){c.strokeStyle='#38d39f';c.lineWidth=2.5;c.beginPath();st=false;for(let pf=0.3;pf<=1.0001;pf+=0.01){const y=Y(Math.max(ymin,effAt(p.x,pf,p.S,p.Cu,p.Co)));st?c.lineTo(X(pf),y):(c.moveTo(X(pf),y),st=true);}c.stroke();dot(c,X(p.pf),Y(Math.max(ymin,eta)),'#38d39f',5);}
      c.font='11px system-ui';c.fillStyle='#38d39f';c.fillText('η at your load',pad.l+4,pad.t-8);c.fillStyle='#e8ebf7';c.fillText('η_max (at x*) — dashed',pad.l+90,pad.t-8);
    }
    // --- graph 4: phasor — why PF matters ---
    {const c=c4,W=540,H=215,ox=50,oy=78;c.clearRect(0,0,W,H);const th=Math.acos(p.pf),L=118*Math.max(p.x,0.1);
      c.strokeStyle='#232a49';c.beginPath();c.moveTo(ox-16,oy);c.lineTo(250,oy);c.stroke();
      const arr=(x0,y0,x1,y1,col,w,dash)=>{if(dash)c.setLineDash([4,4]);c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(x0,y0);c.lineTo(x1,y1);c.stroke();c.setLineDash([]);const a=Math.atan2(y1-y0,x1-x0);c.fillStyle=col;c.beginPath();c.moveTo(x1,y1);c.lineTo(x1-8*Math.cos(a-0.45),y1-8*Math.sin(a-0.45));c.lineTo(x1-8*Math.cos(a+0.45),y1-8*Math.sin(a+0.45));c.closePath();c.fill();};
      c.font='12px system-ui';c.fillStyle='#9aa3c4';c.fillText('why the power factor matters',ox-16,16);
      arr(ox,oy,ox+180,oy,'#38d39f',3);c.fillStyle='#38d39f';c.fillText('V_S',ox+184,oy+4);
      const Ix=ox+L*Math.cos(th),Iy=oy+L*Math.sin(th);
      arr(ox,oy,Ix,Iy,'#c774e6',3);c.fillStyle='#c774e6';c.fillText('I_S',Ix+6,Iy+12);

        c.strokeStyle='#ffcc66';c.lineWidth=1.2;c.beginPath();c.arc(ox,oy,34,0,th);c.stroke();c.fillStyle='#ffcc66';c.fillText('θ',ox+38,oy+20);}

      c.fillStyle='#9aa3c4';c.font='12px system-ui';c.fillText('Fixed kW: I ∝ 1/cos θ → copper loss ∝ 1/cos²θ.',tx,138);
      c.fillText(`Same current: η = ${fmt(effAt(p.x,1,p.S,p.Cu,p.Co),2)} % at PF 1, ${fmt(eta,2)} % at PF ${fmt(p.pf,2)}.`,tx,160);
    }

  function adUpd(){
    const p=eP(),h1=+$('#ad_h1').value,x1=+$('#ad_x1').value/100,p1=+$('#ad_p1').value,x2=+$('#ad_x2').value/100,p2=+$('#ad_p2').value,h2=24-h1;

    const Eout=(h1*x1*p.S*p1+h2*x2*p.S*p2)/1000,Ecore=24*p.Co/1000,Ecu=(h1*x1*x1*p.Cu+h2*x2*x2*p.Cu)/1000,ead=Eout>0?Eout/(Eout+Ecore+Ecu)*100:0,xs=Math.sqrt(p.Co/p.Cu);
    const xavg=Math.sqrt((h1*x1*x1+h2*x2*x2)/24);
    $('#ad_out').innerHTML=`Energy out = ${h1}h×${Math.round(x1*100)}%×${p.S/1000} kVA×${fmt(p1,2)} + ${h2}h×${Math.round(x2*100)}%×${p.S/1000} kVA×${fmt(p2,2)} = <span class="k">${fmt(Eout,1)} kWh</span>\nCore-loss energy (24 h, always) = 24 × ${p.Co} W = <span class="k">${fmt(Ecore,2)} kWh</span>\nCopper-loss energy = ${h1}h×${fmt(x1*x1*p.Cu,0)} W + ${h2}h×${fmt(x2*x2*p.Cu,1)} W = <span class="k">${fmt(Ecu,2)} kWh</span>\n<b>All-day efficiency η<sub>ad</sub> = <span class="k">${fmt(ead,2)} %</span></b>   (compare: full-load power efficiency ${fmt(effAt(1,p1,p.S,p.Cu,p.Co),2)} %)\nrms load over the day ≈ <span class="k">${fmt(xavg*100,0)} %</span> — a transformer with x* near this (yours: ${fmt(xs*100,0)} %) wastes the least energy for this duty.`;

    c.fillStyle='#ffcc66';c.fillText('core '+fmt(Ecore,2)+' kWh ('+(tot>0?fmt(100*Ecore/tot,0):0)+' %)',bx,by-8);c.fillStyle='#ff6b81';c.fillText('copper '+fmt(Ecu,2)+' kWh ('+(tot>0?fmt(100*Ecu/tot,0):0)+' %)',bx+bw-200,by-8);
    c.fillStyle='#9aa3c4';c.fillText('loss split',14,by+18);
    // 24-h load profile strip
    const sy=130,sh=40;c.fillStyle='#9aa3c4';c.fillText('load profile (24 h)',14,sy+24);
    c.fillStyle='rgba(56,211,159,.55)';c.fillRect(bx,sy+sh-sh*Math.min(1,x1/1.25),bw*h1/24,sh*Math.min(1,x1/1.25));
    c.fillStyle='rgba(56,211,159,.3)';c.fillRect(bx+bw*h1/24,sy+sh-sh*Math.min(1,x2/1.25),bw*h2/24,sh*Math.min(1,x2/1.25));
    c.strokeStyle='#2a2f4a';c.strokeRect(bx,sy,bw,sh);c.fillStyle='#38d39f';c.font='12px system-ui';c.fillText(Math.round(x1*100)+' % for '+h1+' h',bx+4,sy-4);c.fillText(Math.round(x2*100)+' % for '+h2+' h',bx+bw*h1/24+4,sy+sh+14);
  }
  ['ef_S','ef_cu','ef_co','ef_pf','ef_x'].forEach(id=>$('#'+id).oninput=efUpd);

section('auto','Special Transformers','2.9 · Autotransformer',(el)=>{
  el.innerHTML=`
  <h2 class="title">The Autotransformer</h2>
  <p class="subttl">§2.9 · One connected winding — big power-rating advantage, no isolation</p>
  <div class="grid2">
    <div class="eq" style="text-align:center"><span class="frac"><span class="n">V<sub>L</sub></span><span class="d">V<sub>H</sub></span></span> = <span class="frac"><span class="n">N<sub>C</sub></span><span class="d">N<sub>SE</sub>+N<sub>C</sub></span></span><span class="tag">2‑76</span></div>
    <div class="eq" style="text-align:center"><span class="frac"><span class="n">S<sub>IO</sub></span><span class="d">S<sub>W</sub></span></span> = <span class="frac"><span class="n">N<sub>SE</sub>+N<sub>C</sub></span><span class="d">N<sub>SE</sub></span></span><span class="tag">2‑86</span></div>
  </div>
  <details class="deriv"><summary>Where the power-rating advantage comes from</summary>
    <div class="step">① Only the common winding carries transformed power; the rest passes straight through the connection.<span class="why">S<sub>W</sub> = V<sub>C</sub>I<sub>C</sub> is the winding VA; S<sub>IO</sub> is the through VA.</span></div>
    <div class="step">② S<sub>IO</sub>/S<sub>W</sub> = (N<sub>SE</sub>+N<sub>C</sub>)/N<sub>SE</sub>. Smaller series winding → bigger advantage.<span class="why">Eq.(2‑86). Great when the two voltages are close.</span></div>
    <div class="step">③ Cost: the primary–secondary electrical isolation is lost, and internal impedance drops by the same factor (can raise fault currents).</div>
  </details>
  <h3>Autotransformer explorer <span class="badge">Example 2‑7 / 2‑8</span></h3>
  <div class="card">
    <div class="grid2">
      <div>
        <label class="ctl"><span class="lab">Common turns N<sub>C</sub> <span class="val" id="a_Nc_v"></span></span><input type="range" id="a_Nc" min="10" max="500" value="120" step="5"></label>
        <label class="ctl"><span class="lab">Series turns N<sub>SE</sub> <span class="val" id="a_Nse_v"></span></span><input type="range" id="a_Nse" min="5" max="300" value="12" step="1"></label>
        <label class="ctl"><span class="lab">Winding VA rating S<sub>W</sub> (VA)</span><input type="number" id="a_Sw" value="100" step="any"></label>
        <label class="ctl"><span class="lab">Low-side voltage V<sub>L</sub> (V)</span><input type="number" id="a_Vl" value="120" step="any"></label>
        <div class="out" id="a_out"></div>
      </div>
      <div>
        <canvas id="a_can" width="400" height="240"></canvas>
        <div class="note" style="text-align:center">Through-power (S<sub>IO</sub>) vs winding-power (S<sub>W</sub>)</div>
      </div>
    </div>
    <p class="note">Ex 2‑7 (120/12): advantage 11. Ex 2‑8: reconnecting a conventional transformer as an autotransformer raises its rating by the same factor and divides its series impedance by it.</p>
  </div>`;
  const can=$('#a_can'),cx=can.getContext('2d');
  const upd=()=>{const Nc=+$('#a_Nc').value,Nse=+$('#a_Nse').value,Sw=+$('#a_Sw').value,Vl=+$('#a_Vl').value;
    $('#a_Nc_v').textContent=Nc;$('#a_Nse_v').textContent=Nse;
    const adv=(Nse+Nc)/Nse,Vh=(Nse+Nc)/Nc*Vl,Sio=Sw*adv;
    $('#a_out').innerHTML=`V<sub>H</sub> = (N<sub>SE</sub>+N<sub>C</sub>)/N<sub>C</sub> · V<sub>L</sub> = <span class="k">${fmt(Vh,1)} V</span>\nPower advantage S<sub>IO</sub>/S<sub>W</sub> = <span class="k">${fmt(adv,2)}×</span>\nThrough rating S<sub>IO</sub> = <span class="k">${fmt(Sio,0)} VA</span> (windings only ${fmt(Sw,0)} VA)`;
    // bar viz
    cx.clearRect(0,0,400,240);const maxS=Sio;
    cx.fillStyle='#5b8cff';cx.fillRect(40,40,Sio/maxS*320,50);cx.fillStyle='#9aa3c4';cx.font='12px system-ui';cx.fillText('S_IO (through power) '+fmt(Sio,0)+' VA',44,34);
    cx.fillStyle='#ff9f43';cx.fillRect(40,130,Sw/maxS*320,50);cx.fillText('S_W (in windings) '+fmt(Sw,0)+' VA',44,124);
    cx.fillStyle='#38d39f';cx.font='13px system-ui';cx.fillText(fmt(adv,1)+'× advantage',150,215);
  };
  ['a_Nc','a_Nse','a_Sw','a_Vl'].forEach(id=>$('#'+id).oninput=upd);upd();
});

  <p class="subttl">§2.10 · Connections, and two-transformer (open-Δ) schemes</p>
  <div class="card">
    <p>Any 3-φ bank = three single-phase units. Analyze <b>one transformer / per phase</b>, then apply the connection's line↔phase relations (√3 factors).</p>
    <div class="tabs" id="cn">
      <div class="t on" data-c="YY">Y–Y</div><div class="t" data-c="YD">Y–Δ</div><div class="t" data-c="DY">Δ–Y</div><div class="t" data-c="DD">Δ–Δ</div>
    </div>
    <div class="grid2">
      <div>
        <label class="ctl"><span class="lab">Per-transformer turns ratio a = N<sub>p</sub>/N<sub>s</sub> <span class="val" id="c_a_v"></span></span><input type="range" id="c_a" min="0.5" max="20" value="10" step="0.5"></label>
        <label class="ctl"><span class="lab">Primary line voltage V<sub>LP</sub> (V)</span><input type="number" id="c_V" value="13800" step="any"></label>
        <div class="out" id="c_out"></div>
      </div>
      <div><canvas id="c_can" width="380" height="240"></canvas></div>
    </div>
  </div>
  <h3>Open-Δ (V–V) — running on two transformers</h3>
  <div class="card okbox">Lose one phase of a Δ–Δ bank and it still works (the "ghost phase" voltage reappears), but the bank delivers only <b>57.7%</b> (1/√3) of the full three-phase rating — because the two remaining units exchange reactive power. Put another way: 86.6% of the two units' combined rating.</div>
  <div class="card note"><b>Y–Δ / Δ–Y</b> introduce a <b>30° phase shift</b> (secondary lags for abc sequence in the US standard) and handle harmonics/unbalance better than Y–Y. Y–Y needs a grounded neutral or a Δ tertiary to tame third harmonics. <b>Δ–Δ</b>: no phase shift, robust. <span class="badge">Ex 2‑9: Δ–Y VR ≈ 5.1%</span></div>`;
  const conns={YY:['Y–Y','a','V_LS = V_LP / a','no shift'],YD:['Y–Δ','√3·a','V_LS = V_LP/(√3a)','30° shift'],
    DY:['Δ–Y','a/√3','V_LS = √3·V_LP/a','30° shift'],DD:['Δ–Δ','a','V_LS = V_LP/a','no shift']};
  let cur='YY';
  const can=$('#c_can'),cx=can.getContext('2d');
  const upd=()=>{const a=+$('#c_a').value,V=+$('#c_V').value;$('#c_a_v').textContent=fmt(a,2);
    const [name,ratio,form,shift]=conns[cur];
    let VLS;if(cur==='YY'||cur==='DD')VLS=V/a;else if(cur==='YD')VLS=V/(Math.sqrt(3)*a);else VLS=V*Math.sqrt(3)/a;
    $('#c_out').innerHTML=`Connection: <span class="k">${name}</span>\nOverall line ratio V<sub>LP</sub>/V<sub>LS</sub> = <span class="k">${ratio}</span>\n${form}\nV<sub>LS</sub> = <span class="k">${fmt(VLS,1)} V</span>\nPhase shift: <span class="k">${shift}</span>`;
    // draw phasors: primary (blue) 3 at 120, secondary (orange) possibly shifted 30
    cx.clearRect(0,0,380,240);const ox=110,oy=120,R=70;
    function star(cx0,c,ang0,lab){cx.strokeStyle=c;cx.lineWidth=2;for(let k=0;k<3;k++){const a=ang0+k*120;cx.beginPath();cx.moveTo(cx0,oy);cx.lineTo(cx0+R*Math.cos(a*D2R),oy-R*Math.sin(a*D2R));cx.stroke();}cx.fillStyle=c;cx.font='11px system-ui';cx.fillText(lab,cx0-20,oy+95);}
    star(110,'#5b8cff',90,'primary');
    const sh=(cur==='YD'||cur==='DY')?-30:0;
    star(270,'#ff9f43',90+sh,'secondary'+(sh?' (−30°)':''));
    cx.fillStyle='#9aa3c4';cx.fillText('120° apart',70,20);
  };
  $$('#cn .t').forEach(t=>t.onclick=()=>{$$('#cn .t').forEach(x=>x.classList.toggle('on',x===t));cur=t.dataset.c;upd();});
  $('#c_a').oninput=upd;$('#c_V').oninput=upd;upd();
});

section('ratings','Special Transformers','2.11 · Ratings, V/f & Inrush',(el)=>{
  el.innerHTML=`
  <h2 class="title">Transformer Ratings — Voltage/Frequency & Inrush</h2>
  <p class="subttl">§2.11 · Why V and f are tied together; the starting current surge</p>
  <div class="eq">φ<sub>max</sub> = <span class="frac"><span class="n">V<sub>M</sub></span><span class="d">ω N<sub>p</sub></span></span> = <span class="frac"><span class="n">V<sub>M</sub></span><span class="d">2π f N<sub>p</sub></span></span> <span class="tag">(2‑101)</span></div>
  <p class="note">Peak flux ∝ V/f. To keep φ<sub>max</sub> (and magnetizing current) safe, if you drop frequency you must drop voltage in proportion — <b>derating</b>. A 60 Hz transformer on 50 Hz needs ~1/6 less voltage.</p>
  <h3>▶ V/f effect on peak flux <span class="badge">Example 2‑10</span></h3>
  <div class="card">
    <div class="grid2">
      <div>
        <label class="ctl"><span class="lab">Applied voltage (% rated) <span class="val" id="r_V_v"></span></span><input type="range" id="r_V" min="60" max="130" value="100" step="1"></label>
        <label class="ctl"><span class="lab">Frequency (Hz) <span class="val" id="r_f_v"></span></span><input type="range" id="r_f" min="40" max="70" value="60" step="1"></label>
        <div class="out" id="r_out"></div>
        <p class="note">φ<sub>max</sub> shown relative to the 100%/60 Hz design point. Above ~110% the core saturates → magnetizing current explodes (Ex 2‑10: rms mag current +60% going 60→50 Hz).</p>
      </div>
      <div><canvas id="r_can" width="420" height="240"></canvas></div>
    </div>
  </div>
  <h3>▶ Inrush current at switch-on</h3>
  <div class="card">
    <p class="note">Flux can reach <b>twice</b> steady-state if the transformer is energized as the voltage passes through zero (worst case), briefly looking like a short circuit. Energizing at the voltage peak → no offset. Drag the switch-on angle.</p>
    <div class="grid2">
      <div>
        <label class="ctl"><span class="lab">Switch-on angle θ (°) <span class="val" id="in_a_v"></span></span><input type="range" id="in_a" min="0" max="90" value="0" step="5"></label>
        <div class="out" id="in_out"></div>
      </div>
      <div><canvas id="in_can" width="420" height="240"></canvas></div>
    </div>
  </div>`;
  // V/f
  const rc=$('#r_can').getContext('2d');
  const rUpd=()=>{const V=+$('#r_V').value/100,f=+$('#r_f').value;$('#r_V_v').textContent=Math.round(V*100)+'%';$('#r_f_v').textContent=f+' Hz';
    const phi=V/(f/60);const derate=(f/60);
    $('#r_out').innerHTML=`φ<sub>max</sub> ∝ V/f = <span class="k">${fmt(phi,3)}×</span> design\nFor safe flux at ${f} Hz, keep V ≤ <span class="k">${Math.round(derate*100)}%</span>\n${phi>1.1?'⚠ core saturating — excessive magnetizing current':'ok'}`;
    // flux waveform amplitude
    const W=420,H=240,mid=H/2;rc.clearRect(0,0,W,H);rc.strokeStyle='#232a49';rc.beginPath();rc.moveTo(20,mid);rc.lineTo(W-10,mid);rc.stroke();
    // saturation band
    rc.fillStyle='rgba(255,107,129,0.12)';rc.fillRect(20,mid-100,W-30,10);rc.fillRect(20,mid+90,W-30,10);
    rc.strokeStyle=phi>1.1?'#ff6b81':'#5b8cff';rc.lineWidth=2;rc.beginPath();
    for(let x=0;x<=W-30;x++){const t=x/(W-30)*4*Math.PI;const y=mid-Math.sin(t)*phi*90;x===0?rc.moveTo(20+x,y):rc.lineTo(20+x,y);}rc.stroke();
    rc.fillStyle='#ff6b81';rc.font='11px system-ui';rc.fillText('saturation limit',W-110,mid-95);};
  ['r_V','r_f'].forEach(id=>$('#'+id).oninput=rUpd);rUpd();
  // inrush
  const ic=$('#in_can').getContext('2d');
  const inUpd=()=>{const th=+$('#in_a').value;$('#in_a_v').textContent=th+'°';
    // flux = -cos(wt+th)+cos(th) offset (starting from zero flux). peak up to 1+cos... worst at th=0 -> 2x
    const offset=Math.cos(th*D2R);const peak=1+Math.abs(offset);
    $('#in_out').innerHTML=`Flux offset = cos θ = <span class="k">${fmt(offset,3)}</span>\nPeak flux ≈ <span class="k">${fmt(peak,2)}×</span> steady state\n${th<=15?'⚠ near worst case — huge inrush current':(th>=75?'≈ no offset, minimal inrush':'partial offset')}`;
    const W=420,H=240,mid=H/2;ic.clearRect(0,0,W,H);ic.strokeStyle='#232a49';ic.beginPath();ic.moveTo(20,mid);ic.lineTo(W-10,mid);ic.stroke();
    // steady-state flux (reference) and actual offset flux
    ic.strokeStyle='#39507a';ic.lineWidth=1.5;ic.setLineDash([4,4]);ic.beginPath();
    for(let x=0;x<=W-30;x++){const wt=x/(W-30)*4*Math.PI;const y=mid-(-Math.cos(wt+th*D2R))*70;x===0?ic.moveTo(20+x,y):ic.lineTo(20+x,y);}ic.stroke();ic.setLineDash([]);
    ic.strokeStyle='#ff6b81';ic.lineWidth=2.5;ic.beginPath();
    for(let x=0;x<=W-30;x++){const wt=x/(W-30)*4*Math.PI;const flux=-Math.cos(wt+th*D2R)+offset;const y=mid-flux*70;x===0?ic.moveTo(20+x,y):ic.lineTo(20+x,y);}ic.stroke();
    ic.fillStyle='#39507a';ic.font='11px system-ui';ic.fillText('steady-state flux',24,18);ic.fillStyle='#ff6b81';ic.fillText('actual flux (offset)',150,18);};
  $('#in_a').oninput=inUpd;inUpd();
});

section('practice','Practice','★ Practice Mode (random)',(el)=>{
  el.innerHTML=`
  <h2 class="title">Practice Mode — randomized transformer problems</h2>
  <p class="subttl">Pick a topic, get fresh numbers, check your answer against the worked solution.</p>
  <div class="card">
    <div class="flex">
      <select id="pk_type" style="max-width:340px">
        <option value="turns">2.3 · Turns ratio & secondary voltage</option>
        <option value="current">2.3 · Current from turns ratio</option>
        <option value="imp">2.3 · Impedance transformation Z′=a²Z</option>
        <option value="power">2.3 · Power through ideal transformer</option>
        <option value="oc">2.5 · Open-circuit test → R_C, X_M</option>
        <option value="sc">2.5 · Short-circuit test → R_eq, X_eq</option>
        <option value="noload">2.5 · No-load current → R_C</option>
        <option value="maxeff">2.7 · Load for maximum efficiency</option>
        <option value="vr">2.6 · Voltage regulation</option>
        <option value="eff">2.7 · Efficiency</option>
        <option value="auto">2.9 · Autotransformer advantage</option>
        <option value="three">2.10 · Three-phase line ratio</option>
      </select>
      <button class="btn" id="pk_new">🎲 New problem</button>
      <span class="pill">Score: <b id="pk_score">0</b> / <b id="pk_tot">0</b></span>
    </div>
    <div id="pk_q" class="card tight" style="margin-top:12px"></div>
    <div class="inrow" style="margin-top:8px"><input type="number" id="pk_ans" placeholder="your answer" step="any"><button class="btn" id="pk_check">Check</button></div>
    <div id="pk_fb"></div><div id="pk_sol"></div>
  </div>`;
  const rnd=(a,b,s=1)=>+((Math.round((a+Math.random()*(b-a))/s)*s)).toFixed(6);
  let cur=null,score=0,tot=0;
  const G={
    turns:()=>{const Np=rnd(200,1000,50),Ns=rnd(50,500,50),Vp=rnd(120,480,10),a=Np/Ns;return{q:`N<sub>p</sub>=<b>${Np}</b>, N<sub>s</sub>=<b>${Ns}</b>, V<sub>p</sub>=<b>${Vp} V</b>. Find <b>V<sub>s</sub></b> (V).`,ans:Vp/a,unit:'V',sol:`a=Np/Ns=${fmt(a,3)}; V<sub>s</sub>=V<sub>p</sub>/a=<b>${fmt(Vp/a,2)} V</b>`};},
    current:()=>{const Np=rnd(200,1000,50),Ns=rnd(50,500,50),Is=rnd(2,40,1),a=Np/Ns;return{q:`N<sub>p</sub>=<b>${Np}</b>, N<sub>s</sub>=<b>${Ns}</b>, I<sub>s</sub>=<b>${Is} A</b>. Find <b>I<sub>p</sub></b> (A).`,ans:Is/a,unit:'A',sol:`a=${fmt(a,3)}; I<sub>p</sub>=I<sub>s</sub>/a=<b>${fmt(Is/a,3)} A</b>`};},
    imp:()=>{const a=rnd(2,15,1),Z=rnd(2,50,1);return{q:`Turns ratio a=<b>${a}</b>, load Z<sub>L</sub>=<b>${Z} Ω</b>. Find the impedance <b>Z′</b> seen at the primary.`,ans:a*a*Z,unit:'Ω',sol:`Z′=a²Z<sub>L</sub>=${a}²·${Z}=<b>${fmt(a*a*Z,1)} Ω</b>`};},
    power:()=>{const V=rnd(120,480,10),I=rnd(2,30,1),pf=rnd(0.7,1,0.05);return{q:`Ideal transformer secondary: V<sub>s</sub>=<b>${V} V</b>, I<sub>s</sub>=<b>${I} A</b>, PF=<b>${pf}</b>. Find real power <b>P</b> (=P<sub>in</sub>) in W.`,ans:V*I*pf,unit:'W',sol:`P=V<sub>s</sub>I<sub>s</sub>cosθ=${V}·${I}·${pf}=<b>${fmt(V*I*pf,1)} W</b>`};},
    oc:()=>{const V=rnd(2000,8000,100),I=rnd(0.1,0.5,0.01),P=rnd(200,600,10);const pf=P/(V*I),t=Math.acos(Math.min(1,pf)),Rc=1/((I/V)*Math.cos(t));return{q:`OC test: V<sub>OC</sub>=<b>${V} V</b>, I<sub>OC</sub>=<b>${I} A</b>, P<sub>OC</sub>=<b>${P} W</b>. Find <b>R<sub>C</sub></b> (Ω).`,ans:Rc,unit:'Ω',tol:0.02,sol:`PF=${fmt(pf,3)}, θ=${fmt(t*R2D,1)}°; R<sub>C</sub>=1/(Y<sub>E</sub>cosθ)=V<sub>OC</sub>²·? → <b>${fmt(Rc,0)} Ω</b>`};},
    sc:()=>{const V=rnd(100,500,10),I=rnd(2,8,0.5),P=rnd(150,300,10);const pf=P/(V*I),t=Math.acos(Math.min(1,pf)),Req=(V/I)*Math.cos(t);return{q:`SC test: V<sub>SC</sub>=<b>${V} V</b>, I<sub>SC</sub>=<b>${I} A</b>, P<sub>SC</sub>=<b>${P} W</b>. Find <b>R<sub>eq</sub></b> (Ω).`,ans:Req,unit:'Ω',tol:0.02,sol:`PF=${fmt(pf,3)}, Z<sub>SE</sub>=V/I=${fmt(V/I,2)} Ω; R<sub>eq</sub>=Z<sub>SE</sub>cosθ=<b>${fmt(Req,3)} Ω</b>`};},
    noload:()=>{const V=rnd(2000,8000,100),I=rnd(0.1,0.6,0.01),P=rnd(200,600,10);const cos=P/(V*I),Iw=I*cos,Rc=V/Iw;return{q:`No-load test: V=<b>${V} V</b>, I₀=<b>${I} A</b>, P<sub>core</sub>=<b>${P} W</b>. Find core-loss resistance <b>R<sub>C</sub></b> (Ω).`,ans:Rc,unit:'Ω',tol:0.02,sol:`cos φ₀=P/(V·I₀)=${fmt(cos,3)}; I<sub>w</sub>=I₀cos φ₀=${fmt(Iw,4)} A; R<sub>C</sub>=V/I<sub>w</sub>=<b>${fmt(Rc,0)} Ω</b>`};},
    maxeff:()=>{const Cu=rnd(100,500,10),Co=rnd(30,250,10);const x=Math.sqrt(Co/Cu);return{q:`Full-load copper loss=<b>${Cu} W</b>, core loss=<b>${Co} W</b>. At what <b>fraction of full load</b> is efficiency maximum?`,ans:x,unit:'× full load',tol:0.02,sol:`Max η when P<sub>Cu</sub>=P<sub>core</sub>: x*=√(P<sub>core</sub>/P<sub>Cu,fl</sub>)=√(${Co}/${Cu})=<b>${fmt(x,3)}</b> (${fmt(x*100,1)}% load)`};},
    vr:()=>{const Vs=rnd(120,480,10),R=rnd(0.02,0.15,0.01),X=rnd(0.03,0.2,0.01),I=rnd(20,80,5),ang=-36.87;const Vp=cAbs(cAdd(C(Vs,0),cMul(C(R,X),cPolar(I,ang))));return{q:`V<sub>S</sub>=<b>${Vs} V</b>, I<sub>S</sub>=<b>${I} A</b> at 0.8 PF lagging, R<sub>eq</sub>=<b>${R} Ω</b>, X<sub>eq</sub>=<b>${X} Ω</b>. Find <b>VR</b> (%).`,ans:(Vp-Vs)/Vs*100,unit:'%',tol:0.05,sol:`V<sub>P</sub>/a=V<sub>S</sub>+(R+jX)I=${fmt(Vp,2)} V; VR=(${fmt(Vp,2)}−${Vs})/${Vs}·100=<b>${fmt((Vp-Vs)/Vs*100,2)}%</b>`};},
    eff:()=>{const Pout=rnd(5000,20000,500),Pcu=rnd(80,300,10),Pc=rnd(30,120,5);return{q:`P<sub>out</sub>=<b>${Pout} W</b>, P<sub>Cu</sub>=<b>${Pcu} W</b>, P<sub>core</sub>=<b>${Pc} W</b>. Find <b>efficiency</b> (%).`,ans:Pout/(Pout+Pcu+Pc)*100,unit:'%',tol:0.01,sol:`η=P<sub>out</sub>/(P<sub>out</sub>+P<sub>Cu</sub>+P<sub>core</sub>)=${Pout}/${Pout+Pcu+Pc}·100=<b>${fmt(Pout/(Pout+Pcu+Pc)*100,2)}%</b>`};},
    auto:()=>{const Nc=rnd(80,300,10),Nse=rnd(10,60,2);return{q:`Autotransformer: N<sub>C</sub>=<b>${Nc}</b>, N<sub>SE</sub>=<b>${Nse}</b>. Find the power-rating <b>advantage</b> S<sub>IO</sub>/S<sub>W</sub>.`,ans:(Nse+Nc)/Nse,unit:'×',tol:0.01,sol:`(N<sub>SE</sub>+N<sub>C</sub>)/N<sub>SE</sub>=(${Nse}+${Nc})/${Nse}=<b>${fmt((Nse+Nc)/Nse,2)}×</b>`};},
    three:()=>{const a=rnd(2,15,1),V=rnd(4000,34500,100),type=['YY','YD','DY'][Math.floor(Math.random()*3)];const names={YY:'Y–Y',YD:'Y–Δ',DY:'Δ–Y'};let VLS;if(type==='YY')VLS=V/a;else if(type==='YD')VLS=V/(Math.sqrt(3)*a);else VLS=V*Math.sqrt(3)/a;return{q:`A <b>${names[type]}</b> bank, per-transformer turns ratio a=<b>${a}</b>, primary line V<sub>LP</sub>=<b>${V} V</b>. Find secondary line voltage <b>V<sub>LS</sub></b> (V).`,ans:VLS,unit:'V',tol:0.02,sol:`${names[type]}: V<sub>LS</sub>=${type==='YY'?'V/a':type==='YD'?'V/(√3a)':'√3V/a'}=<b>${fmt(VLS,1)} V</b>`};}
  };
  function neu(){cur=G[$('#pk_type').value]();$('#pk_q').innerHTML=cur.q;$('#pk_ans').value='';$('#pk_fb').innerHTML='';$('#pk_sol').innerHTML='';}
  function check(){if(!cur||$('#pk_ans').value==='')return;const g=+$('#pk_ans').value,tol=cur.tol||0.02,ok=Math.abs(g-cur.ans)<=Math.abs(cur.ans)*tol+1e-9;
    tot++;if(ok)score++;$('#pk_score').textContent=score;$('#pk_tot').textContent=tot;
    $('#pk_fb').innerHTML=ok?`<div class="okbox">✅ Correct — ≈ <b>${fmt(cur.ans)} ${cur.unit}</b></div>`:`<div class="badbox">❌ You entered ${fmt(g)}; answer is <b>${fmt(cur.ans)} ${cur.unit}</b></div>`;
    $('#pk_sol').innerHTML=`<details open><summary>Worked solution</summary><div class="step">${cur.sol}</div></details>`;}
  $('#pk_new').onclick=neu;$('#pk_check').onclick=check;$('#pk_type').onchange=neu;
  $('#pk_ans').addEventListener('keydown',e=>{if(e.key==='Enter')check();});neu();
});

section('summary','Practice','2.13 · Summary & Quiz',(el)=>{

  <h2 class="title">Summary & Self-Test</h2>
  <p class="subttl">§2.13</p>
  <div class="card"><table>

  const QZ=[
    ['If a transformer steps voltage down by 2, the current is…',['halved','doubled','unchanged','quadrupled'],1],
    ['An ideal transformer conserves…',['voltage','current','apparent power','turns'],2],
    ['Impedance referred through a transformer scales by…',['a','1/a','a²','√a'],2],
    ['The open-circuit test primarily measures…',['copper losses','core (excitation) branch','turns ratio','leakage only'],1],
    ['The short-circuit test primarily measures…',['R_eq & X_eq (series)','R_C & X_M','turns ratio','magnetizing current'],0],
    ['A lagging (inductive) load gives a voltage regulation that is…',['negative','zero','positive','undefined'],2],
    ['Maximum transformer efficiency occurs when…',['copper loss = core loss','load is maximum','PF = 1','core loss = 0'],0],
    ['To refer a secondary impedance to the primary, multiply by…',['a','1/a','a²','1/a²'],2],
    ['An autotransformer’s main disadvantage is…',['high cost','loss of electrical isolation','low efficiency','large size'],1],
    ['Open-Δ delivers what fraction of full 3-φ rating?',['66.7%','86.6%','57.7%','50%'],2],
    ['Peak core flux is proportional to…',['V·f','V/f','f/V','V only'],1],
    ['Worst-case inrush occurs when switched on at voltage…',['peak','zero crossing','45°','any angle'],1],
    ['A current transformer secondary must never be…',['shorted','loaded','grounded','open-circuited'],3],
  ];
  $('#quiz').innerHTML=QZ.map((q,i)=>`<div class="q"><b>${i+1}. ${q[0]}</b>${q[1].map((o,j)=>`<span class="opt" data-q="${i}" data-o="${j}">${o}</span>`).join('')}</div>`).join('')+`<div class="out" id="qscore">Score: 0 / ${QZ.length}</div>`;
  let ans={},sc=0;
  $$('#quiz .opt').forEach(o=>o.onclick=()=>{const q=+o.dataset.q,j=+o.dataset.o;if(ans[q]!==undefined)return;ans[q]=j;const c=QZ[q][2];
    $$(`#quiz .opt[data-q="${q}"]`).forEach(x=>{if(+x.dataset.o===c)x.classList.add('correct');});if(j===c)sc++;else o.classList.add('wrong');
    $('#qscore').textContent=`Score: ${sc} / ${QZ.length}`;});
});

/* ================= build nav + routing ================= */
const main=$('#main'),nav=$('#nav');
function render(id){
  const s=SECTIONS.find(x=>x.id===id);if(!s)return;
  let el=$('#sec-'+id);
  if(!el){el=document.createElement('div');el.className='sec';el.id='sec-'+id;main.appendChild(el);s.builder(el);}
  $$('.sec').forEach(x=>x.classList.remove('on'));el.classList.add('on');
  $$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));
  window.scrollTo(0,0);location.hash=id;
}
function go(id){render(id);}
let lastGrp=null;
SECTIONS.forEach(s=>{
  if(s.group!==lastGrp){const g=document.createElement('div');g.className='grp';g.textContent=s.group;nav.appendChild(g);lastGrp=s.group;}
  const b=document.createElement('button');b.textContent=s.label;b.dataset.id=s.id;b.onclick=()=>go(s.id);nav.appendChild(b);
});
render((location.hash||'#intro').slice(1)||'intro');
</script>


<!-- EMF Topic-Detail Navigation Extension -->
<script id="emf-topic-nav-script">
(function(){
  var chIdx = 2;
  var chCode = "CHAPTER 02";
  var chTitle = "Chapter 2: Transformers";
  var chPageUrl = "../chapter-pages/chapter" + chIdx + ".html";

  // Navigation Styling with Full Mobile Responsiveness (1440px -> 360px)
  var style = document.createElement('style');
  style.id = 'emf-nav-styles';
  style.textContent = `
    /* Prevent horizontal page overflow on mobile viewports */
    html, body {
      max-width: 100%;
      overflow-x: hidden;

      max-width: 100%;
      box-sizing: border-box;

    }

    .emf-topic-header {
      display: flex;

    .emf-crumbs .sep {

      opacity: 0.5;
    }
    .emf-crumbs .curr {
      color: var(--ink, #e8ebf7);
      font-weight: 600;
    }
    .emf-btn-next-top {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--acc, #5b8cff);
      color: #ffffff !important;
      padding: 7px 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      border: 0;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.15s, transform 0.15s;
    }
    .emf-btn-next-top:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .emf-topic-footer-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid var(--line, #2a2f4a);
      flex-wrap: wrap;
    }
    .emf-nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--panel2, #1e2237);
      color: var(--ink, #e8ebf7);
      border: 1px solid var(--line, #2a2f4a);
      border-radius: 9px;
      padding: 11px 18px;
      cursor: pointer;
      font: 600 13.5px system-ui, sans-serif;
      text-decoration: none;
      transition: all 0.15s ease;
      min-height: 42px;
    }
    .emf-nav-btn:hover {
      background: var(--acc, #5b8cff);
      color: #ffffff;
      border-color: var(--acc, #5b8cff);
      transform: translateY(-1px);
    }
    .emf-nav-btn.disabled {
      opacity: 0.35;
      cursor: not-allowed;
      pointer-events: none;
    }
    .emf-overview-link {
      color: var(--muted, #9aa3c4);
      font-size: 13.5px;
      font-weight: 600;
      text-decoration: none;
      padding: 6px 10px;
    }
    .emf-overview-link:hover {
      color: var(--acc, #5b8cff);
      text-decoration: underline;
    }

    .emf-side-back {
      padding: 12px 14px 6px;
    }
    .emf-side-back a {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--acc, #5b8cff);
      font-size: 12.5px;
      font-weight: 600;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 8px;
      background: var(--panel2, #1e2237);
      border: 1px solid var(--line, #2a2f4a);
      transition: all 0.15s ease;
    }
    .emf-side-back a:hover {
      background: var(--acc, #5b8cff);
      color: #ffffff;
    }

    /* Mobile Viewports (<= 640px, 390px, 360px) */
    @media (max-width: 640px) {
      .emf-topic-header {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
        padding: 12px 14px;
      }
      .emf-btn-next-top {
        width: 100%;
        justify-content: center;
      }
      .emf-topic-footer-nav {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
        margin-top: 36px;
      }
      .emf-nav-btn {
        width: 100%;
        justify-content: center;
        text-align: center;
        white-space: normal;
        word-break: break-word;
        font-size: 13px;
        padding: 10px 14px;
      }
      .emf-overview-link {
        text-align: center;
        width: 100%;
      }
      .main {
        padding: 14px 12px 60px !important;
      }
    }
  `;
  if (!document.getElementById('emf-nav-styles')) {
    document.head.appendChild(style);
  }

  // Sidebar Back Link
  var brand = document.querySelector('.side .brand');
  if (brand && !document.querySelector('.emf-side-back')) {
    var backBox = document.createElement('div');
    backBox.className = 'emf-side-back';
    backBox.innerHTML = '<a href="' + chPageUrl + '">← Back to Overview</a>';
    brand.parentNode.insertBefore(backBox, brand.nextSibling);
  }

  var mainEl = document.getElementById('main');

  function updateNavigation(activeId) {
    if (!window.SECTIONS || !mainEl) return;
    var idx = -1;
    for (var k = 0; k < SECTIONS.length; k++) {
      if (SECTIONS[k].id === activeId) { idx = k; break; }
    }
    if (idx === -1) idx = 0;

    var curSec = SECTIONS[idx];
    var prevSec = idx > 0 ? SECTIONS[idx - 1] : null;
    var nextSec = idx < SECTIONS.length - 1 ? SECTIONS[idx + 1] : null;

    // 1. Top bar
    var topBar = document.getElementById('emf-top-bar');
    if (!topBar) {
      topBar = document.createElement('div');
      topBar.id = 'emf-top-bar';
      topBar.className = 'emf-topic-header';
      mainEl.insertBefore(topBar, mainEl.firstChild);
    }
    var topNextBtn = nextSec
      ? '<button type="button" class="emf-btn-next-top" id="emf-top-next">Next Topic →</button>'
      : '<a href="' + chPageUrl + '" class="emf-btn-next-top">Chapter Overview →</a>';

    topBar.innerHTML =
      '<div class="emf-crumbs">' +
        '<a href="../index.html">Home</a><span class="sep">›</span>' +
        '<a href="' + chPageUrl + '">' + chTitle + '</a><span class="sep">›</span>' +
        '<span class="curr">' + curSec.label + '</span>' +
      '</div>' +
      '<div>' + topNextBtn + '</div>';

    var btnTopNext = document.getElementById('emf-top-next');
    if (btnTopNext && nextSec) {
      btnTopNext.onclick = function() { if (typeof render === 'function') render(nextSec.id); };
    }

    // 2. Bottom bar
    var bottomBar = document.getElementById('emf-bottom-bar');
    if (!bottomBar) {
      bottomBar = document.createElement('div');
      bottomBar.id = 'emf-bottom-bar';
      bottomBar.className = 'emf-topic-footer-nav';
      mainEl.appendChild(bottomBar);
    }

    var prevHtml = prevSec
      ? '<button type="button" class="emf-nav-btn" id="emf-bot-prev">← Previous: ' + prevSec.label + '</button>'
      : '<span class="emf-nav-btn disabled">← First Topic</span>';

    var nextHtml = nextSec
      ? '<button type="button" class="emf-nav-btn" id="emf-bot-next">Next: ' + nextSec.label + ' →</button>'
      : '<a href="' + chPageUrl + '" class="emf-nav-btn">Complete Chapter Overview →</a>';

    bottomBar.innerHTML =
      '<div>' + prevHtml + '</div>' +
      '<a href="' + chPageUrl + '" class="emf-overview-link">Back to Chapter Overview</a>' +
      '<div>' + nextHtml + '</div>';

    var btnBotPrev = document.getElementById('emf-bot-prev');
    if (btnBotPrev && prevSec) {
      btnBotPrev.onclick = function() { if (typeof render === 'function') render(prevSec.id); };
    }
    var btnBotNext = document.getElementById('emf-bot-next');
    if (btnBotNext && nextSec) {
      btnBotNext.onclick = function() { if (typeof render === 'function') render(nextSec.id); };
    }
  }

  // Hook render
  var origRender = window.render;
  if (typeof origRender === 'function') {
    window.render = function(id) {
      origRender(id);
      updateNavigation(id);
    };
  }

  // Hashchange listener for direct URL changes and browser back/forward
  window.addEventListener('hashchange', function() {
    var raw = (location.hash || '').slice(1);
    if (raw && window.SECTIONS) {
      var found = SECTIONS.some(function(s) { return s.id === raw; });
      if (found && typeof render === 'function') {
        render(raw);
      }
    }
  });

  // Initial update
  var initHash = (location.hash || '').slice(1);
  if (initHash && window.SECTIONS && SECTIONS.some(function(s) { return s.id === initHash; })) {
    updateNavigation(initHash);
  } else if (window.SECTIONS && SECTIONS.length > 0) {
    updateNavigation(SECTIONS[0].id);
  }
})();
</script>
