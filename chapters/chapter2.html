<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMF Ch.2 — Transformers (Interactive)</title>
<style>
:root{
  --bg:#0f1220; --panel:#171a2b; --panel2:#1e2237; --ink:#e8ebf7; --muted:#9aa3c4;
  --acc:#5b8cff; --acc2:#38d39f; --warn:#ffcc66; --bad:#ff6b81; --line:#2a2f4a;
  --chip:#242a44; --good:#38d39f; --p:#5b8cff; --s:#ff9f43;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 "Segoe UI",system-ui,Arial,sans-serif}
a{color:var(--acc)}
.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{padding:18px 18px 8px}
.brand h1{font-size:16px;margin:0}
.brand p{margin:4px 0 0;color:var(--muted);font-size:12px}
.brand a{font-size:12px}
.nav{padding:8px;flex:1}
.credit{border-top:1px solid var(--line);padding:12px 18px;font-size:12px;color:var(--muted)}
.credit b{color:var(--ink);font-weight:600}
.credit a{color:var(--acc)}
.nav button{display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--ink);
  padding:9px 12px;border-radius:9px;cursor:pointer;font-size:13.5px}
.nav button:hover{background:var(--panel2)}
.nav button.active{background:linear-gradient(90deg,var(--acc),#3a6cff);color:#fff;font-weight:600}
.nav .grp{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:12px 12px 4px}
.main{padding:26px 34px 80px;max-width:1040px}
.sec{display:none;animation:fade .25s ease}
.sec.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2.title{font-size:24px;margin:0 0 4px}
.subttl{color:var(--muted);margin:0 0 18px}
h3{margin:26px 0 8px;font-size:18px;border-left:3px solid var(--acc);padding-left:10px}
h4{margin:18px 0 6px;font-size:15px;color:var(--acc2)}
p{margin:8px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:14px 0}
.card.tight{padding:12px 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:860px){.app{grid-template-columns:1fr}.side{position:static;height:auto}.grid2,.grid3{grid-template-columns:1fr}.main{padding:18px}}
.eq{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0;
  font-family:"Cambria Math","Times New Roman",Georgia,serif;font-size:18px;overflow-x:auto;text-align:center}
.eq .tag{float:right;color:var(--muted);font-size:12px;font-family:system-ui}
.frac{display:inline-block;vertical-align:middle;text-align:center;margin:0 3px}
.frac .n{display:block;border-bottom:1.5px solid currentColor;padding:0 6px}
.frac .d{display:block;padding:0 6px}
.eq i,.m i,.dq i{font-style:italic;font-family:"Cambria Math","Times New Roman",Georgia,serif}
.m{font-family:"Cambria Math","Times New Roman",Georgia,serif;font-size:17px;white-space:nowrap}
.dq{display:block;text-align:center;font-family:"Cambria Math","Times New Roman",Georgia,serif;font-size:19px;margin:8px 0 6px;line-height:1.35;color:var(--ink)}
.dq .frac .n,.dq .frac .d{padding:0 8px}
.sqrt{display:inline-block;vertical-align:middle;white-space:nowrap}
.sqrt::before{content:"√";font-size:1.35em;vertical-align:top;line-height:.9;margin-right:-1px}
.sqrt .rad{display:inline-block;border-top:1.5px solid currentColor;padding:2px 5px 0 4px;vertical-align:middle}
.sqrt.tall{display:inline-flex;align-items:stretch}
.sqrt.tall::before{font-size:2.6em;line-height:.62;align-self:flex-end;margin-right:-2px}
.sqrt.tall .rad{padding-top:4px}
.step{line-height:1.65}
.vec{font-weight:700}
sub,sup{font-size:.72em}
label.ctl{display:block;margin:10px 0}
label.ctl .lab{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:4px}
label.ctl .val{color:var(--acc2);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--acc)}
input[type=number],input[type=text],select{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
  border-radius:8px;padding:7px 9px;font-size:14px;width:100%}
.inrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.btn{background:linear-gradient(90deg,var(--acc),#3a6cff);color:#fff;border:0;border-radius:9px;padding:9px 14px;cursor:pointer;font-size:14px;font-weight:600}
.btn.ghost{background:var(--chip);color:var(--ink);font-weight:500}
.btn.warn{background:linear-gradient(90deg,#ff9f43,#ff6b81)}
.btn:active{transform:translateY(1px)}
.out{background:#0c1a14;border:1px solid #1f5c45;border-radius:10px;padding:12px 14px;margin-top:12px;
  font-variant-numeric:tabular-nums;white-space:pre-wrap;font-size:14px}
.out .k{color:var(--acc2);font-weight:600}
.pill{display:inline-block;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--muted);margin:2px 4px 2px 0}
details{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:10px 0}
details summary{cursor:pointer;color:var(--acc);font-weight:600}
.deriv{background:#14182b;border:1px solid #2c3557}
.deriv summary{color:var(--warn)}
.step{margin:9px 0;padding:8px 12px;border-left:2px solid var(--acc);background:#12162a;border-radius:0 8px 8px 0}
.step .why{color:var(--muted);font-size:12.5px;display:block;margin-top:2px}
canvas{max-width:100%;background:#0b0e1c;border:1px solid var(--line);border-radius:10px}
svg{max-width:100%}
table{border-collapse:collapse;width:100%;margin:10px 0;font-size:13.5px}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:center}
th{background:var(--panel2);color:var(--muted)}
.note{color:var(--muted);font-size:13px}
.flex{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tabs .t{background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}
.tabs .t.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.warnbox{background:#221a0c;border:1px solid #6b5320;border-radius:10px;padding:10px 14px;color:#ffe6a8;font-size:13.5px}
.okbox{background:#0c1a14;border:1px solid #1f5c45;border-radius:10px;padding:10px 14px;color:#bff0dc;font-size:13.5px}
.badbox{background:#1a0c10;border:1px solid #6b2530;border-radius:10px;padding:10px 14px;color:#ffc9d2;font-size:13.5px}
.gauge{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:center}
.gauge .g-l{color:var(--muted);font-size:12px}
.gauge .g-v{font-size:19px;font-weight:700;color:var(--acc2);font-variant-numeric:tabular-nums}
.quiz .q{margin:10px 0}
.quiz .opt{display:block;margin:5px 0;padding:8px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;cursor:pointer}
.quiz .opt:hover{border-color:var(--acc)}
.quiz .opt.correct{border-color:var(--good);background:#0c1a14}
.quiz .opt.wrong{border-color:var(--bad);background:#1a0c10}
.bar{height:22px;border-radius:5px;background:linear-gradient(90deg,var(--acc),#3a6cff);margin:3px 0;transition:width .15s}
.bar.s{background:linear-gradient(90deg,#ff9f43,#ff6b81)}
.badge{font-size:11px;background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--muted)}

<script>
/* high-DPI canvases: every 2-D canvas is rendered at 2× device resolution and shown at its CSS size */
(function(){const P=HTMLCanvasElement.prototype,orig=P.getContext,K=Math.min(4,Math.max(2,(window.devicePixelRatio||1)*1.5));
  P.getContext=function(type,...a){const ctx=orig.call(this,type,...a);if(type!=='2d'||!ctx||this.dataset.hd)return ctx;
    const w=this.width,h=this.height;this.dataset.hd='1';if(!this.style.width)this.style.width=w+'px';this.style.maxWidth='100%';this.style.height='auto';
    this.width=w*K;this.height=h*K;ctx.scale(K,K);return ctx;};})();
/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const fmt=(x,d=4)=>{
  if(x===null||x===undefined||!isFinite(x))return '—';
  if(x!==0 && (Math.abs(x)<1e-3||Math.abs(x)>=1e5)) return x.toExponential(Math.max(0,d-1));
  return (+x.toFixed(d)).toString();
};
const D2R=Math.PI/180, R2D=180/Math.PI;
/* complex */
const C=(re,im=0)=>({re,im});
const cAdd=(a,b)=>C(a.re+b.re,a.im+b.im);
const cSub=(a,b)=>C(a.re-b.re,a.im-b.im);
const cMul=(a,b)=>C(a.re*b.re-a.im*b.im,a.re*b.im+a.im*b.re);
const cDiv=(a,b)=>{const d=b.re*b.re+b.im*b.im;return C((a.re*b.re+a.im*b.im)/d,(a.im*b.re-a.re*b.im)/d);};
const cAbs=a=>Math.hypot(a.re,a.im);
const cAng=a=>Math.atan2(a.im,a.re)*R2D;
const cPolar=(m,deg)=>C(m*Math.cos(deg*D2R),m*Math.sin(deg*D2R));

/* schematic symbol builders */
function resH(x1,x2,y,c='#ff6b81',lab='',ly){const w=x2-x1,z=x1+w*0.22,zw=w*0.56,n=6,seg=zw/n,a=7;let p=`M ${x1} ${y} H ${z}`;for(let i=1;i<n;i++)p+=` L ${z+seg*(i-0.5)} ${i%2?y-a:y+a}`;p+=` L ${z+zw} ${y} H ${x2}`;return `<path d="${p}" fill="none" stroke="${c}" stroke-width="2"/>`+(lab?`<text x="${(x1+x2)/2}" y="${ly||y-11}" fill="${c}" font-size="11" text-anchor="middle">${lab}</text>`:'');}
function indH(x1,x2,y,c='#ffcc66',lab='',ly){const w=x2-x1,z=x1+w*0.2,bw=w*0.6,n=4,r=bw/(2*n);let p=`M ${x1} ${y} H ${z}`;for(let i=0;i<n;i++)p+=` A ${r} ${r} 0 0 1 ${z+2*r*(i+1)} ${y}`;p+=` H ${x2}`;return `<path d="${p}" fill="none" stroke="${c}" stroke-width="2"/>`+(lab?`<text x="${(x1+x2)/2}" y="${ly||y-11}" fill="${c}" font-size="11" text-anchor="middle">${lab}</text>`:'');}
function indV(x,y1,y2,c='#5b8cff',lab='',lx){const h=y2-y1,z=y1+h*0.2,bw=h*0.6,n=4,r=bw/(2*n);let p=`M ${x} ${y1} V ${z}`;for(let i=0;i<n;i++)p+=` A ${r} ${r} 0 0 1 ${x} ${z+2*r*(i+1)}`;p+=` V ${y2}`;return `<path d="${p}" fill="none" stroke="${c}" stroke-width="2"/>`+(lab?`<text x="${lx||x-10}" y="${(y1+y2)/2}" fill="${c}" font-size="11" text-anchor="${lx?'start':'end'}">${lab}</text>`:'');}
function resV(x,y1,y2,c='#ff6b81',lab='',lx){const h=y2-y1,z=y1+h*0.22,zw=h*0.56,n=6,seg=zw/n,a=7;let p=`M ${x} ${y1} V ${z}`;for(let i=1;i<n;i++)p+=` L ${i%2?x-a:x+a} ${z+seg*(i-0.5)}`;p+=` L ${x} ${z+zw} V ${y2}`;return `<path d="${p}" fill="none" stroke="${c}" stroke-width="2"/>`+(lab?`<text x="${lx||x-10}" y="${(y1+y2)/2}" fill="${c}" font-size="11" text-anchor="${lx?'start':'end'}">${lab}</text>`:'');}
const SECTIONS=[];
function section(id,group,label,builder){SECTIONS.push({id,group,label,builder});}

/* small canvas axis helper */
function axes(ctx,W,H,pad,xlab,ylab){
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle='#232a49';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(pad.l,pad.t);ctx.lineTo(pad.l,H-pad.b);ctx.lineTo(W-pad.r,H-pad.b);ctx.stroke();
  ctx.fillStyle='#9aa3c4';ctx.font='11px system-ui';
  if(xlab)ctx.fillText(xlab,W-pad.r-ctx.measureText(xlab).width,H-6);
  if(ylab){ctx.save();ctx.translate(12,pad.t+10);ctx.rotate(-Math.PI/2);ctx.fillText(ylab,0,0);ctx.restore();}
}

section('intro','Foundations','2.1–2.2 · Intro & Construction',(el)=>{
  el.innerHTML=`
  <h2 class="title">Transformers — Introduction & Construction</h2>
  <p class="subttl">§2.1 Why transformers matter · §2.2 Types and construction</p>
  <div class="card">
    <p>A <b>transformer</b> changes AC electric power at one voltage level to AC power at another level, at the <b>same frequency</b>, through a magnetic field — two (or more) coils on a common ferromagnetic core, coupled only by the shared flux.</p>
    <div class="flex">
      <span class="pill">Primary = input winding (from source)</span>
      <span class="pill">Secondary = output winding (to load)</span>
      <span class="pill">Tertiary = 3rd winding</span>
    </div>
  </div>
  <h3>Why they changed the world — the transmission-loss argument</h3>
  <div class="card">
    <p>Line loss = I²R. Step voltage <b>up</b> by a factor and current drops by the same factor, so loss falls by the <b>square</b>. Drag the transmission voltage and watch losses collapse (this is exactly the point of Example 2‑1).</p>
    <label class="ctl"><span class="lab">Transmission step-up factor <span class="val" id="i_a_v"></span></span><input type="range" id="i_a" min="1" max="30" value="1" step="1"></label>
    <div class="grid2">
      <div class="out" id="i_out"></div>
      <div><canvas id="i_can" width="420" height="220"></canvas></div>
    </div>
    <p class="note">Fixed: 10 kW load, base line current 100 A at 1× voltage, line R = 0.5 Ω/conductor pair.</p>
  </div>
  <h3>Two core constructions</h3>
  <div class="grid2">
    <div class="card">
      <b>Core form</b> — windings on two sides of a rectangular core.
      <svg viewBox="0 0 240 170" width="100%">
        <rect x="60" y="20" width="120" height="130" rx="6" fill="none" stroke="#5b8cff" stroke-width="16"/>
        <g stroke="#38d39f" stroke-width="3">${Array.from({length:6},(_,k)=>`<line x1="46" y1="${40+k*16}" x2="82" y2="${40+k*16}"/>`).join('')}</g>
        <g stroke="#ff9f43" stroke-width="3">${Array.from({length:6},(_,k)=>`<line x1="158" y1="${40+k*16}" x2="194" y2="${40+k*16}"/>`).join('')}</g>
        <text x="40" y="16" fill="#38d39f" font-size="11">primary</text><text x="150" y="16" fill="#ff9f43" font-size="11">secondary</text>
      </svg>
    </div>
    <div class="card">
      <b>Shell form</b> — 3-legged core, both windings on the centre leg (less leakage).
      <svg viewBox="0 0 240 170" width="100%">
        <rect x="30" y="20" width="180" height="130" rx="6" fill="none" stroke="#5b8cff" stroke-width="14"/>
        <line x1="120" y1="27" x2="120" y2="143" stroke="#5b8cff" stroke-width="16"/>
        <g stroke="#38d39f" stroke-width="3">${Array.from({length:5},(_,k)=>`<line x1="96" y1="${48+k*15}" x2="144" y2="${48+k*15}"/>`).join('')}</g>
        <text x="150" y="60" fill="#38d39f" font-size="11">both windings</text>
      </svg>
    </div>
  </div>
  <div class="card tight note">Cores are laminated to cut eddy currents. Low-voltage winding is wound innermost (easier insulation, less leakage). Names by use: <b>unit</b> (generator step-up), <b>substation</b> (step-down to distribution), <b>distribution</b> (final step-down). Special: <b>potential</b> & <b>current</b> transformers (instrument sampling).</div>`;
  const can=$('#i_can'),cx=can.getContext('2d');
  const upd=()=>{const a=+$('#i_a').value;$('#i_a_v').textContent=a+'×';
    const I=100/a, loss=I*I*0.5, loss1=100*100*0.5;
    $('#i_out').innerHTML=`Line current = 100/${a} = <span class="k">${fmt(I,2)} A</span>\nLine loss = I²R = <span class="k">${fmt(loss,1)} W</span>\nvs ${fmt(loss1)} W at 1× → <span class="k">${fmt(loss1/loss,1)}×</span> less loss`;
    // bar chart of loss vs factor
    axes(cx,420,220,{l:40,r:10,t:14,b:26},'step-up ×','loss (W)');
    const maxL=loss1;
    cx.strokeStyle='#ff6b81';cx.lineWidth=2.5;cx.beginPath();
    for(let f=1;f<=30;f+=0.5){const x=40+(f-1)/29*(420-50),L=(100/f)**2*0.5,y=(220-26)-L/maxL*(220-40);f===1?cx.moveTo(x,y):cx.lineTo(x,y);}
    cx.stroke();
    const x=40+(a-1)/29*(420-50),y=(220-26)-loss/maxL*(220-40);cx.fillStyle='#38d39f';cx.beginPath();cx.arc(x,y,4,0,7);cx.fill();
    cx.fillStyle='#9aa3c4';cx.fillText('loss ∝ 1/×²',260,40);};
  $('#i_a').oninput=upd;upd();
});

=================================================================== */
section('ideal','Ideal Transformer','2.3 · The Ideal Transformer',(el)=>{
  el.innerHTML=`
  <h2 class="title">The Ideal Transformer</h2>
  <p class="subttl">§2.3 · Turns ratio, power conservation, impedance transformation, dot convention</p>
  <div class="grid3">
    <div class="eq" style="text-align:center"><span class="frac"><span class="n">v<sub>p</sub></span><span class="d">v<sub>s</sub></span></span> = <span class="frac"><span class="n">N<sub>p</sub></span><span class="d">N<sub>s</sub></span></span> = a<span class="tag">2‑1,2‑2</span></div>
    <div class="eq" style="text-align:center"><span class="frac"><span class="n">i<sub>p</sub></span><span class="d">i<sub>s</sub></span></span> = <span class="frac"><span class="n">1</span><span class="d">a</span></span><span class="tag">2‑3</span></div>
    <div class="eq" style="text-align:center">Z′<sub>L</sub> = a²Z<sub>L</sub><span class="tag">2‑15</span></div>
  </div>
  <details class="deriv"><summary>Derive P<sub>in</sub> = P<sub>out</sub> and Z′ = a²Z</summary>
    <div class="step">① Power out: P<sub>out</sub> = V<sub>s</sub>I<sub>s</sub>cos θ.<span class="why">θ is unchanged by the transformer (angles preserved).</span></div>
    <div class="step">② Substitute V<sub>s</sub>=V<sub>p</sub>/a and I<sub>s</sub>=aI<sub>p</sub>: P<sub>out</sub> = (V<sub>p</sub>/a)(aI<sub>p</sub>)cos θ = V<sub>p</sub>I<sub>p</sub>cos θ = P<sub>in</sub>.<span class="why">The a's cancel — an ideal transformer is lossless (2‑9). Same for Q and S.</span></div>
    <div class="step">③ Impedance seen at primary: Z′<sub>L</sub> = V<sub>p</sub>/I<sub>p</sub> = (aV<sub>s</sub>)/(I<sub>s</sub>/a) = a²(V<sub>s</sub>/I<sub>s</sub>) = a²Z<sub>L</sub>.<span class="why">The turns ratio scales impedance by a² — the basis of impedance matching (2‑15).</span></div>
  </details>

  <style>@media(max-width:900px){.fvgrid{grid-template-columns:1fr!important}}</style>
  <h3>How the transformer works — voltage → flux → induced voltage</h3>
  <div class="card">
    <p>Put an AC voltage on the primary of a core that carries two windings and a loop of cause and effect starts — it is what makes the turns-ratio relations above true:</p>
    <div class="grid2">
      <div class="okbox"><b>① v(t) forces φ(t).</b> The coil has almost no resistance, so KVL says v = N·dφ/dt. The flux has no choice: <b>φ = (1/N)∫v dt</b>. For v = V<sub>m</sub> sin ωt this gives φ = −(V<sub>m</sub>/ωN) cos ωt — a flux of peak <b>φ<sub>m</sub> = V<sub>m</sub>/(ωN)</b> that <b>lags v by 90°</b>. The <em>voltage</em> sets the flux, not the current.</div>
      <div class="okbox"><b>② φ needs a magnetising current.</b> By Ampère's law (Ch.1 §1.4) the core needs ℱ = ℛφ, so the coil draws <b>i<sub>m</sub> = ℛφ/N</b> — in phase with φ, i.e. lagging v by 90°. The coil looks like a pure inductor.</div>
      <div class="okbox"><b>③ φ(t) induces a voltage back.</b> The same changing flux threads the coil, so Faraday gives <b>e<sub>ind</sub> = −N·dφ/dt = −v</b>: the same size as the applied voltage and <b>180° out of phase</b> — a <em>counter-emf</em> (Lenz) that exactly balances the source.</div>
      <div class="okbox"><b>④ … and in the secondary on the same core.</b> The secondary winding sees <b>v<sub>s</sub> = N<sub>s</sub>·dφ/dt</b>. Same φ in both windings, so <b>v<sub>p</sub>/v<sub>s</sub> = N<sub>p</sub>/N<sub>s</sub> = a</b> — Eq. (2‑1) falls straight out of Faraday's law.</div>
    </div>

  </div>

  <h3>Dot convention</h3>
  <div class="card note">Dots mark like-polarity ends. (1) V is positive at the dotted end on both sides together. (2) Current <i>into</i> the dotted end of one winding flows <i>out of</i> the dotted end of the other. This fixes secondary polarity without opening the transformer.</div>

  <h3>⭐ Properties &amp; uses of a transformer</h3>
  <p class="note">Five things the ideal-transformer relations (V<sub>s</sub>=V<sub>p</sub>/a, I<sub>s</sub>=aI<sub>p</sub>, Z′=a²Z<sub>L</sub>) let a transformer do:</p>

  <div class="card">
    <h4>1 · Step-up / step-down voltage</h4>
    <p>The core purpose. More secondary turns (a&lt;1) steps voltage <b>up</b>; fewer (a&gt;1) steps it <b>down</b>. Enables generation, high-voltage transmission and safe low-voltage use.</p>
    <svg viewBox="0 0 320 120" width="320">
      <rect x="120" y="20" width="80" height="80" fill="none" stroke="#3a4570" stroke-width="10"/>
      <g stroke="#5b8cff" stroke-width="3">${Array.from({length:7},(_,k)=>`<line x1="104" y1="${30+k*10}" x2="126" y2="${30+k*10}"/>`).join('')}</g>
      <g stroke="#ff9f43" stroke-width="3">${Array.from({length:3},(_,k)=>`<line x1="194" y1="${45+k*10}" x2="216" y2="${45+k*10}"/>`).join('')}</g>
      <text x="40" y="55" fill="#5b8cff" font-size="12">11 kV</text><text x="30" y="70" fill="#9aa3c4" font-size="10">N_p (many)</text>
      <text x="240" y="55" fill="#ff9f43" font-size="12">220 V</text><text x="240" y="70" fill="#9aa3c4" font-size="10">N_s (few)</text>
    </svg>
    <div class="okbox"><b>Example:</b> a distribution transformer N<sub>p</sub>:N<sub>s</sub> = 50:1 steps <b>11 kV → 220 V</b> (a=50). A generator step-up unit does the reverse (12 kV → 400 kV).</div>
  </div>

  <div class="card">
    <h4>2 · Step-up / step-down current</h4>
    <p>Because power is conserved, <b>current changes inversely to voltage</b>: I<sub>s</sub>=aI<sub>p</sub>. A voltage step-<i>down</i> is automatically a current step-<i>up</i> — the low-voltage side uses a thicker conductor.</p>
    <svg viewBox="0 0 320 110" width="320">
      <rect x="120" y="15" width="80" height="80" fill="none" stroke="#3a4570" stroke-width="10"/>
      <line x1="40" y1="55" x2="110" y2="55" stroke="#5b8cff" stroke-width="2"/><text x="30" y="45" fill="#5b8cff" font-size="11">230 V, 10 A</text>
      <line x1="210" y1="55" x2="290" y2="55" stroke="#ff9f43" stroke-width="8"/><text x="215" y="42" fill="#ff9f43" font-size="11">46 V, 50 A</text>
      <text x="150" y="108" fill="#9aa3c4" font-size="10">thick low-V winding</text>
    </svg>
    <div class="okbox"><b>Example:</b> an arc-welding / spot-welding transformer (a=5) turns <b>230 V, 10 A → 46 V, 50 A</b> — the huge secondary current melts the metal, same ~2.3 kVA both sides. Current transformers use the same idea for metering.</div>
  </div>

  <div class="card">
    <h4>3 · Impedance matching</h4>
    <p>The primary "sees" Z′=a²Z<sub>L</sub>. Choosing a lets you <b>match a load to a source</b> for maximum power transfer (source resistance = reflected load).</p>
    <svg viewBox="0 0 340 90" width="340">
      <rect x="20" y="30" width="50" height="34" fill="#12162a" stroke="#5b8cff"/><text x="45" y="52" fill="#5b8cff" font-size="11" text-anchor="middle">amp</text>
      <line x1="70" y1="47" x2="150" y2="47" stroke="#5b8cff" stroke-width="2"/>
      <rect x="150" y="26" width="40" height="42" fill="none" stroke="#3a4570" stroke-width="6"/>
      <line x1="190" y1="47" x2="260" y2="47" stroke="#ff9f43" stroke-width="2"/>
      <rect x="260" y="30" width="60" height="34" fill="#12162a" stroke="#ff9f43"/><text x="290" y="52" fill="#ff9f43" font-size="11" text-anchor="middle">8 Ω spkr</text>
      <text x="95" y="40" fill="#9aa3c4" font-size="10">Z′=a²·8</text>
    </svg>
    <div class="grid3">
      <label class="ctl"><span class="lab">Source Z<sub>s</sub> (Ω)</span><input type="number" id="im_Zs" value="800" step="any"></label>
      <label class="ctl"><span class="lab">Load Z<sub>L</sub> (Ω)</span><input type="number" id="im_ZL" value="8" step="any"></label>
      <div></div>
    </div>
    <div class="out" id="im_out"></div>
    <div class="okbox"><b>Example:</b> matching an <b>8 Ω speaker</b> to an amplifier whose output wants to see <b>800 Ω</b> needs a = √(800/8) = <b>10:1</b> audio output transformer.</div>
  </div>

  <div class="card">
    <h4>4 · Filtering / blocking DC while passing AC</h4>
    <p>A transformer couples only a <b>changing</b> flux (Faraday). A steady <b>DC</b> current makes a constant flux → <b>zero</b> induced secondary voltage, so DC cannot cross. The <b>AC</b> component passes normally. So the secondary carries the AC signal with any DC offset removed.</p>
    <canvas id="dc_can" width="420" height="180"></canvas>
    <div class="okbox"><b>Example:</b> an audio/signal <b>coupling transformer</b> passes the AC audio signal from one transistor stage to the next while <b>blocking the DC bias</b> voltage — protecting the following stage and removing the offset.</div>
  </div>

  <div class="card">
    <h4>5 · Isolation</h4>
    <p>Primary and secondary share <b>no electrical (galvanic) connection</b> — energy crosses only through the magnetic flux. This breaks ground loops and protects users from a live chassis while still delivering power.</p>
    <svg viewBox="0 0 340 110" width="340">
      <rect x="120" y="15" width="90" height="80" fill="none" stroke="#3a4570" stroke-width="10"/>
      <g stroke="#5b8cff" stroke-width="3">${Array.from({length:5},(_,k)=>`<line x1="104" y1="${30+k*11}" x2="126" y2="${30+k*11}"/>`).join('')}</g>

      <line x1="165" y1="8" x2="165" y2="102" stroke="#ff6b81" stroke-width="1.5" stroke-dasharray="4 4"/>

      <text x="120" y="110" fill="#ff6b81" font-size="10">no metallic path</text>
    </svg>
    <div class="okbox"><b>Example:</b> a <b>1:1 isolation transformer</b> (a=1, same voltage) on medical or test-bench equipment provides no voltage change — its whole job is safety isolation between the mains and the device.</div>
  </div>

    const {a,Vs,Is,Ip,p}=compute();
    cx.clearRect(0,0,420,300);
    // core
    cx.strokeStyle='#3a4570';cx.lineWidth=14;cx.strokeRect(150,60,120,150);
    // primary coils (count ~ Np), secondary (count ~ Ns)
    const pc=Math.max(3,Math.round(p.Np/90)),sc=Math.max(3,Math.round(p.Ns/90));
    cx.strokeStyle='#5b8cff';cx.lineWidth=3;for(let k=0;k<pc;k++){const y=80+k*(140/pc);cx.beginPath();cx.moveTo(136,y);cx.lineTo(164,y);cx.stroke();}
    cx.strokeStyle='#ff9f43';for(let k=0;k<sc;k++){const y=80+k*(140/sc);cx.beginPath();cx.moveTo(256,y);cx.lineTo(284,y);cx.stroke();}
    cx.fillStyle='#5b8cff';cx.font='12px system-ui';cx.fillText('N_p='+p.Np,90,74);cx.fillStyle='#ff9f43';cx.fillText('N_s='+p.Ns,290,74);
    // animated flux arrow
    const f=Math.sin(ph);cx.strokeStyle='rgba(255,107,129,'+(0.4+0.4*Math.abs(f))+')';cx.lineWidth=2;
    cx.beginPath();cx.moveTo(210,70);cx.lineTo(210,200);cx.stroke();cx.fillStyle='#ff6b81';cx.fillText('φ',214,135);
    // AC waveforms primary/secondary
    const midy=250,amp=28;
    cx.strokeStyle='#5b8cff';cx.lineWidth=2;cx.beginPath();
    for(let x=0;x<=140;x++){const t=x/140*4*Math.PI;const y=midy-Math.sin(t+ph)*amp*(p.Vp/480);x===0?cx.moveTo(20+x,y):cx.lineTo(20+x,y);}cx.stroke();
    cx.strokeStyle='#ff9f43';cx.beginPath();
    for(let x=0;x<=140;x++){const t=x/140*4*Math.PI;const y=midy-Math.sin(t+ph)*amp*(Vs/480);x===0?cx.moveTo(260+x,y):cx.lineTo(260+x,y);}cx.stroke();
    cx.fillStyle='#5b8cff';cx.fillText('v_p',24,midy-34);cx.fillStyle='#ff9f43';cx.fillText('v_s',264,midy-34);
    // bars for V and I
    function bar(x,y,w,c,label){cx.fillStyle=c;cx.fillRect(x,y,w,12);cx.fillStyle='#9aa3c4';cx.fillText(label,x,y-2);}
    bar(20,286,p.Vp/480*120,'#5b8cff','V_p '+fmt(p.Vp,0));
    bar(260,286,Vs/480*120,'#ff9f43','V_s '+fmt(Vs,0));
  }
  function loop(){if($('#sec-ideal').classList.contains('on')){ph+=0.05;draw();}raf=requestAnimationFrame(loop);}
  ['t_Np','t_Ns','t_Vp','t_Z'].forEach(id=>$('#'+id).oninput=draw);
  draw();cancelAnimationFrame(raf);loop();

  /* impedance-matching calculator */
  const imUpd=()=>{const Zs=+$('#im_Zs').value,ZL=+$('#im_ZL').value,a=Math.sqrt(Zs/ZL);
    $('#im_out').innerHTML=`For max power transfer, make Z′=a²Z<sub>L</sub> equal Z<sub>s</sub>:\na = √(Z<sub>s</sub>/Z<sub>L</sub>) = √(${fmt(Zs,2)}/${fmt(ZL,2)}) = <span class="k">${fmt(a,3)}</span>\n→ turns ratio N<sub>p</sub>:N<sub>s</sub> = <span class="k">${fmt(a,2)} : 1</span>`;};
  ['im_Zs','im_ZL'].forEach(id=>$('#'+id).oninput=imUpd);imUpd();

  /* DC-blocking waveform */
  const dcCan=$('#dc_can'),dcx=dcCan.getContext('2d');
  (function(){const W=420,Wm=W-30;dcx.clearRect(0,0,W,180);dcx.font='11px system-ui';
    dcx.strokeStyle='#232a49';dcx.beginPath();dcx.moveTo(20,70);dcx.lineTo(W-10,70);dcx.stroke();dcx.fillStyle='#9aa3c4';dcx.fillText('0',6,73);
    dcx.strokeStyle='#ffcc66';dcx.setLineDash([4,4]);dcx.beginPath();dcx.moveTo(20,45);dcx.lineTo(W-10,45);dcx.stroke();dcx.setLineDash([]);dcx.fillStyle='#ffcc66';dcx.fillText('DC level',W-70,42);
    dcx.strokeStyle='#5b8cff';dcx.lineWidth=2;dcx.beginPath();for(let x=0;x<=Wm;x++){const t=x/Wm*4*Math.PI;const y=45-Math.sin(t)*18;x===0?dcx.moveTo(20+x,y):dcx.lineTo(20+x,y);}dcx.stroke();
    dcx.fillStyle='#5b8cff';dcx.fillText('input: DC + AC (on primary)',24,18);
    dcx.strokeStyle='#232a49';dcx.beginPath();dcx.moveTo(20,150);dcx.lineTo(W-10,150);dcx.stroke();dcx.fillStyle='#9aa3c4';dcx.fillText('0',6,153);
    dcx.strokeStyle='#38d39f';dcx.lineWidth=2;dcx.beginPath();for(let x=0;x<=Wm;x++){const t=x/Wm*4*Math.PI;const y=150-Math.sin(t)*18;x===0?dcx.moveTo(20+x,y):dcx.lineTo(20+x,y);}dcx.stroke();

  })();

section('real','Real Transformer','2.4 · Real Transformer & Excitation',(el)=>{
  el.innerHTML=`
  <h2 class="title">Theory of Real Single-Phase Transformers</h2>
  <p class="subttl">§2.4 · Mutual & leakage flux, voltage/current ratios, the excitation current</p>
  <div class="grid2">
    <div class="eq" style="text-align:center">e<sub>ind</sub> = <span class="frac"><span class="n">dλ</span><span class="d">dt</span></span> = N<span class="frac"><span class="n">d φ̄</span><span class="d">dt</span></span><span class="tag">2‑17</span></div>
    <div class="eq" style="text-align:center">φ̄ = <span class="frac"><span class="n">1</span><span class="d">N<sub>p</sub></span></span> ∫ v<sub>p</sub> dt<span class="tag">2‑18</span></div>
  </div>
  <details class="deriv"><summary>Why N<sub>p</sub>i<sub>p</sub> ≈ N<sub>s</sub>i<sub>s</sub> (current ratio)</summary>
    <div class="step">① Net mmf drives the core flux: ℱ<sub>net</sub> = N<sub>p</sub>i<sub>p</sub> − N<sub>s</sub>i<sub>s</sub> = φ·ℛ.<span class="why">Dots: primary current in makes +mmf, secondary out makes −mmf (2‑32).</span></div>
    <div class="step">② A good core has tiny reluctance ℛ ≈ 0 until saturation.<span class="why">Very high permeability.</span></div>
    <div class="step">③ So ℱ<sub>net</sub> ≈ 0 → <b>N<sub>p</sub>i<sub>p</sub> ≈ N<sub>s</sub>i<sub>s</sub></b> → i<sub>p</sub>/i<sub>s</sub> ≈ N<sub>s</sub>/N<sub>p</sub>.<span class="why">This near-zero mmf is what gives the dot convention its meaning (2‑35).</span></div>
  </details>
  <div class="card">
    <b>Flux split:</b> φ<sub>p</sub> = φ<sub>M</sub> + φ<sub>LP</sub> — mutual flux φ<sub>M</sub> links both windings; leakage φ<sub>L</sub> links only one (returns through air). Smaller leakage → closer to ideal ratio (2‑28).
  </div>

  <h3>🔬 The magnetization current is <i>not</i> sinusoidal</h3>
  <p class="note">A sinusoidal voltage forces a sinusoidal flux (φ = −(V<sub>M</sub>/ωN)cos ωt). But the core saturates, so the <b>current</b> needed to make that flux is peaky and rich in harmonics. Push the core harder (raise V or lower turns) and watch the peaks grow — this is the origin of transformer harmonics and the voltage rating limit (§2.11).</p>
  <div class="card">
    <div class="grid2">
      <div>
        <label class="ctl"><span class="lab">Applied voltage (drives peak flux) <span class="val" id="m_V_v"></span></span><input type="range" id="m_V" min="40" max="130" value="100" step="1"></label>
        <label class="ctl"><span class="lab">Core saturation level φ<sub>sat</sub> <span class="val" id="m_sat_v"></span></span><input type="range" id="m_sat" min="105" max="180" value="120" step="1"></label>
        <div class="out" id="m_out"></div>
        <p class="note">Also shown: the flux (blue, always sinusoidal) and the magnetizing current (green). At high drive the current "spikes" near the flux peaks.</p>
      </div>
      <div><canvas id="m_can" width="420" height="300"></canvas></div>
    </div>
  </div>
  <div class="card note"><b>Excitation current</b> i<sub>ex</sub> = i<sub>M</sub> (magnetizing, lags V by 90°, from saturation) + i<sub>h+e</sub> (core-loss, <i>in phase</i> with V, largest as flux crosses zero because eddy currents ∝ dφ/dt). Together they form the small no-load current.</div>`;
  const can=$('#m_can'),cx=can.getContext('2d');
  const upd=()=>{
    const V=+$('#m_V').value/100, sat=+$('#m_sat').value/100;
    $('#m_V_v').textContent=Math.round(V*100)+'%';$('#m_sat_v').textContent=fmt(sat,2);
    const phiMax=V; // peak flux ∝ voltage
    // magnetizing current from inverse-saturation: i = atanh(phi/sat)
    const iOf=phi=>{const r=Math.max(-0.999,Math.min(0.999,phi/sat));return Math.atanh(r);};
    // sample to get peak & rms
    let peak=0,sum=0,n=200;const arr=[];
    for(let k=0;k<n;k++){const t=k/n*2*Math.PI;const phi=phiMax*Math.sin(t);const i=iOf(phi);arr.push(i);peak=Math.max(peak,Math.abs(i));sum+=i*i;}
    const rms=Math.sqrt(sum/n);
    const crest=peak/rms;
    $('#m_out').innerHTML=`Peak flux ∝ V (φ<sub>max</sub>=${fmt(phiMax,2)}), φ<sub>sat</sub>=${fmt(sat,2)}\nMagnetizing current peak = <span class="k">${fmt(peak,2)}</span> (rel.)\nrms = <span class="k">${fmt(rms,3)}</span>  ·  crest factor = <span class="k">${fmt(crest,2)}</span>\n${phiMax>sat*0.92?'⚠ heavily saturated — large harmonics':'moderate saturation'}`;
    // draw
    const W=420,H=300,mid=H/2,pad=30;cx.clearRect(0,0,W,H);
    cx.strokeStyle='#232a49';cx.beginPath();cx.moveTo(pad,mid);cx.lineTo(W-10,mid);cx.stroke();
    // flux (blue)
    cx.strokeStyle='#5b8cff';cx.lineWidth=2;cx.beginPath();
    for(let x=0;x<=W-pad-10;x++){const t=x/(W-pad-10)*4*Math.PI;const y=mid-phiMax*Math.sin(t)*90;x===0?cx.moveTo(pad+x,y):cx.lineTo(pad+x,y);}cx.stroke();
    // current (green) scaled to peak
    cx.strokeStyle='#38d39f';cx.beginPath();
    for(let x=0;x<=W-pad-10;x++){const t=x/(W-pad-10)*4*Math.PI;const phi=phiMax*Math.sin(t);const i=iOf(phi);const y=mid-i/Math.max(peak,0.01)*100;x===0?cx.moveTo(pad+x,y):cx.lineTo(pad+x,y);}cx.stroke();
    cx.fillStyle='#5b8cff';cx.font='12px system-ui';cx.fillText('flux φ (sinusoidal)',pad+4,18);
    cx.fillStyle='#38d39f';cx.fillText('magnetizing current i_M (peaky!)',pad+4,34);
  };
  ['m_V','m_sat'].forEach(id=>$('#'+id).oninput=upd);upd();
});

section('eqcirc','Real Transformer','2.5 · Equivalent Circuit ★ (core)',(el)=>{
  el.innerHTML=`
  <h2 class="title">The Equivalent Circuit of a Transformer</h2>
  <p class="subttl">§2.5 · The most important tool in the chapter — every real effect modeled as a circuit element</p>

  <style>@media(max-width:900px){.pvgrid{grid-template-columns:1fr!important}} .cor g[data-k]{transition:opacity .2s} .cor.dim g[data-k]{opacity:.15} .cor.dim g[data-k].hi{opacity:1}</style>
  <h3>Step 1 — Start on the primary side: where does the applied voltage go?</h3>
  <div class="card">
    <p>Apply <b>V<sub>p</sub></b> to the primary of a <em>real</em> transformer. The primary current I<sub>p</sub> has to pay two "tolls" before any voltage is left to drive the core:</p>
    <div class="grid3">
      <div class="okbox"><b>① Copper drop I<sub>p</sub>R<sub>p</sub>.</b> The winding is a long copper wire with resistance R<sub>p</sub>. Its drop is <b>in phase with I<sub>p</sub></b> and dissipates power (I²R heat).</div>
      <div class="okbox"><b>② Leakage drop jI<sub>p</sub>X<sub>p</sub>.</b> Part of the flux the primary makes closes through <em>air</em> and links only the primary — the <b>leakage flux φ<sub>LP</sub></b>. It induces L<sub>p</sub>di<sub>p</sub>/dt in its own winding, i.e. a series reactance X<sub>p</sub> = ωL<sub>p</sub>. The drop is <b>90° ahead of I<sub>p</sub></b>; no power is lost.</div>
      <div class="okbox"><b>③ What is left, E<sub>p</sub>, drives the core.</b> E<sub>p</sub> = N<sub>p</sub>dφ<sub>M</sub>/dt is the voltage induced by the <b>mutual flux φ<sub>M</sub></b> — the flux that actually reaches the secondary and induces E<sub>s</sub> = N<sub>s</sub>dφ<sub>M</sub>/dt there.</div>
    </div>
    <div class="eq">KVL around the primary:   <span class="vec">V</span><sub>p</sub> = <span class="vec">E</span><sub>p</sub> + <span class="vec">I</span><sub>p</sub>R<sub>p</sub> + j<span class="vec">I</span><sub>p</sub>X<sub>p</sub> <span class="tag">primary voltage equation</span></div>
    <div class="eq" style="font-size:16px">and its mirror on the secondary:   <span class="vec">E</span><sub>s</sub> = <span class="vec">V</span><sub>s</sub> + <span class="vec">I</span><sub>s</sub>R<sub>s</sub> + j<span class="vec">I</span><sub>s</sub>X<sub>s</sub>,   linked by   E<sub>p</sub>/E<sub>s</sub> = N<sub>p</sub>/N<sub>s</sub> = a   (same φ<sub>M</sub>)</div>
    <p class="note">Notice the pattern: on the primary the drops are <em>subtracted from</em> the applied voltage to leave E<sub>p</sub>; on the secondary the drops are <em>subtracted from</em> E<sub>s</sub> to leave the terminal voltage V<sub>s</sub>. The core in the middle only ever sees E<sub>p</sub> and E<sub>s</sub>.</p>
  </div>

  <h3>Step 2 — One-to-one: winding diagram ⇄ circuit diagram</h3>

    <div class="grid2" style="align-items:center">
      <svg class="cor" id="cor_mag" viewBox="0 0 340 250" style="width:100%">
        <text x="8" y="14" fill="#9aa3c4" font-size="11">Physical transformer — two windings on one core</text>
        <path d="M90 40 H250 V200 H90 Z M125 75 H215 V165 H125 Z" fill="#232a49" stroke="#3a4680" fill-rule="evenodd"/>
        <circle cx="34" cy="120" r="13" fill="#0b0e1c" stroke="#5b8cff" stroke-width="2"/><text x="34" y="124" fill="#5b8cff" font-size="10" text-anchor="middle">V_p</text>
        <path d="M34 107 V95 H83 M34 133 V145 H83" fill="none" stroke="#5b8cff" stroke-width="1.5"/>

        <text x="200" y="240" fill="#9aa3c4" font-size="10" text-anchor="middle">I_p meets ① then ② → node splits: ④ excitation vs ③ transfer → ⑤ ⑥ → load</text>
      </svg>
    </div>
  </div>

  <div class="card">
    <b>Step 3 — refer the secondary across the ideal transformer (×a²): the exact equivalent circuit on the primary side</b>
    <p class="note" style="margin:4px 0 8px">Multiply R<sub>s</sub>, X<sub>s</sub>, Z<sub>L</sub> by a² and V<sub>s</sub> by a; the ideal transformer disappears and the whole machine is one loop at one voltage level.</p>
    <svg viewBox="0 0 660 190" width="100%">
      <line x1="30" y1="55" x2="30" y2="160" stroke="#5b8cff" stroke-width="2"/>
      <circle cx="30" cy="107" r="16" fill="#0b0e1c" stroke="#5b8cff" stroke-width="2"/><text x="30" y="111" fill="#5b8cff" font-size="12" text-anchor="middle">V_p</text>
      <line x1="30" y1="55" x2="90" y2="55" stroke="#5b8cff" stroke-width="2"/>
      ${resH(90,140,55,'#ff6b81','R_p',40)}
      ${indH(146,196,55,'#ffcc66','jX_p',40)}
      <line x1="196" y1="55" x2="330" y2="55" stroke="#5b8cff" stroke-width="2"/>
      <circle cx="250" cy="55" r="3" fill="#5b8cff"/>
      <line x1="221" y1="75" x2="281" y2="75" stroke="#5b8cff" stroke-width="2"/>
      <line x1="250" y1="55" x2="250" y2="75" stroke="#5b8cff" stroke-width="2"/>
      <line x1="221" y1="75" x2="221" y2="92" stroke="#5b8cff" stroke-width="2"/><line x1="281" y1="75" x2="281" y2="92" stroke="#5b8cff" stroke-width="2"/>
      ${resV(221,92,126,'#38d39f','R_C',206)}
      ${indV(281,92,126,'#5b8cff','jX_M',296)}
      <line x1="221" y1="126" x2="221" y2="160" stroke="#5b8cff" stroke-width="2"/><line x1="281" y1="126" x2="281" y2="160" stroke="#5b8cff" stroke-width="2"/>
      ${resH(330,382,55,'#ff6b81','a²R_s',40)}
      ${indH(392,444,55,'#ffcc66','ja²X_s',40)}
      <line x1="444" y1="55" x2="540" y2="55" stroke="#5b8cff" stroke-width="2"/>
      <line x1="540" y1="55" x2="540" y2="160" stroke="#38d39f" stroke-width="2"/>
      <text x="548" y="100" fill="#38d39f" font-size="12">aV_s</text><text x="548" y="120" fill="#9aa3c4" font-size="10">load a²Z_L</text>
      <line x1="30" y1="160" x2="540" y2="160" stroke="#5b8cff" stroke-width="2"/>
      <text x="96" y="182" fill="#9aa3c4" font-size="10">series: copper R + leakage X</text>
      <text x="360" y="182" fill="#9aa3c4" font-size="10">secondary referred (×a²)</text>
      <text x="200" y="150" fill="#9aa3c4" font-size="10">shunt excitation branch</text>
    </svg>
    <p class="note">Four real effects, four elements: <b>winding copper loss</b> → R<sub>p</sub>,R<sub>s</sub>; <b>leakage flux</b> → X<sub>p</sub>,X<sub>s</sub>; <b>core loss</b> → R<sub>C</sub>; <b>magnetization</b> → X<sub>M</sub>. Work through each below.</p>
  </div>

  <div class="tabs" id="etabs">
    <div class="t on" data-p="loss">1 · Losses</div>
    <div class="t" data-p="leak">2 · Leakage reactance</div>
    <div class="t" data-p="mag">3 · Magnetizing branch & I₀</div>
    <div class="t" data-p="refer">4 · Refer to 1° / 2°</div>
    <div class="t" data-p="approx">5 · Approximation</div>
    <div class="t" data-p="tests">OC / SC tests</div>
  </div>

  <div id="ep_loss" class="epanel">
    <h3>Core loss & copper loss</h3>
    <div class="grid2">
      <div class="card tight"><b>Copper (I²R) loss</b> — resistive heating in the windings, modeled by R<sub>p</sub>, R<sub>s</sub>. <b>Varies with load²</b> (P<sub>Cu</sub> = I²R<sub>eq</sub>).</div>
      <div class="card tight"><b>Core (iron) loss</b> — hysteresis + eddy currents, modeled by R<sub>C</sub>. Set by the flux (voltage), so it is <b>essentially constant</b> from no-load to full-load.</div>
    </div>
    <div class="card">
      <div class="grid2">
        <div>
          <label class="ctl"><span class="lab">Rated apparent power (kVA) <span class="val" id="ls_S_v"></span></span><input type="range" id="ls_S" min="1" max="50" value="15" step="1"></label>
          <label class="ctl"><span class="lab">Full-load copper loss P<sub>Cu,fl</sub> (W) <span class="val" id="ls_cu_v"></span></span><input type="range" id="ls_cu" min="50" max="500" value="189" step="1"></label>
          <label class="ctl"><span class="lab">Core loss P<sub>core</sub> (W) <span class="val" id="ls_co_v"></span></span><input type="range" id="ls_co" min="10" max="300" value="53" step="1"></label>
          <label class="ctl"><span class="lab">Load level <span class="val" id="ls_x_v"></span></span><input type="range" id="ls_x" min="0" max="100" value="100" step="1"></label>
          <label class="ctl"><span class="lab">Power factor <span class="val" id="ls_pf_v"></span></span><input type="range" id="ls_pf" min="0.5" max="1" value="0.8" step="0.01"></label>
          <div class="out" id="ls_out"></div>
        </div>
        <div><canvas id="ls_can" width="420" height="260"></canvas><div class="note" style="text-align:center">copper loss (∝ load²) vs constant core loss</div></div>
      </div>
    </div>
  </div>

  <div id="ep_leak" class="epanel" style="display:none">
    <h3>Leakage flux → leakage reactance</h3>
    <p>Not all flux links both windings — the part that escapes into air and links only one winding is <b>leakage flux</b>. Because its path is mostly air (constant reluctance), it is proportional to the winding current, so it behaves as a <b>series inductance</b>.</p>
    <details class="deriv" open><summary>Derive X<sub>p</sub> = ωL<sub>p</sub></summary>
      <div class="step">① Leakage flux ∝ current: φ<sub>LP</sub> = (𝒫·N<sub>p</sub>)i<sub>p</sub>.<span class="why">𝒫 = permeance of the (air) leakage path — nearly constant (2‑37).</span></div>
      <div class="step">② Faraday on the leakage flux: e<sub>LP</sub> = N<sub>p</sub> dφ<sub>LP</sub>/dt = N<sub>p</sub>²𝒫 · di<sub>p</sub>/dt = L<sub>p</sub> di<sub>p</sub>/dt.<span class="why">L<sub>p</sub> = N<sub>p</sub>²𝒫 is the primary leakage inductance (2‑38,2‑39).</span></div>
      <div class="step">③ In an AC circuit this inductance is a series reactance X<sub>p</sub> = ωL<sub>p</sub> = 2πf L<sub>p</sub>.<span class="why">Same for the secondary: X<sub>s</sub> = ωL<sub>s</sub>. These add to R to form the series branch.</span></div>
    </details>
    <div class="card">
      <svg viewBox="0 0 460 150" width="100%">
        <rect x="140" y="20" width="180" height="110" rx="6" fill="none" stroke="#3a4570" stroke-width="12"/>
        <path d="M160 75 C 220 55, 260 55, 300 75" fill="none" stroke="#ff6b81" stroke-width="2" stroke-dasharray="4 4"/><text x="220" y="50" fill="#ff6b81" font-size="11">mutual φ_M (links both)</text>
        <path d="M150 95 C 130 120, 120 60, 150 55" fill="none" stroke="#ffcc66" stroke-width="2"/><text x="60" y="130" fill="#ffcc66" font-size="11">leakage φ_LP (air)</text>
        <g stroke="#38d39f" stroke-width="3">${Array.from({length:5},(_,k)=>`<line x1="128" y1="${40+k*15}" x2="152" y2="${40+k*15}"/>`).join('')}</g>
        <g stroke="#ff9f43" stroke-width="3">${Array.from({length:5},(_,k)=>`<line x1="308" y1="${40+k*15}" x2="332" y2="${40+k*15}"/>`).join('')}</g>
      </svg>
      <h4>Reactance calculator</h4>
      <div class="grid3">
        <label class="ctl"><span class="lab">Leakage inductance L (mH)</span><input type="number" id="lk_L" value="2" step="any"></label>
        <label class="ctl"><span class="lab">Frequency f (Hz)</span><input type="number" id="lk_f" value="60" step="any"></label>
        <label class="ctl"><span class="lab">Winding current (A)</span><input type="number" id="lk_I" value="65" step="any"></label>
      </div>
      <div class="out" id="lk_out"></div>
    </div>
  </div>

  <div id="ep_mag" class="epanel" style="display:none">
    <h3>Magnetizing branch (R<sub>C</sub>, X<sub>M</sub>) & the no-load current</h3>
    <p>With the secondary open, the small primary current is the <b>no-load / excitation current I₀</b>. It has two parts: a <b>core-loss (working) component I<sub>w</sub></b> in phase with V (through R<sub>C</sub>), and a <b>magnetizing component I<sub>μ</sub></b> lagging V by 90° (through X<sub>M</sub>).</p>
    <div class="grid2">
      <div class="eq" style="text-align:center">I<sub>w</sub> = I₀cos φ₀,  I<sub>μ</sub> = I₀sin φ₀</div>
      <div class="eq" style="text-align:center">R<sub>C</sub> = V/I<sub>w</sub> = V²/P<sub>core</sub>,  X<sub>M</sub> = V/I<sub>μ</sub></div>
    </div>
    <div class="card">
      <div class="grid2">
        <div>
          <label class="ctl"><span class="lab">No-load voltage V (V)</span><input type="number" id="mg_V" value="2300" step="any"></label>
          <label class="ctl"><span class="lab">No-load current I₀ (A)</span><input type="number" id="mg_I" value="0.21" step="any"></label>
          <label class="ctl"><span class="lab">No-load power P<sub>core</sub> (W)</span><input type="number" id="mg_P" value="50" step="any"></label>
          <div class="out" id="mg_out"></div>
          <p class="note">Defaults ≈ Example 2‑5 open-circuit data → R<sub>C</sub>≈105 kΩ, X<sub>M</sub>≈11 kΩ.</p>
        </div>
        <div><canvas id="mg_can" width="380" height="230"></canvas><div class="note" style="text-align:center">no-load current phasor (I₀ = I<sub>w</sub> + I<sub>μ</sub>)</div></div>
      </div>
    </div>
  </div>

  <div id="ep_refer" class="epanel" style="display:none">
    <h3>Referring the circuit to one side & converting between them</h3>
    <p>To solve, collapse everything to a <b>single voltage level</b>. Moving an element <b>secondary → primary</b> multiplies impedance by a²; <b>primary → secondary</b> divides by a². (a = N<sub>p</sub>/N<sub>s</sub>.)</p>
    <div class="grid2">
      <div class="eq" style="text-align:center">R<sub>eq,p</sub> = R<sub>p</sub> + a²R<sub>s</sub><br>X<sub>eq,p</sub> = X<sub>p</sub> + a²X<sub>s</sub></div>
      <div class="eq" style="text-align:center">R<sub>eq,s</sub> = R<sub>eq,p</sub>/a²<br>X<sub>eq,s</sub> = X<sub>eq,p</sub>/a²</div>
    </div>
    <div class="card">
      <div class="grid3">
        <label class="ctl"><span class="lab">a = N<sub>p</sub>/N<sub>s</sub></span><input type="number" id="rf_a" value="10" step="any"></label>
        <label class="ctl"><span class="lab">R<sub>p</sub> (Ω)</span><input type="number" id="rf_Rp" value="4.45" step="any"></label>
        <label class="ctl"><span class="lab">X<sub>p</sub> (Ω)</span><input type="number" id="rf_Xp" value="6.45" step="any"></label>
        <label class="ctl"><span class="lab">R<sub>s</sub> (Ω)</span><input type="number" id="rf_Rs" value="0" step="any"></label>
        <label class="ctl"><span class="lab">X<sub>s</sub> (Ω)</span><input type="number" id="rf_Xs" value="0" step="any"></label>
      </div>
      <div class="out" id="rf_out"></div>
      <p class="note">Defaults ≈ Example 2‑5 series impedance (all on the primary): R<sub>eq,p</sub>=4.45 Ω, X<sub>eq,p</sub>=6.45 Ω → referred to secondary (a=10): 0.0445 Ω, 0.0645 Ω.</p>
    </div>
  </div>

  <div id="ep_approx" class="epanel" style="display:none">
    <h3>Approximate equivalent circuit</h3>
    <p>The exact circuit has the excitation branch <i>between</i> the primary and secondary series impedances, which adds a node. Because I₀ is tiny (~2–5% of full load), we make two simplifications with negligible error:</p>
    <div class="grid2">
      <div class="card tight"><b>Approximate:</b> push the shunt branch to the input (or output) terminals, then the two series impedances simply add: Z<sub>eq</sub> = (R<sub>p</sub>+a²R<sub>s</sub>) + j(X<sub>p</sub>+a²X<sub>s</sub>).</div>
      <div class="card tight"><b>Series-only:</b> for many calculations the excitation branch is dropped entirely — just Z<sub>eq</sub> in series with the load.</div>
    </div>
    <div class="card">
      <svg viewBox="0 0 560 120" width="100%">
        <line x1="20" y1="40" x2="70" y2="40" stroke="#5b8cff" stroke-width="2"/>
        <line x1="70" y1="40" x2="70" y2="95" stroke="#5b8cff" stroke-width="2"/>
        ${resV(60,52,84,'#38d39f','R_C')}${indV(82,52,84,'#5b8cff','jX_M',92)}
        <line x1="70" y1="40" x2="150" y2="40" stroke="#5b8cff" stroke-width="2"/>
        ${resH(150,202,40,'#ff6b81','R_eq',24)}
        ${indH(212,264,40,'#ffcc66','jX_eq',24)}
        <line x1="264" y1="40" x2="360" y2="40" stroke="#5b8cff" stroke-width="2"/>
        <line x1="360" y1="40" x2="360" y2="95" stroke="#38d39f" stroke-width="2"/><text x="368" y="72" fill="#38d39f" font-size="11">load</text>
        <line x1="20" y1="95" x2="360" y2="95" stroke="#5b8cff" stroke-width="2"/>
        <text x="20" y="112" fill="#9aa3c4" font-size="10">shunt moved to input · series impedances added</text>
      </svg>
    </div>
  </div>

  <div id="ep_tests" class="epanel" style="display:none">
    <h3>🧪 Finding the elements — open-circuit & short-circuit tests <span class="badge">Example 2‑2</span></h3>
    <details class="deriv"><summary>How the two tests isolate the two branches</summary>
      <div class="step">① <b>OC test</b> (rated V, secondary open): only excitation current flows → all power is core loss → gives R<sub>C</sub>, X<sub>M</sub>.<span class="why">Y<sub>E</sub>=I<sub>OC</sub>/V<sub>OC</sub> ∠−θ; G<sub>C</sub>=1/R<sub>C</sub>, B<sub>M</sub>=1/X<sub>M</sub>.</span></div>
      <div class="step">② <b>SC test</b> (secondary shorted, low V to rated I): excitation branch sees ~0 V → all power is copper loss → gives R<sub>eq</sub>, X<sub>eq</sub>.<span class="why">Z<sub>SE</sub>=V<sub>SC</sub>/I<sub>SC</sub> ∠θ.</span></div>
    </details>
    <div class="card">
      <div class="grid2">
        <div>
          <h4>Open-circuit test</h4>
          <div class="grid3">
            <label class="ctl"><span class="lab">V<sub>OC</sub> (V)</span><input type="number" id="oc_V" value="8000" step="any"></label>
            <label class="ctl"><span class="lab">I<sub>OC</sub> (A)</span><input type="number" id="oc_I" value="0.214" step="any"></label>
            <label class="ctl"><span class="lab">P<sub>OC</sub> (W)</span><input type="number" id="oc_P" value="400" step="any"></label>
          </div>
          <h4>Short-circuit test</h4>
          <div class="grid3">
            <label class="ctl"><span class="lab">V<sub>SC</sub> (V)</span><input type="number" id="sc_V" value="489" step="any"></label>
            <label class="ctl"><span class="lab">I<sub>SC</sub> (A)</span><input type="number" id="sc_I" value="2.5" step="any"></label>
            <label class="ctl"><span class="lab">P<sub>SC</sub> (W)</span><input type="number" id="sc_P" value="240" step="any"></label>
          </div>
        </div>
        <div class="out" id="test_out"></div>
      </div>
      <p class="note">Defaults = Example 2‑2 (20 kVA, 8000/240 V) → R<sub>C</sub>≈159 kΩ, X<sub>M</sub>≈38.4 kΩ, R<sub>eq</sub>≈38.4 Ω, X<sub>eq</sub>≈192 Ω.</p>
    </div>
  </div>

`;

  /* tab switching — redraw the panel's canvas on show (a canvas drawn while
     display:none can paint blank until a repaint is forced) */
  $$('#etabs .t').forEach(t=>t.onclick=()=>{
    $$('#etabs .t').forEach(x=>x.classList.toggle('on',x===t));
    $$('.epanel').forEach(p=>p.style.display='none');
    $('#ep_'+t.dataset.p).style.display='';
    const redraw={loss:()=>lsUpd(),mag:()=>mgUpd()}[t.dataset.p];
    if(redraw)requestAnimationFrame(redraw);
  });

  /* 1 · losses */
  const lsCan=$('#ls_can'),lsx=lsCan.getContext('2d');
  const lsUpd=()=>{
    const S=+$('#ls_S').value*1000,Cu=+$('#ls_cu').value,Co=+$('#ls_co').value,x=+$('#ls_x').value/100,pf=+$('#ls_pf').value;
    $('#ls_S_v').textContent=(S/1000)+' kVA';$('#ls_cu_v').textContent=Cu+' W';$('#ls_co_v').textContent=Co+' W';$('#ls_x_v').textContent=Math.round(x*100)+'%';$('#ls_pf_v').textContent=fmt(pf,2);
    const Pcu=x*x*Cu,Pout=x*S*pf,eff=Pout/(Pout+Pcu+Co)*100;
    $('#ls_out').innerHTML=`P<sub>Cu</sub> = x²·P<sub>Cu,fl</sub> = <span class="k">${fmt(Pcu,1)} W</span>\nP<sub>core</sub> = <span class="k">${fmt(Co,1)} W</span> (constant)\nP<sub>out</sub> = xS·PF = <span class="k">${fmt(Pout,0)} W</span>\nη = <span class="k">${fmt(eff,2)} %</span>`;
    axes(lsx,420,260,{l:44,r:10,t:14,b:26},'load','loss (W)');
    const maxL=Math.max(Cu,Co)*1.1;const yY=v=>(260-26)-v/maxL*(260-40);
    lsx.strokeStyle='#5b8cff';lsx.lineWidth=1.5;lsx.beginPath();lsx.moveTo(44,yY(Co));lsx.lineTo(420-10,yY(Co));lsx.stroke();
    lsx.fillStyle='#5b8cff';lsx.font='11px system-ui';lsx.fillText('core (const)',50,yY(Co)-4);
    lsx.strokeStyle='#ff6b81';lsx.lineWidth=2.5;lsx.beginPath();
    for(let f=0;f<=1;f+=0.02){const xx=44+f*(420-54),yy=yY(f*f*Cu);f===0?lsx.moveTo(xx,yy):lsx.lineTo(xx,yy);}lsx.stroke();
    lsx.fillStyle='#ff6b81';lsx.fillText('copper (∝ load²)',260,60);
    const mx=44+x*(420-54);lsx.strokeStyle='#38d39f';lsx.setLineDash([4,4]);lsx.beginPath();lsx.moveTo(mx,14);lsx.lineTo(mx,260-26);lsx.stroke();lsx.setLineDash([]);
  };
  ['ls_S','ls_cu','ls_co','ls_x','ls_pf'].forEach(id=>$('#'+id).oninput=lsUpd);lsUpd();

  /* 2 · leakage */
  const lkUpd=()=>{const L=+$('#lk_L').value/1000,f=+$('#lk_f').value,I=+$('#lk_I').value,X=2*Math.PI*f*L,V=I*X;
    $('#lk_out').innerHTML=`X = 2πfL = 2π·${f}·${fmt(L,4)} = <span class="k">${fmt(X,3)} Ω</span>\nLeakage voltage drop = I·X = <span class="k">${fmt(V,2)} V</span>`;};
  ['lk_L','lk_f','lk_I'].forEach(id=>$('#'+id).oninput=lkUpd);lkUpd();

  /* 3 · magnetizing branch */
  const mgCan=$('#mg_can'),mgx=mgCan.getContext('2d');
  const mgUpd=()=>{
    const V=+$('#mg_V').value,I0=+$('#mg_I').value,P=+$('#mg_P').value;
    const cos=Math.min(1,P/(V*I0)),phi=Math.acos(cos),Iw=I0*cos,Imu=I0*Math.sin(phi),Rc=V/Iw,Xm=V/Imu;
    const ohm=v=>v>=1000?fmt(v/1000,2)+' kΩ':fmt(v,1)+' Ω';
    $('#mg_out').innerHTML=`cos φ₀ = P/(V·I₀) = <span class="k">${fmt(cos,3)}</span>  (φ₀=${fmt(phi*R2D,1)}°)\nI<sub>w</sub> = I₀cos φ₀ = <span class="k">${fmt(Iw,4)} A</span>\nI<sub>μ</sub> = I₀sin φ₀ = <span class="k">${fmt(Imu,4)} A</span>\nR<sub>C</sub> = V/I<sub>w</sub> = <span class="k">${ohm(Rc)}</span>\nX<sub>M</sub> = V/I<sub>μ</sub> = <span class="k">${ohm(Xm)}</span>`;
    // phasor
    mgx.clearRect(0,0,380,230);const ox=50,oy=70,sc=Math.min(260/I0,120/Math.max(Imu,0.001));
    mgx.strokeStyle='#232a49';mgx.beginPath();mgx.moveTo(ox,oy);mgx.lineTo(370,oy);mgx.stroke();
    function arr(x1,y1,c,lab){mgx.strokeStyle=c;mgx.lineWidth=2.5;mgx.beginPath();mgx.moveTo(ox,oy);mgx.lineTo(x1,y1);mgx.stroke();
      const a=Math.atan2(y1-oy,x1-ox);mgx.beginPath();mgx.moveTo(x1,y1);mgx.lineTo(x1-9*Math.cos(a-0.4),y1-9*Math.sin(a-0.4));mgx.moveTo(x1,y1);mgx.lineTo(x1-9*Math.cos(a+0.4),y1-9*Math.sin(a+0.4));mgx.stroke();
      mgx.fillStyle=c;mgx.font='12px system-ui';mgx.fillText(lab,x1+4,y1);}
    arr(ox+180,oy,'#38d39f','V (ref)');
    arr(ox+Iw*sc,oy,'#5b8cff','I_w');
    arr(ox,oy+Imu*sc,'#ffcc66','I_μ');
    arr(ox+Iw*sc,oy+Imu*sc,'#ff6b81','I₀');
  };
  ['mg_V','mg_I','mg_P'].forEach(id=>$('#'+id).oninput=mgUpd);mgUpd();

  /* 4 · refer */
  const rfUpd=()=>{const a=+$('#rf_a').value,Rp=+$('#rf_Rp').value,Xp=+$('#rf_Xp').value,Rs=+$('#rf_Rs').value,Xs=+$('#rf_Xs').value;
    const Reqp=Rp+a*a*Rs,Xeqp=Xp+a*a*Xs,Reqs=Reqp/(a*a),Xeqs=Xeqp/(a*a);
    $('#rf_out').innerHTML=`Referred to PRIMARY (×a²):\n  R<sub>eq,p</sub> = R<sub>p</sub>+a²R<sub>s</sub> = <span class="k">${fmt(Reqp,4)} Ω</span>\n  X<sub>eq,p</sub> = X<sub>p</sub>+a²X<sub>s</sub> = <span class="k">${fmt(Xeqp,4)} Ω</span>\nReferred to SECONDARY (÷a²):\n  R<sub>eq,s</sub> = <span class="k">${fmt(Reqs,5)} Ω</span>\n  X<sub>eq,s</sub> = <span class="k">${fmt(Xeqs,5)} Ω</span>`;};
  ['rf_a','rf_Rp','rf_Xp','rf_Rs','rf_Xs'].forEach(id=>$('#'+id).oninput=rfUpd);rfUpd();

  /* OC/SC tests */
  const testUpd=()=>{
    const Voc=+$('#oc_V').value,Ioc=+$('#oc_I').value,Poc=+$('#oc_P').value;
    const Vsc=+$('#sc_V').value,Isc=+$('#sc_I').value,Psc=+$('#sc_P').value;
    const pfoc=Poc/(Voc*Ioc),toc=Math.acos(Math.min(1,pfoc));
    const Ye=Ioc/Voc,Gc=Ye*Math.cos(toc),Bm=Ye*Math.sin(toc),Rc=1/Gc,Xm=1/Bm;
    const pfsc=Psc/(Vsc*Isc),tsc=Math.acos(Math.min(1,pfsc));
    const Zse=Vsc/Isc,Req=Zse*Math.cos(tsc),Xeq=Zse*Math.sin(tsc);
    $('#test_out').innerHTML=
`OPEN-CIRCUIT (excitation branch)
 PF = ${fmt(pfoc,3)} lag  →  θ = ${fmt(toc*R2D,1)}°
 R_C = <span class="k">${fmt(Rc,4)} Ω</span>  (${fmt(Rc/1000,1)} kΩ)
 X_M = <span class="k">${fmt(Xm,4)} Ω</span>  (${fmt(Xm/1000,1)} kΩ)

SHORT-CIRCUIT (series branch)
 PF = ${fmt(pfsc,3)} lag  →  θ = ${fmt(tsc*R2D,1)}°
 Z_SE = ${fmt(Zse,2)} ∠${fmt(tsc*R2D,1)}° Ω
 R_eq = <span class="k">${fmt(Req,3)} Ω</span>   X_eq = <span class="k">${fmt(Xeq,3)} Ω</span>`;
  };
  ['oc_V','oc_I','oc_P','sc_V','sc_I','sc_P'].forEach(id=>$('#'+id).oninput=testUpd);testUpd();


  /* ---- primary side: correspondence tags + voltage-equation phasors ---- */
  const corSet=k=>{$$('#cor_tabs .t').forEach(t=>t.classList.toggle('on',t.dataset.k===k));['cor_mag','cor_ckt'].forEach(id=>{const s=$('#'+id);s.classList.toggle('dim',k!=='0');$$('g[data-k]',s).forEach(g=>g.classList.toggle('hi',g.dataset.k===k));});};
  $$('#cor_tabs .t').forEach(t=>t.onclick=()=>corSet(t.dataset.k));corSet('0');
});
